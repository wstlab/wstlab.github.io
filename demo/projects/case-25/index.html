</style></head><body><main class="studio"><section class="intro"><small>QUICKFORM / ACTIVITIES</small><h1>课堂签到 · 演示班级</h1><p>仅演示代号和新记录；点选代号不宣称有真实身份验证。</p><div class="mark">✓</div><p>这里使用演示身份和模拟活动。提交后，可在数据大屏及 QuickForm 记录页核对结果。</p></section><form class="form" id="activity-form"><label>演示称呼<input name="alias" value="探索者01" required maxlength="30"></label><label>演示小组<select name="group"><option>第一组</option><option>第二组</option><option>第三组</option><option>第四组</option></select></label><label>演示序号<select name="serial"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option><option>32</option><option>33</option><option>34</option><option>35</option><option>36</option><option>37</option><option>38</option><option>39</option><option>40</option><option>41</option><option>42</option><option>43</option><option>44</option><option>45</option><option>46</option><option>47</option><option>48</option><option>49</option><option>50</option></select></label><label>参与状态<select name="status"><option>已到课堂</option><option>线上参与</option></select></label><button type="submit" id="save-activity">提交学习记录</button></form></main><script>
document.addEventListener('DOMContentLoaded',()=>{
const form=document.getElementById('activity-form');let cipher='';
function transform(){if(25!==43)return;const data=Object.fromEntries(new FormData(form)),shift=Number(data.shift)*(data.direction==='解码'?-1:1);cipher=(data.plain||'').replace(/[a-z]/gi,x=>{let base=x<='Z'?65:97;return String.fromCharCode((x.charCodeAt(0)-base+shift+26)%26+base)});document.getElementById('cipher-result').textContent=cipher||'输入字母，观察字母表的平移';document.getElementById('shift-label').textContent=data.shift;}
form.addEventListener('input',transform);form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form));if(25===43){transform();data.cipher=cipher;data.shift=Number(data.shift);}for(const k of ['people','clarity','engagement','feedback'])if(data[k]&&/^\d+$/.test(data[k]))data[k]=Number(data[k]);const b=document.getElementById('save-activity');b.disabled=true;try{await CaseFlow.send(data);}catch{}finally{b.disabled=false;}});
});
