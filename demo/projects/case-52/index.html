<div class="container">
    <h1>✨ 火烧云 · 七彩练习营 ✨</h1>

        <div class="card" id="module1">

            <button class="btn-check" id="checkCompareBtn">✅ 核对 & 指导</button>
            <div id="compareScore" class="score-area">📚 正确率: --</div>
            <div id="compareFeedback" class="feedback">🔍 形近字要仔细区分哦！</div>
        </div>

    <div class="submit-section">
        <div class="name-input">
            <label style="font-weight:bold;">👧🧑 你的姓名：</label>

        </div>

        <div id="submitMsg" style="margin-top: 16px; font-weight:bold;"></div>

<script>
    // ---------- 1. 看拼音写词语 数据 (分层：3基础 + 1进阶挑战) ----------
    const pinyinData = [
        { pinyin: "huǒ shāo yún", answer: "火烧云", level: "基础", hint: "天空中的红色云霞，课文标题词" },
        { pinyin: "xiào yíng yíng", answer: "笑盈盈", level: "基础", hint: "形容笑容满面的样子" },
        { pinyin: "hóng tóng tóng", answer: "红彤彤", level: "基础", hint: "形容很红，ABB式颜色词" },
        { pinyin: "jīn càn càn", answer: "金灿灿", level: "进阶🌟", hint: "金光耀眼，课文描写颜色变化" }
    ];

    // 模块1 DOM 生成
    const pinyinContainer = document.getElementById("pinyinWordsList");
    let pinyinInputs = [];
    function renderPinyin() {
        pinyinContainer.innerHTML = "";
        pinyinInputs = [];
        pinyinData.forEach((item, idx) => {
            const div = document.createElement("div");
            div.className = "question-item";
            div.setAttribute("data-idx", idx);
            div.innerHTML = `
                <div class="pinyin">${item.pinyin} ${item.level === "进阶🌟" ? '🔥挑战题' : '📘基础题'}</div>
                <input type="text" placeholder="写出词语" id="pinyin_input_${idx}" autocomplete="off">
                <div style="font-size:12px; color:#b97f3a;">💡 提示: ${item.hint}</div>
            `;
            pinyinContainer.appendChild(div);
            pinyinInputs.push(document.getElementById(`pinyin_input_${idx}`));
        });
    }
    renderPinyin();

    // 存储每个模块的正确率及详细结果 (用于提交)
    let pinyinCorrectRate = null;      // 0~1 小数
    let pinyinDetail = { correct: 0, total: pinyinData.length, wrongList: [] };
    let fillCorrectRate = null;
    let fillDetail = { correct: 0, total: 0, wrongList: [] };
    let compareCorrectRate = null;
    let compareDetail = { correct: 0, total: 0, wrongList: [] };

    // 获取拼音模块正确率 & 个性化反馈
    function computePinyinAccuracy() {
        let total = pinyinData.length;
        let correctCount = 0;
        let wrongIndices = [];
        pinyinData.forEach((item, idx) => {
            const userVal = pinyinInputs[idx]?.value.trim() || "";
            const stdAnswer = item.answer;
            if (userVal === stdAnswer) {
                correctCount++;
            } else {
                wrongIndices.push(idx);
            }
        });
        const rate = total === 0 ? 0 : (correctCount / total);
        pinyinDetail = { correct: correctCount, total: total, wrongList: wrongIndices };
        pinyinCorrectRate = rate;
        document.getElementById("pinyinScore").innerHTML = `⚡ 正确率: ${Math.round(rate * 100)}% (${correctCount}/${total})`;
        // 个性化指导
        let guideMsg = "";
        if (rate === 1) {
            guideMsg = "🎉 太棒了！看拼音写词语全对！可以挑战自己默写课文句子哦！";
        } else if (rate >= 0.5) {
            guideMsg = "👍 不错！但有错误词语，请对照课文生字表多写几遍。错误词语：";
            let wrongWords = wrongIndices.map(i => `${pinyinData[i].pinyin} (正确答案:${pinyinData[i].answer})`).join("；");
            guideMsg += wrongWords + "。建议重点复习红彤彤、笑盈盈等ABB词语。";
        } else {
            guideMsg = "📖 需要加强生字词记忆！建议：先抄写课文生字，再根据拼音默写。错词：" + 
                        wrongIndices.map(i => `${pinyinData[i].pinyin} ➜ ${pinyinData[i].answer}`).join("、") + "。反复听写巩固。";
        }
        document.getElementById("pinyinFeedback").innerHTML = `🧭 个性化指导：${guideMsg}`;
        // 高亮错误输入框
        document.querySelectorAll("#pinyinWordsList .question-item").forEach((item, i) => {
            const inputField = item.querySelector("input");
            if (wrongIndices.includes(i)) {
                item.classList.add("wrong-highlight");
                item.classList.remove("right-highlight");
                if (inputField) inputField.style.border = "2px solid #e74c3c";
            } else {
                item.classList.remove("wrong-highlight");
                item.classList.add("right-highlight");
                if (inputField) inputField.style.border = "2px solid #a5d6a5";
            }
        });
        updateGlobalTotalRate();
        return rate;
    }

    // ---------- 2. 根据课文内容填空 (基于原文 3个挖空 分层 基础两个+一个挑战) ----------
    const fillData = [
        { context: "这地方的火烧云变化极多，一会儿红彤彤的，一会儿________，一会儿半紫半黄，一会儿半灰半百合色。", answer: "金灿灿的", keyWords: ["金灿灿的","金灿灿"], level: "基础", hint: "颜色像金子一样闪亮" },
        { context: "忽然又来了一条大狗。那条狗十分________，在向前跑，后面似乎还跟着好几条小狗。", answer: "凶猛", keyWords: ["凶猛"], level: "基础", hint: "形容气势凶猛" },
        { context: "一时恍恍惚惚的，天空里又像这个又像那个，其实什么也不像，什么也看不清了。必须低下头，揉一揉________，沉静一会儿再看。", answer: "眼睛", keyWords: ["眼睛"], level: "进阶🌟", hint: "身体部位，与视觉有关" }
    ];
    let fillInputs = [];
    function renderFillBlanks() {
        const container = document.getElementById("fillBlankList");
        container.innerHTML = "";
        fillInputs = [];
        fillData.forEach((item, idx) => {
            const div = document.createElement("div");
            div.className = "question-item";
            div.setAttribute("data-fill-idx", idx);
            let textBefore = item.context;
            const placeholderMark = "________";
            let displayHtml = `<div>${textBefore.replace(placeholderMark, '<span style="background:#fff0c0; padding:0 4px;">⬜ 填空</span>')}</div>`;
            div.innerHTML = `
                ${displayHtml}
                <input type="text" placeholder="填写正确答案" id="fill_input_${idx}" autocomplete="off">
                <div style="font-size:12px; color:#b97f3a;">💡 提示：${item.hint} ${item.level === "进阶🌟" ? '✨挑战题' : ''}</div>
            `;
            container.appendChild(div);
            fillInputs.push(document.getElementById(`fill_input_${idx}`));
        });
    }
    renderFillBlanks();

    function computeFillAccuracy() {
        let total = fillData.length;
        let correctCount = 0;
        let wrongIndices = [];
        fillData.forEach((item, idx) => {
            const userAnswer = fillInputs[idx]?.value.trim() || "";
            let isCorrect = false;
            if (item.keyWords) {
                isCorrect = item.keyWords.some(kw => userAnswer === kw || (userAnswer.includes(kw) && kw.length === userAnswer.length));
            } else {
                isCorrect = (userAnswer === item.answer);
            }
            if (idx === 0 && (userAnswer === "金灿灿" || userAnswer === "金灿灿的")) isCorrect = true;
            if (isCorrect) correctCount++;
            else wrongIndices.push(idx);
        });
        const rate = total === 0 ? 0 : (correctCount / total);
        fillDetail = { correct: correctCount, total: total, wrongList: wrongIndices };
        fillCorrectRate = rate;
        document.getElementById("fillScore").innerHTML = `📖 正确率: ${Math.round(rate * 100)}% (${correctCount}/${total})`;
        let guideMsg = "";
        if (rate === 1) {
            guideMsg = "🏆 课文填空完美！你对课文非常熟悉，尝试背诵段落给家长听吧！";
        } else if (rate >= 0.66) {
            guideMsg = "📚 大部分正确，再读读原文！错误空：" + wrongIndices.map(i => `第${i+1}空(正确答案:${fillData[i].answer})`).join("；") + "。建议朗读课文第三、四自然段。";
        } else {
            guideMsg = "📖 课文需要精读！建议把《火烧云》原文大声朗读3遍，注意描写颜色和形状变化的句子。错题回顾：" + wrongIndices.map(i => `“${fillData[i].context.substring(0,30)}...” 正确答案是“${fillData[i].answer}”`).join("；");
        }
        document.getElementById("fillFeedback").innerHTML = `🧭 个性化指导：${guideMsg}`;
        document.querySelectorAll("#fillBlankList .question-item").forEach((item, i) => {
            if (wrongIndices.includes(i)) {
                item.classList.add("wrong-highlight");
                item.classList.remove("right-highlight");
            } else {
                item.classList.remove("wrong-highlight");
                item.classList.add("right-highlight");
            }
        });
        updateGlobalTotalRate();
        return rate;
    }

    // ---------- 3. 比一比再组词 (三组形近字，对齐布局优化) ----------
    const compareData = [
        { char1: "烧", char2: "浇", words1: ["烧火","燃烧","烧饼","烧水","红烧"], words2: ["浇水","浇花","浇地","浇灌"], hint1: "与火有关", hint2: "用水灌溉" },
        { char1: "彤", char2: "形", words1: ["红彤彤","彤云","彤管"], words2: ["形状","图形","形式","形象"], hint1: "红色", hint2: "样子、形态" },
        { char1: "胡", char2: "糊", words1: ["胡子","胡须","二胡","胡乱"], words2: ["糊涂","模糊","糊弄","面糊"], hint1: "古代北方民族或随意", hint2: "不清楚、粘合" }
    ];
    let compareInputPairs = []; // 存储每组两个input元素

    function renderCompare() {
        const container = document.getElementById("wordCompareList");
        container.innerHTML = "";
        compareInputPairs = [];
        compareData.forEach((item, idx) => {
            const div = document.createElement("div");
            div.className = "question-item";
            div.setAttribute("data-comp-idx", idx);
            // 使用网格布局实现左右对齐
            div.innerHTML = `
                <div class="compare-group">
                    <div class="compare-item">
                        <strong>${item.char1}</strong>
                        <input type="text" placeholder="组词" id="comp_${idx}_a" autocomplete="off">
                    </div>
                    <div class="compare-item">
                        <strong>${item.char2}</strong>
                        <input type="text" placeholder="组词" id="comp_${idx}_b" autocomplete="off">
                    </div>
                </div>
                <div style="font-size:12px; color:#b97f3a; margin-top: 8px;">💡 ${item.char1}: ${item.hint1} &nbsp;|&nbsp; ${item.char2}: ${item.hint2}</div>
            `;
            container.appendChild(div);
            const inputA = document.getElementById(`comp_${idx}_a`);
            const inputB = document.getElementById(`comp_${idx}_b`);
            compareInputPairs.push([inputA, inputB]);
        });
    }
    renderCompare();

    function computeCompareAccuracy() {
        let totalSlots = 0;
        let correctSlots = 0;
        let wrongDetails = [];
        compareData.forEach((item, idx) => {
            const [inputA, inputB] = compareInputPairs[idx];
            const valA = inputA?.value.trim() || "";
            const valB = inputB?.value.trim() || "";
            totalSlots += 2;
            let aCorrect = false, bCorrect = false;
            if (valA !== "" && item.words1.some(w => w === valA)) aCorrect = true;
            if (valB !== "" && item.words2.some(w => w === valB)) bCorrect = true;
            if (aCorrect) correctSlots++;
            else if (valA !== "") wrongDetails.push(`${item.char1}：“${valA}” 不是标准组词，参考：${item.words1.slice(0,3).join("、")}`);
            else wrongDetails.push(`${item.char1} 未填写`);

            if (bCorrect) correctSlots++;
            else if (valB !== "") wrongDetails.push(`${item.char2}：“${valB}” 不正确，参考：${item.words2.slice(0,3).join("、")}`);
            else wrongDetails.push(`${item.char2} 未填写`);
            
            inputA.style.border = aCorrect ? "2px solid #2ecc71" : "2px solid #e74c3c";
            inputB.style.border = bCorrect ? "2px solid #2ecc71" : "2px solid #e74c3c";
        });
        const rate = totalSlots === 0 ? 0 : (correctSlots / totalSlots);
        compareDetail = { correct: correctSlots, total: totalSlots, wrongList: wrongDetails };
        compareCorrectRate = rate;
        document.getElementById("compareScore").innerHTML = `📚 正确率: ${Math.round(rate * 100)}% (${correctSlots}/${totalSlots})`;
        let guideMsg = "";
        if (rate === 1) {
            guideMsg = "🎯 组词高手！形近字区分很清晰，尝试用这些词语写一句话吧！";
        } else if (rate >= 0.66) {
            guideMsg = "📝 部分组词不准确，复习偏旁含义。“烧”与火有关，“浇”与水有关。“彤”多表示红色，“形”指形状。错误：" + wrongDetails.slice(0,3).join("；");
        } else {
            guideMsg = "📖 形近字混淆较多！建议制作生字卡片，对比偏旁。错题总结：" + wrongDetails.join("；") + "。多抄写几遍正确组词。";
        }
        document.getElementById("compareFeedback").innerHTML = `🧭 个性化指导：${guideMsg}`;
        updateGlobalTotalRate();
        return rate;
    }

    // 全局总正确率 (基于三个模块已完成模块的平均值)
    function updateGlobalTotalRate() {
        let rates = [];
        if (pinyinCorrectRate !== null) rates.push(pinyinCorrectRate);
        if (fillCorrectRate !== null) rates.push(fillCorrectRate);
        if (compareCorrectRate !== null) rates.push(compareCorrectRate);
        let totalSpan = document.getElementById("globalStats");
        if (rates.length === 0) {
            totalSpan.innerHTML = "📊 当前总正确率: 尚未完成任何模块（请先点击各模块【核对】按钮）";
            return;
        }
        let avg = rates.reduce((a,b)=>a+b,0) / rates.length;
        let percent = Math.round(avg * 100);
        totalSpan.innerHTML = `📊 已完成 ${rates.length} 个模块，综合正确率：${percent}% 。继续加油~ 提交数据后可让老师看到进步！`;
    }

    // 提交到服务器的函数
    async function submitToServer(studentName, dataPackage) {
        try {
            const response = await fetch("https://qf.kjxs.site/api/X5z9GrVvQHX", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dataPackage)
            });
            let resultText = "";
            if (response.ok) {
                resultText = "✅ 数据提交成功！老师已经收到你的练习报告。";
            } else {
                resultText = `⚠️ 服务器响应异常 (${response.status})，但本地已记录成绩。可稍后再试。`;
            }
            document.getElementById("submitMsg").innerHTML = resultText;
        } catch (err) {
            console.error(err);
            document.getElementById("submitMsg").innerHTML = "❌ 网络问题，提交失败，但你的成绩已统计，可以刷新后重试。";
        }
    }

    // 监听提交按钮
    document.getElementById("submitDataBtn").addEventListener("click", () => {
        const studentName = document.getElementById("studentName").value.trim();
        if (studentName === "") {
            alert("📛 请先输入演示称呼！");
            return;
        }
        const anyModuleDone = (pinyinCorrectRate !== null || fillCorrectRate !== null || compareCorrectRate !== null);
        if (!anyModuleDone) {
            alert("📌 请至少完成一个练习模块，并点击【核对】按钮获得正确率后再提交。");
            return;
        }
        const payload = {
            student: studentName,
            timestamp: new Date().toISOString(),
            modules: {
                pinyin: { completed: pinyinCorrectRate !== null, accuracy: pinyinCorrectRate, correctCount: pinyinDetail.correct, total: pinyinDetail.total, wrongItems: pinyinDetail.wrongList },
                fillBlank: { completed: fillCorrectRate !== null, accuracy: fillCorrectRate, correctCount: fillDetail.correct, total: fillDetail.total, wrongItems: fillDetail.wrongList },
                wordCompare: { completed: compareCorrectRate !== null, accuracy: compareCorrectRate, correctCount: compareDetail.correct, total: compareDetail.total, wrongSummary: compareDetail.wrongList.slice(0,5) }
            },
            overallAccuracy: (() => {
                let rates = [];
                if (pinyinCorrectRate !== null) rates.push(pinyinCorrectRate);
                if (fillCorrectRate !== null) rates.push(fillCorrectRate);
                if (compareCorrectRate !== null) rates.push(compareCorrectRate);
                if (rates.length === 0) return null;
                return rates.reduce((a,b)=>a+b,0)/rates.length;
            })()
        };
        submitToServer(studentName, payload);
    });

    // 绑定核对按钮
    document.getElementById("checkPinyinBtn").addEventListener("click", () => computePinyinAccuracy());
    document.getElementById("checkFillBtn").addEventListener("click", () => computeFillAccuracy());
    document.getElementById("checkCompareBtn").addEventListener("click", () => computeCompareAccuracy());

    window.onload = () => {
        updateGlobalTotalRate();
    };
</script>
</body>
</html>
