    <script>
        // 题目配置
        const topics = [
            {
                count: 16,
                length: 1,
                unit: '分米',
                desc: '用16张边长是1分米的正方形纸拼长方形或正方形，怎样拼才能使拼成的图形周长最短？',
                answerShape: '正方形',
                answerPerimeter: 16
            },
            {
                count: 6,
                length: 2,
                unit: '厘米',
                desc: '用6个边长2厘米的小正方形拼成一个新长方形，怎样拼长方形的周长最小？如果要拼成一个正方形，至少再添上几个小正方形？',
                answerShape: '长方形',
                answerPerimeter: 20
            },
            {
                count: 18,
                length: 2,
                unit: '分米',
                desc: '把18幅绘画作品贴在一起，做一个长方形"绘画园地"，每幅作品是边长2分米的正方形，怎样设计才能使贴的花边最少？',
                answerShape: '长方形',
                answerPerimeter: 36
            },
            {
                count: 36,
                length: 1,
                unit: '分米',
                desc: '用36张边长是1分米的正方形纸拼长方形或正方形，怎样拼才能使拼成的图形周长最短？',
                answerShape: '正方形',
                answerPerimeter: 24
            },
            {
                count: 10,
                length: 1,
                unit: '分米',
                desc: '自定义拼接场景，自由设置参数探索规律',
                answerShape: '',
                answerPerimeter: null
            }
        ];

        let currentTopic = 0;
        let grid = [];
        let gridRows = 10;
        let gridCols = 20;
        let cellSize = 40;
        let showOverlap = false;
        let planIndex = 1; // 当前方案序号

        // 刷新所有方案序号 修复删除后序号错误问题
        function updatePlanIndexes() {
            const rows = document.querySelectorAll('#plan-body tr');
            rows.forEach((row, idx) => {
                row.cells[0].textContent = idx + 1;
            });
            planIndex = rows.length + 1;
            // 同步更新结论输入框的最大值
            document.getElementById('conclusion-plan').max = rows.length;
        }

        // 切换重合边显示
        function toggleOverlap() {
            showOverlap = !showOverlap;
            if (showOverlap) {
                document.body.classList.add('show-overlap');
            } else {
                document.body.classList.remove('show-overlap');
            }
        }

        // 初始化网格
        function initGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            grid = Array(gridRows).fill().map(() => Array(gridCols).fill(false));
            
            for (let i = 0; i < gridRows; i++) {
                for (let j = 0; j < gridCols; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    cell.addEventListener('click', toggleCell);
                    gridEl.appendChild(cell);
                }
            }
            updateInfo();
        }

        // 切换单元格状态
        function toggleCell(e) {
            const row = parseInt(e.target.dataset.row);
            const col = parseInt(e.target.dataset.col);
            const count = getPlacedCount();
            const maxCount = parseInt(document.getElementById('square-count').value);

            if (grid[row][col]) {
                grid[row][col] = false;
                e.target.classList.remove('filled');
            } else {
                if (count >= maxCount) {
                    alert(`最多只能放置${maxCount}个正方形`);
                    return;
                }
                grid[row][col] = true;
                e.target.classList.add('filled');
            }
            updateOverlapEdges();
            updateInfo();
        }

        // 还原摆法到画布
        function restoreShape(shapeData) {
            clearGrid();
            const points = shapeData.split(';').map(p => p.split(',').map(Number));
            points.forEach(([i,j]) => {
                grid[i][j] = true;
                const cell = document.querySelector(`.grid-cell[data-row="${i}"][data-col="${j}"]`);
                cell.classList.add('filled');
            });
            updateOverlapEdges();
            updateInfo();
        }

        // 更新重合边高亮
        function updateOverlapEdges() {
            document.querySelectorAll('.grid-cell').forEach(cell => {
                cell.classList.remove('edge-right', 'edge-bottom');
            });

            for (let i = 0; i < gridRows; i++) {
                for (let j = 0; j < gridCols; j++) {
                    if (grid[i][j]) {
                        // 右边是否有相邻正方形
                        if (j < gridCols -1 && grid[i][j+1]) {
                            const cell = document.querySelector(`.grid-cell[data-row="${i}"][data-col="${j}"]`);
                            cell.classList.add('edge-right');
                        }
                        // 下边是否有相邻正方形
                        if (i < gridRows -1 && grid[i+1][j]) {
                            const cell = document.querySelector(`.grid-cell[data-row="${i}"][data-col="${j}"]`);
                            cell.classList.add('edge-bottom');
                        }
                    }
                }
            }
        }

        // 生成摆法缩略图
        function generateMiniGrid(filledPoints) {
            const filled = filledPoints.map(p => p.split(',').map(Number));
            const minRow = Math.min(...filled.map(p => p[0]));
            const maxRow = Math.max(...filled.map(p => p[0]));
            const minCol = Math.min(...filled.map(p => p[1]));
            const maxCol = Math.max(...filled.map(p => p[1]));
            const height = maxRow - minRow + 1;
            const width = maxCol - minCol + 1;

            const miniGrid = document.createElement('div');
            miniGrid.className = 'mini-grid';
            miniGrid.style.gridTemplateColumns = `repeat(${width}, 12px)`;
            miniGrid.style.gridTemplateRows = `repeat(${height}, 12px)`;

            for (let i = minRow; i <= maxRow; i++) {
                for (let j = minCol; j <= maxCol; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'mini-cell';
                    if (filled.some(p => p[0] === i && p[1] === j)) cell.classList.add('filled');
                    miniGrid.appendChild(cell);
                }
            }
            return miniGrid;
        }

        // 计算重合边总数
        function getOverlapEdgeCount() {
            let count = 0;
            for (let i = 0; i < gridRows; i++) {
                for (let j = 0; j < gridCols; j++) {
                    if (grid[i][j]) {
                        if (j < gridCols -1 && grid[i][j+1]) count++;
                        if (i < gridRows -1 && grid[i+1][j]) count++;
                    }
                }
            }
            return count;
        }

        // 获取已放置数量
        function getPlacedCount() {
            return grid.flat().filter(v => v).length;
        }

        // 判断是否为长方形/正方形
        function getRectInfo() {
            const filled = [];
            for (let i = 0; i < gridRows; i++) {
                for (let j = 0; j < gridCols; j++) {
                    if (grid[i][j]) filled.push([i,j]);
                }
            }
            if (filled.length === 0) return {isRect: false};

            const minRow = Math.min(...filled.map(p => p[0]));
            const maxRow = Math.max(...filled.map(p => p[0]));
            const minCol = Math.min(...filled.map(p => p[1]));
            const maxCol = Math.max(...filled.map(p => p[1]));

            const height = maxRow - minRow + 1;
            const width = maxCol - minCol + 1;
            const expectedCount = height * width;

            return {isRect: expectedCount === filled.length};
        }

        // 更新信息面板
        window.captureLesson=()=>({squareCount:getPlacedCount(),overlapEdges:getOverlapEdgeCount(),perimeter:(4*getPlacedCount()-2*getOverlapEdgeCount())*Number(document.getElementById('square-length').value),grid});
function updateInfo() {
            const count = getPlacedCount();
            const maxCount = parseInt(document.getElementById('square-count').value);
            const unit = document.getElementById('unit').value;
            const sideLength = parseFloat(document.getElementById('square-length').value);
            const rectInfo = getRectInfo();
            const overlapCount = getOverlapEdgeCount();

            document.getElementById('placed-count').textContent = count;
            document.getElementById('total-count').textContent = maxCount;
            document.getElementById('overlap-edge-count').textContent = overlapCount;

            // 关联提示
            const reduceLength = overlapCount * 2 * sideLength;
            document.getElementById('relation-tip').textContent = `→ 相比所有正方形单独摆放，总周长减少了 ${reduceLength} ${unit}`;

            if (rectInfo.isRect) {
                document.getElementById('is-rect').textContent = '是';
                document.getElementById('is-rect').style.color = '#27ae60';
            } else {
                document.getElementById('is-rect').textContent = '否';
                document.getElementById('is-rect').style.color = '#e74c3c';
            }
        }

        // 新增方案
        function addPlan() {
            const placedCount = getPlacedCount();
            const totalCount = parseInt(document.getElementById('square-count').value);
            // 新增校验：必须拼完所有正方形
            if (placedCount !== totalCount) {
                alert(`请拼完所有${totalCount}个小正方形后再记录方案`);
                return;
            }
            const rectInfo = getRectInfo();
            if (!rectInfo.isRect) {
                alert('当前图形不是规则的长方形/正方形，请调整后再记录');
                return;
            }
            const unit = document.getElementById('unit').value;
            const tbody = document.getElementById('plan-body');
            const tr = document.createElement('tr');
            
            // 存储当前摆法的坐标数据
            const filledPoints = [];
            for (let i = 0; i < gridRows; i++) {
                for (let j = 0; j < gridCols; j++) {
                    if (grid[i][j]) filledPoints.push(`${i},${j}`);
                }
            }
            const shapeData = filledPoints.join(';');
            tr.dataset.shape = shapeData;

            const miniGrid = generateMiniGrid(filledPoints);
            // 点击缩略图还原摆法
            miniGrid.addEventListener('click', () => restoreShape(shapeData));

            tr.innerHTML = `
                <td>${planIndex}</td>
                <td class="mini-grid-cell"></td>
                <td><input type="number" class="plan-input"> <span class="unit-text">${unit}</span></td>
                <td><input type="number" class="plan-input"> <span class="unit-text">${unit}</span></td>
                <td><input type="number" class="plan-input"> <span class="unit-text">${unit}</span></td>
                <td><button class="btn btn-danger" onclick="this.parentElement.parentElement.remove();updatePlanIndexes();">删除</button></td>
            `;
            tr.querySelector('.mini-grid-cell').appendChild(miniGrid);
            tbody.appendChild(tr);
            planIndex++;
            // 同步更新结论输入框最大值
            document.getElementById('conclusion-plan').max = planIndex -1;
            // 自动清空画布
            clearGrid();
            alert(`方案${planIndex-1}已记录，可继续拼接下一个摆法`);
        }

        // 更新所有方案的单位
        function updatePlanUnit() {
            const unit = document.getElementById('unit').value;
            document.querySelectorAll('.unit-text').forEach(el => {
                el.textContent = unit;
            });
        }

        // 验证结论
        function checkConclusion() {
            const inputPlan = parseInt(document.getElementById('conclusion-plan').value);
            const feedback = document.getElementById('conclusion-feedback');
            const rows = document.querySelectorAll('#plan-body tr');
            
            if (isNaN(inputPlan) || inputPlan < 1 || inputPlan > rows.length) {
                feedback.textContent = `请输入1到${rows.length}之间的有效方案序号`;
                feedback.className = 'feedback wrong';
                return;
            }

            // 提取所有方案的周长
            const perimeters = [];
            rows.forEach(row => {
                const p = parseFloat(row.cells[4].querySelector('input').value);
                perimeters.push(isNaN(p) ? Infinity : p);
            });

            const minP = Math.min(...perimeters);
            const minIndexes = perimeters.map((p, idx) => p === minP ? idx+1 : null).filter(v => v !== null);

            if (minIndexes.includes(inputPlan)) {
                feedback.textContent = '回答正确！你找到了周长最短的方案，很棒！';
                feedback.className = 'feedback correct';
            } else {
                feedback.textContent = `回答错误，周长最短的是方案${minIndexes.join('、')}，再对比下各方案的周长数值哦`;
                feedback.className = 'feedback wrong';
            }
        }

        // 应用参数
        function applyParams() {
            updateInfo();
            updatePlanUnit();
            clearGrid();
        }

        // 清空画布
        function clearGrid() {
            grid.forEach(row => row.fill(false));
            document.querySelectorAll('.grid-cell').forEach(cell => cell.classList.remove('filled', 'edge-right', 'edge-bottom'));
            updateInfo();
        }

        // 切换题目
        function switchTopic(topicId) {
            currentTopic = topicId;
            const topic = topics[topicId];
            document.getElementById('square-count').value = topic.count;
            document.getElementById('square-length').value = topic.length;
            document.getElementById('unit').value = topic.unit;
            document.getElementById('topic-desc').textContent = topic.desc;
            document.querySelectorAll('.topic-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.topic-btn[data-topic="${topicId}"]`).classList.add('active');
            
            // 切换题目清空方案表和结论
            document.getElementById('plan-body').innerHTML = '';
            document.getElementById('conclusion-plan').value = '';
            document.getElementById('conclusion-feedback').style.display = 'none';
            planIndex = 1;
            document.getElementById('conclusion-plan').max = 0;
            updatePlanUnit();
            applyParams();
        }

        // 限制结论输入框只能输入正整数
        document.getElementById('conclusion-plan').addEventListener('input', function(e) {
            let val = parseInt(e.target.value);
            if (isNaN(val) || val < 1) {
                e.target.value = '';
            }
            const max = parseInt(e.target.max);
            if (val > max) e.target.value = max;
        });

        // 事件绑定
        document.getElementById('apply-param').addEventListener('click', applyParams);
        document.getElementById('clear').addEventListener('click', clearGrid);
        document.getElementById('toggle-overlap').addEventListener('click', toggleOverlap);
        document.getElementById('add-plan').addEventListener('click', addPlan);
        document.getElementById('check-conclusion').addEventListener('click', checkConclusion);
        document.querySelectorAll('.topic-btn').forEach(btn => {
            btn.addEventListener('click', () => switchTopic(parseInt(btn.dataset.topic)));
        });

        // 初始化
        initGrid();
    </script>
<script src="/projects/shared/case-evidence.js"></script></body>
