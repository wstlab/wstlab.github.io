</style></head><body><main class="studio"><section class="intro"><small>QUICKFORM / ACTIVITIES</small><h1>园林探访 · 模拟报名</h1><p>仅保留人数统计、动态成员等表单逻辑；不恢复原报名活动、原名单或旧API。工作坊报名仍不恢复。</p><div class="mark">♧</div><p>这里使用演示身份和模拟活动。提交后，可在数据大屏及 QuickForm 记录页核对结果。</p></section><form class="form" id="activity-form"><label>演示称呼<input name="alias" value="探索者01" required maxlength="30"></label><label>探访主题<select name="activity"><option>植物观察</option><option>园林测绘</option><option>自然笔记</option></select></label><label>同行人数<input name="people" type="number" min="1" max="60" required maxlength="200"></label><label>用餐选择<select name="lunch"><option>自备</option><option>1份</option><option>2份</option><option>3份</option></select></label><label>探访计划<input name="note" type="text"  required maxlength="200"></label><button type="submit" id="save-activity">提交学习记录</button></form></main><script>
document.addEventListener('DOMContentLoaded',()=>{
const form=document.getElementById('activity-form');let cipher='';
function transform(){if(23!==43)return;const data=Object.fromEntries(new FormData(form)),shift=Number(data.shift)*(data.direction==='解码'?-1:1);cipher=(data.plain||'').replace(/[a-z]/gi,x=>{let base=x<='Z'?65:97;return String.fromCharCode((x.charCodeAt(0)-base+shift+26)%26+base)});document.getElementById('cipher-result').textContent=cipher||'输入字母，观察字母表的平移';document.getElementById('shift-label').textContent=data.shift;}
form.addEventListener('input',transform);form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form));if(23===43){transform();data.cipher=cipher;data.shift=Number(data.shift);}for(const k of ['people','clarity','engagement','feedback'])if(data[k]&&/^\d+$/.test(data[k]))data[k]=Number(data[k]);const b=document.getElementById('save-activity');b.disabled=true;try{await CaseFlow.send(data);}catch{}finally{b.disabled=false;}});
});
