                return `${mins}:${secs}`;
            }

            function updateTimer() {

                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                timerDisplay.textContent = `⏱️ ${formatTime(elapsed)}`;

            function startTimer() {
                if (timerRunning) return;
                startTime = Date.now();
                timerRunning = true;
                timerInterval = setInterval(updateTimer, 1000);

                if (timerInterval) {

            function showToast(msg, isError = false) {
                const toast = document.createElement('div');
                toast.className = 'toast-message';
                toast.textContent = msg;
                toast.style.background = isError ? '#ffdddd' : '#ffffff';
                toast.style.color = isError ? '#b00020' : '#572e7a';
                document.body.appendChild(toast);
                setTimeout(() => {
                    if (document.body.contains(toast)) document.body.removeChild(toast);
                }, 2000);
            }

            // 生成下划线提示文本 (例如：单词长度 6，第一个字母 y → "y _____")
            function getHintText(word) {
                if (!word) return '';
                const first = word[0];
                const restLen = word.length - 1;
                return first + ' ' + '_'.repeat(restLen).split('').join(' ');
            }

            // 渲染单词卡片
            function renderWords() {
                wordsContainer.innerHTML = '';
                wordStatus = new Array(currentWords.length).fill(false);

                currentWords.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'word-card';
                    card.dataset.index = index;

                    const chineseDiv = document.createElement('div');
                    chineseDiv.className = 'chinese';
                    chineseDiv.textContent = item.zh;

                    const hintDiv = document.createElement('div');
                    hintDiv.className = 'hint';
                    hintDiv.textContent = getHintText(item.en);

                    const inputArea = document.createElement('div');
                    inputArea.className = 'input-area';

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'word-input';
                    input.placeholder = '输入完整单词';
                    input.dataset.index = index;

                    const checkBtn = document.createElement('button');
                    checkBtn.className = 'check-btn';
                    checkBtn.textContent = '✓ 检查';
                    checkBtn.dataset.index = index;

                    inputArea.appendChild(input);
                    inputArea.appendChild(checkBtn);

                    card.appendChild(chineseDiv);
                    card.appendChild(hintDiv);
                    card.appendChild(inputArea);
                    wordsContainer.appendChild(card);

                    // 检查按钮事件
                    checkBtn.addEventListener('click', () => {
                        const idx = parseInt(checkBtn.dataset.index);
                        if (wordStatus[idx]) {
                            showToast('这个词已经正确啦！', false);
                            return;
                        }
                        const userAnswer = input.value.trim().toLowerCase();
                        const correct = currentWords[idx].en.toLowerCase();
                        // 忽略首尾空格，比较
                        if (userAnswer === correct) {
                            wordStatus[idx] = true;
                            card.classList.add('correct');
                            input.disabled = true;
                            checkBtn.disabled = true;
                            showToast('✅ 正确！', false);
                            updateProgress();
                        } else {
                            showToast('❌ 拼写错误，再试试', true);
                            input.classList.add('error');
                            setTimeout(() => input.classList.remove('error'), 500);
                        }
                    });

                    // 输入框回车也可以触发检查
                    input.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            checkBtn.click();
                        }
                    });
                });

                updateProgress();
            }

            // 加载单元
            function loadUnit(unit) {
                currentUnit = unit;
                currentWords = UNIT_WORDS[unit] || [];
                // 更新标题
                const unitNames = {
                    unit1: 'Unit 1 How tall are you?',
                    unit2: 'Unit 2 Last weekend',
                    unit3: 'Unit 3 Where did you go?',
                    unit4: 'Unit 4 Then and now'
                };
                currentUnitDisplay.textContent = unitNames[unit] || unit;
                renderWords();
                resetTimer();
            }

            // 重置游戏（重新开始当前单元）
            function resetGame() {
                loadUnit(currentUnit);
                startTimer(); // 重新开始计时
            }

            // 提交成绩
            async function submitScore() {
                // 检查是否所有单词正确
                if (wordStatus.includes(false)) {
                    showToast('请先完成所有单词的默写！', true);
                    return;
                }

                const name = playerName || '未命名';
                const className = playerClass || '未分班';
                const total = wordStatus.length;
                const correct = wordStatus.filter(v => v).length;
                const accuracy = total > 0 ? Math.round((correct / total) * 100) + '%' : '0%';
                
                // 获取用时（秒）
                const timeElapsed = startTime ? Math.floor((Date.now() - startTime) / 1000) : 0;
                const timeStr = formatTime(timeElapsed);

                const payload = {
                    name: name,
                    class: className,
                    unit: currentUnit,
                    unitName: currentUnitDisplay.textContent,
                    completedWords: correct,
                    totalWords: total,
                    accuracy: accuracy,
                    time: timeStr,
                    timestamp: new Date().toISOString()
                };

                const submitUrl = 'https://qf.kjxs.site/api/ekqS83aaEAV';

                try {
                    const response = await fetch(submitUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) {
                        showToast('🎉 成绩提交成功！', false);
                        submitGameBtn.disabled = true; // 防止重复提交
                    } else {
                        showToast('❌ 提交失败，请重试', true);
                    }
                } catch (error) {
                    console.error(error);
                    showToast('⚠️ 网络错误', true);
                }
            }

            // 开始游戏
            function startGame() {
                playerName = playerNameInput.value.trim() || '小勇士';
                playerClass = classSelect.value;
                currentUnit = unitSelect.value;

                startPanel.style.display = 'none';
                gameMain.style.display = 'block';

                loadUnit(currentUnit);
                startTimer();
            }

            // 事件绑定
            startBtn.addEventListener('click', startGame);

            resetGameBtn.addEventListener('click', () => {
                resetGame();
            });

            submitGameBtn.addEventListener('click', submitScore);

            // 初始化时只显示开始面板
            startPanel.style.display = 'block';
            gameMain.style.display = 'none';
        })();
    </script>
</body>
</html>
