<script>
// ----------------------------- 配置 ---------------------------------
// 选项卡片数据 (根据要求: A变为“检测到人脸？”，B变为“ID1的人脸存在？”，C变为“ID2的人脸存在？”，D保持不变)
const OPTIONS = [
  { id: 'A', label: '检测到人脸？' },
  { id: 'B', label: 'ID1的人脸存在？' },
  { id: 'C', label: 'ID2的人脸存在？' },
  { id: 'D', label: 'HUSKYLENS 2 切换内置模型为人脸识别' }
];

// 四个空缺槽位及正确答案 (适配新选项逻辑)
// switchSlot: 模型切换初始化 -> 正确 D
// id1Slot: 判断ID1人脸存在 -> 正确答案 B (ID1的人脸存在？)
// id2Slot: 判断ID2人脸存在 -> 正确答案 C (ID2的人脸存在？)
// id3Slot: 原为ID3判断，现改为整体人脸检测或触发环节，适配选项A(检测到人脸？) 保证所有槽位正确映射
const SLOT_CONFIG = {
  switchSlot: { name: '🔧 模型切换/初始化', answer: 'D' },
  id1Slot:    { name: '🧑 判断ID1人脸存在？', answer: 'B' },
  id2Slot:    { name: '👤 判断ID2人脸存在？', answer: 'C' },
  id3Slot:    { name: '🎭 全局人脸检测 (触发逻辑)', answer: 'A' }
};

// 虚线框坐标及尺寸 (基于图片背景精确微调，图片填充后相对定位依然保持对准)
const ZONES = {
  switchSlot: { left: 42, top: 16.5, width: 25, height: 6 },    // 模型切换区
  id1Slot:    { left: 46.5, top: 33.7, width: 18, height: 5 },      // ID1判断区
  id2Slot:    { left: 48, top: 50.6, width: 18, height: 5 },      // ID2判断区
  id3Slot:    { left: 48, top: 67.6, width: 18, height: 5 }         // 全局人脸检测区
};

// 存储当前放置映射 { slotId: optId }
let placed = {};
let submitted = false;
let currentGroup = -1;   // 0~5对应第一组~第六组

// 组别数组
const GROUP_NAMES = ['第一组', '第二组', '第三组', '第四组', '第五组', '第六组'];

// API上报地址
const API_URL = "https://qf.kjxs.site/api/weioUf36OBW";

// DOM 元素
const groupSelect = document.getElementById('groupSelect');
const currentPlayerEl = document.getElementById('currentPlayer');
const partsGrid = document.getElementById('partsGrid');
const bgImage = document.getElementById('bgImage');
const fullscreenPreview = document.getElementById('fullscreenPreview');
const fullscreenImg = fullscreenPreview.querySelector('img');
const scoreValSpan = document.getElementById('scoreVal');
const feedbackDiv = document.getElementById('feedback');

// 拖拽全局辅助变量
let dragSource = null;      // 'part' 或 'slot'
let dragOptId = null;
let dragFromSlot = null;

// 每题分值: 5分
const SCORE_PER_ITEM = 5;
const TOTAL_ITEMS = Object.keys(ZONES).length; // 4
const MAX_SCORE = TOTAL_ITEMS * SCORE_PER_ITEM; // 20

// ----------------------------- 辅助函数 ---------------------------------
function canPlay() {
  return currentGroup >= 0 && !submitted;
}

function updatePlayerDisplay() {
  if (currentGroup >= 0) {
    currentPlayerEl.innerHTML = `<div class="player-name">🏅 ${GROUP_NAMES[currentGroup]}</div>`;
  } else {
    currentPlayerEl.innerHTML = '⚠️ 请先选择小组';
  }
}

function showFeedback(msg, isSuccessFlag = null) {
  feedbackDiv.textContent = msg;
  if (isSuccessFlag === true) feedbackDiv.style.color = '#C8E6C9';
  else if (isSuccessFlag === false) feedbackDiv.style.color = '#FFCDD2';
  else feedbackDiv.style.color = '#E3F2FD';
  setTimeout(() => {
    if (feedbackDiv.textContent === msg) feedbackDiv.style.color = '#E3F2FD';
  }, 2400);
}

// 填充虚线框内容
function fillZone(zone, opt) {
  zone.innerHTML = `<span class="badge">${opt.id}</span>${opt.label}`;
  zone.classList.add('filled');
  zone.draggable = true;
  zone.dataset.filledOpt = opt.id;
  zone.style.whiteSpace = 'normal';
  zone.style.wordBreak = 'break-word';
  zone.addEventListener('dragstart', onZoneDragStart);
}

function clearZone(zone) {
  zone.innerHTML = '<span class="placeholder">❓</span>';
  zone.classList.remove('filled', 'correct', 'wrong');
  zone.draggable = false;
  delete zone.dataset.filledOpt;
}

// 构建所有虚线框
function buildDropZones() {
  const container = document.getElementById('imageContainer');
  container.querySelectorAll('.drop-zone').forEach(z => z.remove());
  
  for (const [slotId, pos] of Object.entries(ZONES)) {
    const zone = document.createElement('div');
    zone.className = 'drop-zone';
    zone.dataset.slot = slotId;
    zone.style.left = pos.left + '%';
    zone.style.top = pos.top + '%';
    zone.style.width = pos.width + '%';
    zone.style.height = pos.height + '%';
    zone.innerHTML = '<span class="placeholder">❓</span>';
    
    zone.addEventListener('dragover', onZoneDragOver);
    zone.addEventListener('dragleave', onZoneDragLeave);
    zone.addEventListener('drop', onZoneDrop);
    
    container.appendChild(zone);
    
    if (placed[slotId]) {
      const opt = OPTIONS.find(o => o.id === placed[slotId]);
      if (opt) fillZone(zone, opt);
    }
  }
}

// 左侧卡片列表 动态刷新 (互斥禁用)
function buildParts() {
  partsGrid.innerHTML = '';
  OPTIONS.forEach(opt => {
    const partDiv = document.createElement('div');
    partDiv.className = 'part';
    partDiv.draggable = true;
    partDiv.dataset.optId = opt.id;
    partDiv.innerHTML = `<span class="badge">${opt.id}</span>${opt.label}`;
    const isUsed = Object.values(placed).includes(opt.id);
    if (isUsed) partDiv.classList.add('used');
    partDiv.addEventListener('dragstart', onPartDragStart);
    partsGrid.appendChild(partDiv);
  });
}

// ---------- 拖拽事件 -------------
function onPartDragStart(e) {
  if (submitted || !canPlay()) {
    e.preventDefault();
    return false;
  }
  dragSource = 'part';
  dragOptId = e.target.closest('.part').dataset.optId;
  dragFromSlot = null;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragOptId);
}

function onZoneDragStart(e) {
  if (submitted || !canPlay()) {
    e.preventDefault();
    return;
  }
  const zone = e.target.closest('.drop-zone');
  if (!zone || !zone.dataset.filledOpt) {
    e.preventDefault();
    return;
  }
  dragSource = 'slot';
  dragOptId = zone.dataset.filledOpt;
  dragFromSlot = zone.dataset.slot;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragOptId);
}

function onZoneDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}

function onZoneDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function onZoneDrop(e) {
  e.preventDefault();
  const zone = e.currentTarget;
  zone.classList.remove('drag-over');
  if (submitted) {
    showFeedback('❌ 已经提交，无法修改。刷新页面可重新挑战', false);
    return;
  }
  if (!canPlay()) {
    showFeedback('👥 请先选择小组再进行拖拽填空', false);
    return;
  }
  
  const optId = e.dataTransfer.getData('text/plain') || dragOptId;
  if (!optId) return;
  const slotId = zone.dataset.slot;
  
  if (placed[slotId] === optId) return;
  
  if (placed[slotId]) {
    delete placed[slotId];
    clearZone(zone);
  }
  
  if (dragSource === 'slot' && dragFromSlot && dragFromSlot !== slotId) {
    const srcZone = document.querySelector(`[data-slot="${dragFromSlot}"]`);
    if (srcZone && placed[dragFromSlot]) {
      delete placed[dragFromSlot];
      clearZone(srcZone);
    }
  }
  
  // 互斥逻辑
  for (const [sid, oid] of Object.entries(placed)) {
    if (oid === optId && sid !== slotId) {
      const otherZone = document.querySelector(`[data-slot="${sid}"]`);
      if (otherZone) clearZone(otherZone);
      delete placed[sid];
      break;
    }
  }
  
  placed[slotId] = optId;
  const opt = OPTIONS.find(o => o.id === optId);
  if (opt) fillZone(zone, opt);
  
  buildParts();
  const slotLabel = SLOT_CONFIG[slotId]?.name || slotId;
  showFeedback(`✅ 已将 ${optId} 填入 “${slotLabel}”，可继续拖拽调整`, null);
  
  dragSource = null;
  dragOptId = null;
  dragFromSlot = null;
}

// 拖拽回左侧回收区
const partsStoreDiv = document.querySelector('.parts-store');
partsStoreDiv.addEventListener('dragover', (e) => {
  if (dragSource === 'slot' && !submitted && canPlay()) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  }
});
partsStoreDiv.addEventListener('drop', (e) => {
  e.preventDefault();
  if (submitted) {
    showFeedback('提交后不可移回选项', false);
    return;
  }
  if (dragSource === 'slot' && dragFromSlot && !submitted && canPlay()) {
    const srcZone = document.querySelector(`[data-slot="${dragFromSlot}"]`);
    if (srcZone && placed[dragFromSlot]) {
      delete placed[dragFromSlot];
      clearZone(srcZone);
      buildParts();
      const slotName = SLOT_CONFIG[dragFromSlot]?.name || dragFromSlot;
      showFeedback(`↩️ 已将选项从 ${slotName} 移回卡片区`, null);
    }
  }
  dragSource = null;
  dragOptId = null;
  dragFromSlot = null;
});

// ---------- 提交 评分&上报 (每题5分，满分20) ----------
document.getElementById('submitBtn').addEventListener('click', () => {
  if (submitted) {
    showFeedback('📌 本组已提交，如要重新作答请刷新页面', false);
    return;
  }
  if (!canPlay()) {
    showFeedback('⚠️ 请先选择你所在的小组！', false);
    return;
  }
  
  const totalSlots = TOTAL_ITEMS;
  const filledCount = Object.keys(placed).length;
  if (filledCount < totalSlots) {
    showFeedback(`📢 还有 ${totalSlots - filledCount} 个红框未填写！请将全部4张卡片拖入对应位置`, false);
    return;
  }
  
  submitted = true;
  let correctCount = 0;
  let resultMsg = '';
  let errorDetails = '';
  const answerDetail = {};
  
  // 逐槽位判断正确性 (依据新版SLOT_CONFIG)
  for (const [slotId, expected] of Object.entries(SLOT_CONFIG)) {
    const studentOpt = placed[slotId];
    const isCorrect = (expected.answer === studentOpt);
    if (isCorrect) correctCount++;
    const zoneElem = document.querySelector(`[data-slot="${slotId}"]`);
    if (zoneElem) {
      if (isCorrect) zoneElem.classList.add('correct');
      else zoneElem.classList.add('wrong');
    }
    const slotName = expected.name;
    answerDetail[slotId] = {
      题目: slotName,
      学生答案: studentOpt || '未填',
      正确答案: expected.answer
    };
    if (isCorrect) {
      resultMsg += `✓ ${slotName} ：正确 (${studentOpt}) +${SCORE_PER_ITEM}分\n`;
    } else {
      resultMsg += `✗ ${slotName} ：错误 (你的答案:${studentOpt || '无'}，正确:${expected.answer})\n`;
      errorDetails += `  ${slotName} 你的答案：${studentOpt} ，正确答案：${expected.answer}\n`;
    }
  }
  
  const totalScore = correctCount * SCORE_PER_ITEM;  // 每题5分
  scoreValSpan.textContent = totalScore;
  
  let finalFeedback = '';
  if (correctCount === totalSlots) {
    finalFeedback = `🎉 完美！ 满分 ${totalScore}/${MAX_SCORE} 分！\n${resultMsg}`;
    showFeedback(finalFeedback, true);
  } else {
    finalFeedback = `📊 得分：${totalScore}/${MAX_SCORE}\n${resultMsg}\n📝 错误分析：\n${errorDetails}`;
    showFeedback(finalFeedback, false);
  }
  
  // 数据上报
  const submitData = {
    活动名称: "防溺水智能警报卫士 · 活动二 | 人脸识别精准警报代码补全",
    小组ID: currentGroup,
    小组名称: GROUP_NAMES[currentGroup],
    本次得分: totalScore,
    满分: MAX_SCORE,
    答对题数: correctCount,
    总题目数: totalSlots,
    每题分值: SCORE_PER_ITEM,
    作答详情: JSON.stringify(answerDetail),
    提交时间: new Date().toLocaleString()
  };
  
  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(submitData)
  }).catch(err => console.log("上报异常(不影响本地):", err));
  
  // 禁止后续修改
  document.querySelectorAll('.part').forEach(p => { p.draggable = false; p.style.cursor = 'default'; });
  document.querySelectorAll('.drop-zone').forEach(z => { z.draggable = false; });
});

// 小组选择变更
groupSelect.addEventListener('change', function() {
  const val = parseInt(this.value);
  if (isNaN(val)) {
    currentGroup = -1;
    updatePlayerDisplay();
    showFeedback('请选择小组后开始挑战~', null);
  } else {
    currentGroup = val;
    updatePlayerDisplay();
    showFeedback(`👋 欢迎 ${GROUP_NAMES[currentGroup]}，将卡片拖进红框完成任务1 (每题5分，满分20) 【正确答案提示: 模型切换→D, ID1→B, ID2→C, 全局人脸检测→A】`, true);
  }
});

// 图片全屏预览
bgImage.addEventListener('click', () => {
  fullscreenImg.src = bgImage.src;
  fullscreenPreview.classList.add('show');
});
fullscreenPreview.addEventListener('click', () => {
  fullscreenPreview.classList.remove('show');
});

// 初始化所有
function init() {
  placed = {};
  submitted = false;
  scoreValSpan.textContent = '--';
  buildDropZones();
  buildParts();
  // 确保界面无残留高亮
  for (const slotId of Object.keys(ZONES)) {
    const zone = document.querySelector(`[data-slot="${slotId}"]`);
    if (zone) clearZone(zone);
  }
}

if (bgImage.complete) {
  init();
} else {
  bgImage.addEventListener('load', init);
}
window.addEventListener('load', () => {
  if (!document.querySelector('.drop-zone')) init();
});
</script>
</body>
</html>
