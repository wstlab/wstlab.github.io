            <h2 style="color:#ffcc00; margin-bottom:20px;">🎮 选择挑战关卡</h2>
            <div class="unit-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;">
                ${[1,2,3,4,5,6].map(i=>`<button class="big-btn unit-btn-style" onclick="startGame(${i})">Unit ${i}</button>`).join('')}
            </div>
            <button class="big-btn" style="background:#666; box-shadow:0 4px 0 #444;" onclick="location.reload()">🔓 退出账号</button>
        </div>`;
        updateCloudRank();
    }

    // 🌟 控制提交按钮锁定的函数（同时更新状态提示，把原因说清楚）
    function lockSubmitButton(isLocked) {
        const btn = document.getElementById('submit-best-btn');
        const hint = document.getElementById('submit-hint');
        const hintText = document.getElementById('submit-hint-text');
        if (isLocked) {
            btn.classList.add('btn-locked');
            btn.disabled = true;
            btn.style.cursor = 'not-allowed';
            btn.innerText = "📤 挑战完成后解锁";
            if (hint) {
                hint.className = 'submit-hint locked';
                hint.firstElementChild.innerText = '🔒';
                hintText.innerText = '请先完成本单元全部单词，通关后即可提交成绩';
            }
        } else {
            btn.classList.remove('btn-locked');
            btn.disabled = false;
            btn.style.cursor = 'pointer';
            btn.innerText = "📤 提交本次成绩";
            if (hint) {
                const t = parseFloat(document.getElementById('game-timer').innerText) || 0;
                hint.className = 'submit-hint ready';
                hint.firstElementChild.innerText = '✅';
                hintText.innerText = `本单元已通关，用时 ${t.toFixed(1)}s —— 可以提交成绩了`;
            }
        }
    }

    // 提交后把提示切到「已提交」态
    function markSubmitted() {
        const hint = document.getElementById('submit-hint');
        const hintText = document.getElementById('submit-hint-text');
        if (!hint) return;
        hint.className = 'submit-hint done';
        hint.firstElementChild.innerText = '☁️';
        hintText.innerText = '成绩已同步到云端，可在下方排行榜查看名次';
    }

    document.getElementById('modal-exit-btn').onclick = () => { showUnitMenu(); document.getElementById('word-modal').style.display = 'none'; };

    window.startGame = (u) => {
        currentUnit = u;
        queue = [...UNITS_WORDS[u]].sort(()=>Math.random()-0.5);
        document.getElementById('remaining').innerText = queue.length;
        document.getElementById('unit-badge').innerText = "U" + u;
        document.getElementById('overlay-screen').style.display = 'none';
        document.getElementById('word-modal').style.display = 'none';
        // 🌟 核心修复：开始挑战即锁死提交按钮
        lockSubmitButton(true);
        obstaclePos = 850; gameActive = true; isPaused = false;
        startTime = performance.now(); lastTime = performance.now();
        playSfx('bgm', true);
        if(gameLoopId) cancelAnimationFrame(gameLoopId);
        requestAnimationFrame(gameLoop);
        updateCloudRank();
    };

    function gameLoop(now) {
        if(!gameActive) return;
        if(!isPaused) {
            const dt = (now - lastTime) / 16; lastTime = now;
            groundPos -= gameSpeed * dt; if(groundPos <= -50) groundPos = 0;
            document.getElementById('ground').style.backgroundPosition = `${groundPos}px 0px`;
            obstaclePos -= gameSpeed * dt;
            document.getElementById('obstacle').style.left = obstaclePos + "px";
            document.getElementById('game-timer').innerText = ((now - startTime)/1000).toFixed(2);
            if(obstaclePos < 150 && obstaclePos > 100) { if(queue.length > 0) openModal(queue.shift()); else finishGame(); }
            if(obstaclePos < -100) { obstaclePos = 850; document.getElementById('obstacle').innerText = Math.random()>0.5?"🐢":"🍄"; }
        } else { lastTime = now; }
        gameLoopId = requestAnimationFrame(gameLoop);
    }

    function openModal(word) {
        isPaused = true; stopSfx('bgm'); playSfx('alert');
        currentTarget = word.english.replace(/[^a-zA-Z0-9]/g, '');
        currentInput = "";
        document.getElementById('word-chinese').innerText = word.chinese;
        const display = document.getElementById('spell-display'); display.innerHTML = "";
        
        word.english.split(' ').forEach(w => {
            const group = document.createElement('div'); group.style = "display:inline-flex; gap:4px; margin:2px;";
            [...w].forEach(c => {
                if(/[a-zA-Z0-9]/.test(c)) {
                    const b = document.createElement('div'); b.className = 'letter-box';
                    b.innerHTML = `<div class="letter-underline"></div>`; group.appendChild(b);
                } else {
                    const d = document.createElement('div'); d.style = "font-size:18px; color:#c0392b; line-height:48px;";
                    d.innerText = c; group.appendChild(d);
                }
            });
            display.appendChild(group);
            const space = document.createElement('div'); space.style.width = "12px"; display.appendChild(space);
        });

        const btnBox = document.getElementById('letter-buttons'); btnBox.innerHTML = "";
        [...currentTarget].sort(()=>Math.random()-0.5).forEach(l => {
            const btn = document.createElement('button'); btn.className = "letter-btn"; btn.innerText = l;
            btn.onclick = () => {
                if(currentInput.length < currentTarget.length) {
                    currentInput += l; btn.classList.add('hidden');
                    const allBoxes = document.querySelectorAll('.letter-box');
                    allBoxes[currentInput.length-1].innerHTML = `<span>${l}</span><div class="letter-underline"></div>`;
                }
            };
            btnBox.appendChild(btn);
        });
        document.getElementById('word-modal').style.display = 'flex';
    }

    document.getElementById('spell-confirm-btn').onclick = () => {
        if(currentInput === currentTarget) {
            playSfx('correct'); document.getElementById('word-modal').style.display = 'none';
            document.getElementById('mario').classList.add('jumping-anim'); playSfx('jump');
            setTimeout(() => { document.getElementById('mario').classList.remove('jumping-anim'); isPaused = false; obstaclePos = -100; document.getElementById('remaining').innerText = queue.length; playSfx('bgm', true); }, 600);
        } else { playSfx('wrong'); alert("拼写不正确"); }
    };

    document.getElementById('spell-reset-btn').onclick = () => {
        stopSfx('wrong'); currentInput = "";
        document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('hidden'));
        document.querySelectorAll('.letter-box').forEach(b => b.innerHTML = `<div class="letter-underline"></div>`);
    };

    document.getElementById('restart-unit-btn').onclick = () => { startGame(currentUnit); };

    async function updateCloudRank() {
        const container = document.getElementById('rank-container');
        container.innerHTML = '<div style="text-align:center; padding:15px; color:#aaa;">⏳ 正在读取云端战绩...</div>';
        try {
            const res = await fetch(GET_URL + '?t=' + Date.now());
            const data = await res.json();
            const records = data.submissions || data.data || [];
            const unitKey = "U" + currentUnit;
            
            const bests = new Map();
            records.filter(r => (r.unit_name === unitKey || r.unit === unitKey) && (r.class_name === currentStudent.class || r.class === currentStudent.class))
                   .forEach(r => {
                       const sid = r.student_id; const dur = parseFloat(r.duration);
                       if(!bests.has(sid) || dur < bests.get(sid).duration) bests.set(sid, r);
                   });
            
            const myServerBest = bests.get(currentStudent.id);
            const finalPB = myServerBest ? parseFloat(myServerBest.duration) : null;
            document.getElementById('pb-display').innerText = finalPB ? `⭐ 云端最佳: ${finalPB.toFixed(1)}s` : `⭐ 云端最佳: --`;
            
            const top10 = [...bests.values()].sort((a,b)=>parseFloat(a.duration)-parseFloat(b.duration)).slice(0,10);
            if(top10.length === 0) { container.innerHTML = '<p style="text-align:center;">✨ 暂无排名</p>'; return; }
            let html = `<table class="rank-table"><tr><th>排名</th><th>学号</th><th>姓名</th><th>成绩</th></tr>`;
            top10.forEach((r, i) => {
                const isMe = r.student_id === currentStudent.id;
                const cls = [i < 3 ? `top${i + 1}` : '', isMe ? 'me' : ''].filter(Boolean).join(' ');
                const rank = i < 3
                    ? `<span class="medal g${i + 1}">${i + 1}</span>`
                    : (i + 1);
                html += `<tr class="${cls}">` +
                        `<td class="rk">${rank}</td>` +
                        `<td>${r.student_id}</td>` +
                        `<td>${r.student_name}${isMe ? '<span class="me-tag">我</span>' : ''}</td>` +
                        `<td class="sc">${parseFloat(r.duration).toFixed(1)}s</td></tr>`;
            });
            container.innerHTML = html + '</table>';
        } catch(e) { container.innerHTML = '<p style="color:#ffaa66; text-align:center; padding:15px;">网络拥堵，稍后重试</p>'; }
    }

    document.getElementById('submit-best-btn').onclick = async () => {
        // 🌟 核心防作弊校验
        if (gameActive || queue.length > 0) {
            alert("⚠️ 挑战尚未完成！请拼完本单元所有单词后再提交成绩。");
            return;
        }

        const time = parseFloat(document.getElementById('game-timer').innerText);
        if(time <= 0) return alert("请先通关游戏再提交成绩！");

        try {
            document.getElementById('submit-best-btn').innerText = "⏳ 提交中...";
            const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ class_name: currentStudent.class, student_id: currentStudent.id, student_name: currentStudent.name, unit_name: "U"+currentUnit, duration: time, score: 100, timestamp: Date.now() }) });
            if(res.ok) { 
                alert("✅ 成绩已成功上传！"); 
                markSubmitted();      // 提示切到「已提交」态
                updateCloudRank(); 
            }
        } catch(e) { alert("同步失败"); }
        finally { document.getElementById('submit-best-btn').innerText = "📤 提交本次成绩"; }
    };

    function finishGame() {
        gameActive = false; 
        stopSfx('bgm');
        const time = parseFloat(document.getElementById('game-timer').innerText);
        // 🌟 单元通关后，解锁提交按钮
        lockSubmitButton(false);
        alert(`🏁 单元通关！本次用时: ${time}s。\n请点击下方“提交本次成绩”同步至云端。`);
        updateCloudRank();
    }

    document.getElementById('music-toggle').onclick = function() { isMuted = !isMuted; this.innerText = isMuted ? "🔇" : "🔊"; if(isMuted) Object.values(sfx).forEach(s => s.pause()); else if(gameActive && !isPaused) playSfx('bgm', true); };
    /* Entry form is already present in the original HTML. */
</script>
</body>
</html>
