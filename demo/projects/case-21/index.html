    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8B4513;
            --primary-light: #D2691E;
            --accent: #FFD700;
            --bg-cream: #FDF8E7;
            --bg-paper: #FFFEF5;
            --text-dark: #2C1810;
            --text-muted: #6B4423;
            --success: #228B22;
            --error: #B22222;
            /* 下列两项为原文件既有变量，勿删 */
            --shadow-soft: 0 4px 20px rgba(139, 69, 19, 0.15);
            --shadow-card: 0 8px 32px rgba(139, 69, 19, 0.2);
        }

        /* ============================================================
           抽签仪式感增强层
           延续原本的「木质抽签箱」视觉基因，不引入新调性：
             主色  --primary #8B4513 木褐 / --primary-light #D2691E 赭
             点缀  --accent #FFD700 金
             底纹  --bg-cream #FDF8E7 / --bg-paper #FFFEF5
             字体  'Noto Serif SC' 衬线（标题与号码）+ 'Noto Sans SC' 正文
             动效  已有 float / spin / fadeInUp / numberPulse / roll
           本层只做：① 抽签滚动悬念 ② 结果页名额进度 ③ 键盘可达性
           ============================================================ */

        /* ① 滚动中的号码：用木褐描边虚化，营造"签在箱中翻动"的悬念 */
        .result-number.rolling {
            color: var(--primary-light);
            opacity: .72;
            filter: blur(.6px);
            animation: none;              /* 滚动期间不要脉冲，避免与滚动感冲突 */
            letter-spacing: 4px;
        }

        /* 定格瞬间：金环扩散，强化"被抽中"的一刻 */
        .result-card.settled {
            animation: settleGlow .9s cubic-bezier(.22, 1, .36, 1);
        }
        @keyframes settleGlow {
            0%   { box-shadow: 0 8px 30px rgba(255, 215, 0, .2), 0 0 0 0 rgba(255, 215, 0, .75); }
            60%  { box-shadow: 0 8px 30px rgba(255, 215, 0, .35), 0 0 0 18px rgba(255, 215, 0, 0); }
            100% { box-shadow: 0 8px 30px rgba(255, 215, 0, .2), 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        /* 抽签进行中：按钮给出"正在摇签"的呼吸提示 */
        .draw-button.drawing {
            pointer-events: none;
            animation: drawBreathe 1.1s ease-in-out infinite;
        }
        @keyframes drawBreathe {
            0%, 100% { filter: brightness(1); }
            50%      { filter: brightness(1.18); }
        }

        /* ② 结果页名额进度：让选手知道"我是第几个、还剩多少机会" */
        .result-quota {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, .72);
            border: 1px solid rgba(139, 69, 19, .18);
            border-radius: 12px;
            text-align: left;
        }
        .result-quota .rq-num {
            font-family: 'Noto Serif SC', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .result-quota .rq-txt {
            font-size: 12.5px;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .result-quota .rq-bar {
            flex: 1;
            height: 7px;
            border-radius: 50px;
            background: rgba(139, 69, 19, .14);
            overflow: hidden;
            min-width: 70px;
        }
        .result-quota .rq-fill {
            height: 100%;
            width: 0;
            border-radius: 50px;
            background: linear-gradient(90deg, var(--primary-light), var(--primary));
            transition: width .5s cubic-bezier(.22, 1, .36, 1);
        }

        /* ③ 键盘可达性：原文件没有任何焦点样式 */
        .draw-button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        button:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px rgba(255, 215, 0, .65), 0 6px 20px rgba(139, 69, 19, .3);
        }

        @media (prefers-reduced-motion: reduce) {
            .result-card.settled { animation: none; }
            .draw-button.drawing { animation: none; }
            .result-quota .rq-fill { transition: none; }
        }

        body {

            top: 15px;

        /* 表单区域 */
        .form-section {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-label {
            display: block;

            padding-left: 4px;
        }

        .form-label span {
            color: var(--primary-light);
            margin-left: 4px;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            font-size: 16px;
            border: 2px solid rgba(139, 69, 19, 0.15);

            background: white;

            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .form-input:focus {
            outline: none;

        .form-input::placeholder {

        /* 抽签按钮 */
        .draw-button {
            width: 100%;

            font-size: 18px;
            font-weight: 700;
            font-family: 'Noto Serif SC', serif;
            letter-spacing: 6px;
            color: white;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(139, 69, 19, 0.3);
            position: relative;
            overflow: hidden;
        }

        .draw-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .draw-button:hover::before {
            left: 100%;
        }

        .draw-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 69, 19, 0.4);
        }

        .draw-button:active {
            transform: translateY(0);
        }

        .draw-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .draw-button:disabled::before {
            display: none;
        }

        /* 加载动画 */
        .button-loading {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 消息提示 */
        .message {
            padding: 16px 20px;
            margin: 0 30px 20px;
            border-radius: 10px;

            animation: slideIn 0.3s ease;

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.show {
            display: flex;

        .message-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .message-content {
            flex: 1;
        }

        .message-title {
            font-weight: 700;
            margin-bottom: 4px;
        }

        .message-text {
            opacity: 0.9;
            line-height: 1.5;
        }

        .message.success {
            background: rgba(34, 139, 34, 0.1);
            border: 1px solid rgba(34, 139, 34, 0.3);
            color: var(--success);
        }

        .message.error {
            background: rgba(178, 34, 34, 0.08);
            border: 1px solid rgba(178, 34, 34, 0.3);
            color: var(--error);
        }

        .message.warning {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.4);

        }

        /* 结果展示 */
        .result-section {
            display: none;
            padding: 0 30px 30px;
            animation: fadeInUp 0.5s ease;
        }

        .result-section.show {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card {
            background: linear-gradient(135deg, #FFF8DC 0%, #FFFACD 100%);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            position: relative;
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.2);
        }

        .result-card::before {
            content: '🏆';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            background: var(--bg-paper);
            padding: 0 15px;
        }

        .result-label {
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 3px;
            margin-bottom: 15px;
            margin-top: 10px;
        }

        .result-number {
            font-family: 'Noto Serif SC', serif;
            font-size: 72px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
            text-shadow: 2px 2px 4px rgba(139, 69, 19, 0.1);
            animation: numberPulse 1s ease;
        }

        @keyframes numberPulse {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); }

        .result-unit {
            font-size: 18px;
            color: var(--text-muted);
            margin-top: 10px;
        }

        .result-info {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed rgba(139, 69, 19, 0.2);
            font-size: 14px;
            color: var(--text-muted);
        }

        .result-info strong {

        /* 已抽签状态 */
        .already-drawn {

            display: block;
        }

        .already-drawn-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .already-drawn-title {
            font-family: 'Noto Serif SC', serif;

            color: var(--success);

        .already-drawn-number {

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 20px 30px 30px;
            font-size: 12px;

        }

        /* 数字滚动动画 */
        .number-roll {
            display: inline-block;

        /* 响应式 */

    </style>

    <script>
        // API 配置
        const API = {
            session: 'https://qf.kjxs.site/api/hMDnpbr12NN',
            drawList: 'https://qf.kjxs.site/api/19TMQkcvEVG/all',
            submit: 'https://qf.kjxs.site/api/19TMQkcvEVG'
        };

        // 状态
        let currentSession = null;
        let existingDraws = [];
        let isLoading = false;

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', async () => {
            await loadSessionInfo();
            await loadDrawList();
        });

        // 加载场次信息
        async function loadSessionInfo() {
            try {
                const response = await fetch(API.session);
                const data = await response.json();
                
                if (data.submissions && data.submissions.length > 0) {
                    // 按时间排序，取最新的
                    const sessions = data.submissions.sort((a, b) => {
                        return new Date(b.submitted_at) - new Date(a.submitted_at);
                    });
                    currentSession = sessions[0];
                    
                    document.getElementById('sessionName').textContent = currentSession.name;
                    document.getElementById('totalCount').textContent = currentSession.num;
                    document.getElementById('sessionInfo').style.display = 'block';
                    document.getElementById('noSession').style.display = 'none';
                } else {
                    currentSession = null;
                    document.getElementById('sessionInfo').style.display = 'none';
                    document.getElementById('noSession').style.display = 'block';
                    document.getElementById('formSection').style.display = 'none';
                }
            } catch (error) {
                console.error('加载场次信息失败:', error);
                showMessage('error', '加载失败', '无法获取场次信息，请刷新页面重试');
            }
        }

        // 加载已抽签列表
        async function loadDrawList() {
            try {
                const response = await fetch(API.drawList);
                const data = await response.json();
                existingDraws = data.submissions || [];
                
                // 更新已抽签数量
                if (currentSession) {
                    const sessionDraws = existingDraws.filter(d => d.场次 === currentSession.name);
                    document.getElementById('drawnCount').textContent = sessionDraws.length;
                }
            } catch (error) {
                console.error('加载抽签列表失败:', error);
            }
        }

        // 检查学号是否已抽签
        function checkExistingDraw(studentId) {
            if (!currentSession) return null;
            return existingDraws.find(d => 
                d.场次 === currentSession.name && 
                d.学号 === studentId
            );
        }

        // 检查顺序号是否已被使用
        function isNumberUsed(number) {
            if (!currentSession) return true;
            return existingDraws.some(d => 
                d.场次 === currentSession.name && 
                parseInt(d.出场顺序号) === number
            );
        }

        // 生成不重复的顺序号
        function generateUniqueNumber() {
            if (!currentSession) return null;
            
            const maxNumber = parseInt(currentSession.num);
            const usedNumbers = new Set(
                existingDraws
                    .filter(d => d.场次 === currentSession.name)
                    .map(d => parseInt(d.出场顺序号))
            );
            
            // 如果所有号都已用完
            if (usedNumbers.size >= maxNumber) {
                return null;
            }
            
            // 随机生成未使用的号
            let number;
            do {
                number = Math.floor(Math.random() * maxNumber) + 1;
            } while (usedNumbers.has(number));
            
            return number;
        }

        // 处理抽签
        async function handleDraw() {
            if (isLoading) return;
            
            const name = document.getElementById('nameInput').value.trim();
            const studentId = document.getElementById('studentIdInput').value.trim();
            
            // 验证输入
            if (!name) {
                showMessage('error', '请填写姓名', '姓名不能为空');
                document.getElementById('nameInput').focus();
                return;
            }
            
            if (!studentId) {
                showMessage('error', '请填写学号', '学号不能为空');
                document.getElementById('studentIdInput').focus();
                return;
            }
            
            if (!currentSession) {
                showMessage('error', '暂无场次', '当前没有可以抽签的场次');
                return;
            }
            
            setLoading(true);
            hideMessage();
            
            try {
                // 重新加载最新数据
                await loadDrawList();
                
                // 检查是否已抽签
                const existing = checkExistingDraw(studentId);
                if (existing) {
                    // 显示已抽签结果
                    document.getElementById('formSection').style.display = 'none';
                    document.getElementById('existingNumber').textContent = existing.出场顺序号;
                    document.getElementById('alreadyDrawn').classList.add('show');
                    // 已抽过的同学也应看到名额进度（结果区）
                    const numEl = document.getElementById('drawResult');
                    if (numEl) numEl.textContent = existing.出场顺序号;
                    updateQuotaBoth(existing.出场顺序号);
                    setLoading(false);
                    return;
                }
                
                // 生成顺序号
                const drawNumber = generateUniqueNumber();
                if (drawNumber === null) {
                    showMessage('error', '抽签失败', '该场次所有号码已抽完');
                    setLoading(false);
                    return;
                }
                
                // 提交数据
                const submitData = {
                    场次: currentSession.name,
                    姓名: name,
                    学号: studentId,
                    出场顺序号: drawNumber
                };
                
                const response = await fetch(API.submit, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(submitData)
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    // 显示结果
                    document.getElementById('formSection').style.display = 'none';
                    document.getElementById('resultName').textContent = name;
                    document.getElementById('resultStudentId').textContent = studentId;
                    document.getElementById('resultSection').classList.add('show');

                    // 🌟 先滚动悬念，再定格（抽签的仪式感所在）
                    playRollThenSettle(drawNumber);
                } else {
                    showMessage('error', '提交失败', result.message || '请稍后重试');
                }
            } catch (error) {
                console.error('抽签失败:', error);
                showMessage('error', '抽签失败', '网络错误，请检查网络连接后重试');
            } finally {
                setLoading(false);
            }
        }

        // 🌟 滚动悬念 → 定格：抽签的仪式感核心
        //    原来的实现是直接把号码写进 DOM，少了"签在箱中翻动"的那两秒。
        function playRollThenSettle(finalNumber) {
            const numEl  = document.getElementById('drawResult');
            const cardEl = document.querySelector('.result-card');
            const btn    = document.getElementById('drawButton');

            // 尊重系统「减少动态效果」偏好：直接定格
            const reduce = window.matchMedia &&
                           window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            const finish = function () {
                numEl.classList.remove('rolling');
                numEl.textContent = finalNumber;
                if (cardEl) {
                    cardEl.classList.remove('settled');
                    void cardEl.offsetWidth;          // 重启动画
                    cardEl.classList.add('settled');
                }
                if (btn) btn.classList.remove('drawing');
                // 先把这位新抽到的同学计入，再算名额进度，否则「已抽 / 还剩」会少算 1 人
                const dc = document.getElementById('drawnCount');
                if (dc) dc.textContent = parseInt(dc.textContent || '0', 10) + 1;
                updateQuotaBoth(finalNumber);
            };

            if (reduce) { finish(); return; }

            if (btn) btn.classList.add('drawing');
            numEl.classList.add('rolling');

            const total = parseInt((document.getElementById('totalCount') || {}).textContent || '0', 10) || 0;
            const max = total > 0 ? total : 99;
            const startAt = Date.now();
            const DURATION = 1400;

            (function tick() {
                const elapsed = Date.now() - startAt;
                if (elapsed >= DURATION) { finish(); return; }
                // 越接近结束，翻动越快，制造"即将定格"的紧张感
                const remain = 1 - elapsed / DURATION;
                numEl.textContent = 1 + Math.floor(Math.random() * max);
                setTimeout(tick, 40 + 150 * remain);
            })();
        }

        // 名额进度：显示"我是第几位 / 共多少 / 还剩多少"
        // 结果卡与「已抽过」区块各有一份，用后缀区分
        function updateQuota(finalNumber, suffix) {
            suffix = suffix || '';
            const numEl = document.getElementById('rqNum' + suffix);
            const txtEl = document.getElementById('rqTxt' + suffix);
            const fill  = document.getElementById('rqFill' + suffix);
            if (!numEl || !txtEl || !fill) return;

            const total = parseInt((document.getElementById('totalCount') || {}).textContent || '0', 10) || 0;
            const drawn = parseInt((document.getElementById('drawnCount') || {}).textContent || '0', 10) || 0;
            const mine  = parseInt(finalNumber, 10) || 0;
            const left  = Math.max(total - drawn, 0);

            numEl.textContent = '第 ' + mine + ' 位';
            if (total > 0) {
                txtEl.innerHTML = '共 <b>' + total + '</b> 个名额 · 已抽 <b>' + drawn + '</b> 位' +
                                  (left > 0 ? ' · 还剩 <b>' + left + '</b> 位' : ' · <b>已全部抽完</b>');
                fill.style.width = Math.min(Math.round(drawn / total * 100), 100) + '%';
            } else {
                txtEl.textContent = '本场次未设置名额上限';
                fill.style.width = '0%';
            }
        }

        // 两份配额同时刷新
        function updateQuotaBoth(finalNumber) {
            updateQuota(finalNumber, '');
            updateQuota(finalNumber, '2');
        }

        // 设置加载状态
        function setLoading(loading) {
            isLoading = loading;
            const btn = document.getElementById('drawButton');
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="button-loading"><span class="spinner"></span>处理中...</span>';
            } else {
                btn.disabled = false;
                btn.innerHTML = '<span class="btn-text">立即抽签</span>';
            }
        }

        // 显示消息
        function showMessage(type, title, text) {
            const box = document.getElementById('messageBox');
            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️'
            };
            
            box.className = `message ${type} show`;
            box.querySelector('.message-icon').textContent = icons[type] || 'ℹ️';
            box.querySelector('.message-title').textContent = title;
            box.querySelector('.message-text').textContent = text;
        }

        // 隐藏消息
        function hideMessage() {
            document.getElementById('messageBox').classList.remove('show');
        }

        // 回车键提交
        document.getElementById('studentIdInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleDraw();
            }
        });
    </script>
</body>
