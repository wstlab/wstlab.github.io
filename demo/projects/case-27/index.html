<script>
    const SPEED = 90;
    const MAX_TIME = 10;
    const MAX_DIST = 900;

    const slider = document.getElementById('timeSlider');
    const timeDisp = document.getElementById('timeVal');
    const distDisp = document.getElementById('distVal');
    const car = document.getElementById('car');
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    const recordBtn = document.getElementById('recordBtn');
    const connectBtn = document.getElementById('connectBtn');
    const clearPointsBtn = document.getElementById('clearPointsBtn');
    const discoveryInput = document.getElementById('discoveryInput');
    const submitDiscovery = document.getElementById('submitDiscovery');
    const feedbackArea = document.getElementById('feedbackArea');
    const recordTableBody = document.getElementById('recordTableBody');
    
    // 新增学生信息元素
    const studentNameInput = document.getElementById('studentName');
    const studentIdInput = document.getElementById('studentId');

    let recordedPoints = [];
    let isConnected = false;

    function initCanvas() {
        const container = canvas.parentElement;
        canvas.width = container.clientWidth * 2;
        canvas.height = 400 * 2;
        canvas.style.width = container.clientWidth + 'px';
        canvas.style.height = '400px';
        ctx.scale(2, 2);
        drawGraph();
    }

    function update() {
        const t = parseInt(slider.value);
        const s = t * SPEED;
        timeDisp.innerText = t;
        distDisp.innerText = s;
        const carPos = (t / MAX_TIME) * 85;
        car.style.left = carPos + '%';
        drawGraph();
    }

    function drawGraph() {
        const w = canvas.width / 2;
        const h = 400;
        const margin = { top: 40, right: 40, bottom: 50, left: 60 };
        const innerW = w - margin.left - margin.right;
        const innerH = h - margin.top - margin.bottom;

        ctx.clearRect(0, 0, w, h);
        ctx.beginPath();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.moveTo(margin.left, margin.top);
        ctx.lineTo(margin.left, h - margin.bottom);
        ctx.lineTo(w - margin.right, h - margin.bottom);
        ctx.stroke();

        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.moveTo(margin.left - 5, margin.top);
        ctx.lineTo(margin.left + 5, margin.top);
        ctx.lineTo(margin.left, margin.top - 10);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(w - margin.right, h - margin.bottom - 5);
        ctx.lineTo(w - margin.right, h - margin.bottom + 5);
        ctx.lineTo(w - margin.right + 10, h - margin.bottom);
        ctx.fill();

        ctx.font = '14px Arial';
        ctx.fillText('时间 (时)', w - margin.right - 20, h - margin.bottom + 35);
        ctx.save();
        ctx.translate(20, margin.top + 50);
        ctx.rotate(-Math.PI/2);
        ctx.fillText('路程 (千米)', 0, 0);
        ctx.restore();

        ctx.textAlign = 'center';
        for(let i=0; i<=MAX_TIME; i+=1) {
            const x = margin.left + (i / MAX_TIME) * innerW;
            ctx.fillText(i, x, h - margin.bottom + 20);
            ctx.beginPath();
            ctx.moveTo(x, h - margin.bottom);
            ctx.lineTo(x, h - margin.bottom - 5);
            ctx.stroke();
        }

        ctx.textAlign = 'right';
        for(let i=0; i<=MAX_DIST; i+=90) {
            const y = h - margin.bottom - (i / MAX_DIST) * innerH;
            ctx.fillText(i, margin.left - 10, y + 5);
            ctx.beginPath();
            ctx.moveTo(margin.left, y);
            ctx.lineTo(margin.left + 5, y);
            ctx.stroke();
        }

        if (isConnected && recordedPoints.length > 0) {
            const sortedPoints = [...recordedPoints].sort((a, b) => a.t - b.t);
            ctx.beginPath();
            ctx.strokeStyle = '#3498db';
            ctx.lineWidth = 3;
            ctx.moveTo(margin.left, h - margin.bottom);
            sortedPoints.forEach(p => {
                const px = margin.left + (p.t / MAX_TIME) * innerW;
                const py = h - margin.bottom - (p.s / MAX_DIST) * innerH;
                ctx.lineTo(px, py);
            });
            const endX = margin.left + innerW;
            const endY = h - margin.bottom - innerH;
            ctx.lineTo(endX, endY);
            ctx.stroke();
        }

        recordedPoints.forEach(p => {
            const px = margin.left + (p.t / MAX_TIME) * innerW;
            const py = h - margin.bottom - (p.s / MAX_DIST) * innerH;
            ctx.beginPath();
            ctx.arc(px, py, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#27ae60';
            ctx.fill();
            ctx.fillStyle = '#27ae60';
            ctx.font = '12px Arial';
            ctx.fillText(`(${p.t}, ${p.s})`, px + 35, py - 10);
        });

        const t = parseInt(slider.value);
        const s = t * SPEED;
        const cx = margin.left + (t / MAX_TIME) * innerW;
        const cy = h - margin.bottom - (s / MAX_DIST) * innerH;

        ctx.beginPath();
        ctx.strokeStyle = 'rgba(231, 76, 60, 0.3)';
        ctx.moveTo(cx, h - margin.bottom);
        ctx.lineTo(cx, cy);
        ctx.lineTo(margin.left, cy);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#e74c3c';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    function updateRecordTable() {
        if (recordedPoints.length === 0) {
            recordTableBody.innerHTML = '<tr><td colspan="4" style="color:#999; font-style:italic;">暂无记录，请点击“记录当前坐标点”</td></tr>';
            return;
        }
        recordTableBody.innerHTML = '';
        recordedPoints.forEach((p, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${p.t}</td>
                <td>${p.s}</td>
                <td>${p.t === 0 ? '-' : (p.s / p.t)}</td>
            `;
            recordTableBody.appendChild(row);
        });
    }

    // 发送数据到API（包含学生信息、实验数据、发现）
    async function sendExperimentDataToServer(discoveryText, studentName, studentId) {
        try {
            const dataToSend = {
                student: {
                    name: studentName,
                    id: studentId
                },
                discovery: discoveryText,
                speed: SPEED,
                recordedPoints: recordedPoints.map(p => ({ time: p.t, distance: p.s })),
                totalPoints: recordedPoints.length,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent,
                referrer: document.referrer || window.location.href
            };
            const response = await fetch('https://qf.kjxs.site/api/8TlY4Lvx9JX', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(dataToSend)
            });
            if (response.ok) {
                console.log('[数据上报] 实验数据提交成功');
                return true;
            } else {
                console.warn('[数据上报] 服务器响应异常:', response.status);
                return false;
            }
        } catch (err) {
            console.error('[数据上报] 发送失败:', err);
            return false;
        }
    }

    // 验证学生信息
    function validateStudentInfo() {
        const name = studentNameInput.value.trim();
        const sid = studentIdInput.value.trim();
        if (name === "") {
            feedbackArea.style.display = 'block';
            feedbackArea.className = 'feedback-warning';
            feedbackArea.innerHTML = '⚠️ 请填写学生姓名（必填项）！';
            studentNameInput.focus();
            return false;
        }
        if (sid === "") {
            feedbackArea.style.display = 'block';
            feedbackArea.className = 'feedback-warning';
            feedbackArea.innerHTML = '⚠️ 请填写学号（必填项）！';
            studentIdInput.focus();
            return false;
        }
        return true;
    }

    recordBtn.onclick = () => {
        const t = parseInt(slider.value);
        const s = t * SPEED;
        if (!recordedPoints.find(p => p.t === t)) {
            recordedPoints.push({t, s});
            recordedPoints.sort((a, b) => a.t - b.t);
            drawGraph();
            updateRecordTable();
        }
    };

    connectBtn.onclick = () => {
        if (recordedPoints.length < 1) {
            alert("请先记录至少一个坐标点再尝试连线哦！");
            return;
        }
        isConnected = !isConnected;
        connectBtn.innerText = isConnected ? "🔓 取消连线" : "📏 将“所描的点连线”";
        drawGraph();
    };

    clearPointsBtn.onclick = () => {
        recordedPoints = [];
        isConnected = false;
        connectBtn.innerText = "📏 将“所描的点连线”";
        drawGraph();
        updateRecordTable();
    };

    // 提交发现：先验证学生信息必填，再验证发现内容，最后发送数据
    submitDiscovery.onclick = async () => {
        // 1. 验证学生姓名和学号
        if (!validateStudentInfo()) {
            return;
        }
        
        const val = discoveryInput.value.trim();
        if (!val) {
            feedbackArea.style.display = 'block';
            feedbackArea.className = 'feedback-warning';
            feedbackArea.innerHTML = '📝 请在“我的发现”框中输入你的观察结论！';
            discoveryInput.focus();
            return;
        }

        // 获取学生信息
        const studentName = studentNameInput.value.trim();
        const studentId = studentIdInput.value.trim();

        // 2. 显示反馈 (学习内容判断)
        const keywords = ['直线', '正比例', '不变', '比值', '90', '固定', '增加', '一样'];
        const isCorrect = keywords.some(k => val.includes(k));
        
        feedbackArea.style.display = 'block';
        if (isCorrect) {
            feedbackArea.className = 'feedback-success';
            feedbackArea.innerHTML = `<b>🌟 太棒了！</b> 你观察得很仔细。路程和时间的比值（速度）确实是固定不变的（都是90），而且它们在图像上连成了一条经过原点的直线。这就是典型的<b>正比例关系</b>！`;
        } else {
            feedbackArea.className = 'feedback-error';
            feedbackArea.innerHTML = `<b>🤔 再思考一下：</b> 试着观察一下实验记录表中“比值”那一列的结果是多少？图像连起来后是什么形状？<br><br><b>解析：</b> 在这个情境中，路程 ÷ 时间 = 90（速度），比值保持不变。当两个相关联的量比值一定时，它们就成正比例关系，图像是一条经过原点的直线。`;
        }
        
        // 3. 将数据（包含学生信息和实验记录）发送到指定API
        await sendExperimentDataToServer(val, studentName, studentId);
        
        // 可选：提交成功后给予额外提示（但不用覆盖学习反馈，仅在控制台记录或小提示）
        // 为了友好，可短暂在反馈区追加一个小提示（不覆盖）
        const originalMsg = feedbackArea.innerHTML;
        setTimeout(() => {
            if (feedbackArea.innerHTML === originalMsg) {
                // 保持原样，不做额外覆盖，但数据已发送
            }
        }, 100);
    };

    window.addEventListener('resize', initCanvas);
    slider.addEventListener('input', update);

    setTimeout(() => {
        initCanvas();
        update();
    }, 100);
</script>
</body>
</html>
