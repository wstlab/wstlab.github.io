        const totalErrorsEl=document.getElementById('totalErrors'),elapsedTimeEl=document.getElementById('elapsedTime');
        const radarCanvas=document.getElementById('radarCanvas'), ctx=radarCanvas.getContext('2d');
        const numberInputs={A:document.getElementById('inputA'),B:document.getElementById('inputB'),C:document.getElementById('inputC'),D:document.getElementById('inputD')};

        function initClassSelect(){ studentClassSelect.innerHTML='<option value="">-- 请选择班级 --</option>'; for(let i=1;i<=24;i++){ const o=document.createElement('option'); o.value=i; o.textContent=i+' 班'; studentClassSelect.appendChild(o); } }
        btnLogin.addEventListener('click',()=>{
            const name=studentNameInput.value.trim(), cls=studentClassSelect.value; let valid=true;
            if(!name){document.getElementById('nameError').textContent='请输入演示称呼';valid=false;}else if(name.length>20){document.getElementById('nameError').textContent='姓名不能超过20个字符';valid=false;}else document.getElementById('nameError').textContent='';
            if(!cls){document.getElementById('classError').textContent='请选择班级';valid=false;}else document.getElementById('classError').textContent='';
            if(!valid)return;
            studentName=name;studentClass=cls;
            welcomeText.textContent='👋 欢迎 '+studentName+' 同学（'+studentClass+'班）挑战推理！';
            loginPage.style.display='none';gamePage.style.display='flex';resetGame();
        });
        studentNameInput.addEventListener('keydown',e=>{if(e.key==='Enter')btnLogin.click();});
        btnLogout.addEventListener('click',()=>{stopTimer();gameStarted=false;gameOver=false;loginPage.style.display='flex';gamePage.style.display='none';resetGame();});

        function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}}
        function updateTimerDisplay(){ const m=Math.floor(timeRemaining/60),s=timeRemaining%60; timerBox.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); timerBox.classList.toggle('warning',timeRemaining<=60); }
        function updateSidePanel(){
            const t1s=task1Locked?task1Score:(task1Attempts>0?Math.max(30-task1Attempts*5,-99):0);
            const t2s=task2Locked?task2Score:(task2Attempts>0?Math.max(30-task2Attempts*5,-99):0);
            const t3s=finalSubmitted?task3Score:0;
            score1El.textContent=task1Locked?task1Score+'分':(task1Attempts>0?'提交中...':'--');
            score2El.textContent=task2Locked?task2Score+'分':(task2Attempts>0?'提交中...':'--');
            score3El.textContent=finalSubmitted?task3Score+'分':'--';
            totalScoreEl.textContent=finalSubmitted?(t1s+t2s+t3s)+'分':'--';
            const tAttempts=task1Attempts+task2Attempts+(finalSubmitted?1:0);
            const tErrors=(task1Locked?Math.max(task1Attempts-1,0):task1Attempts)+(task2Locked?Math.max(task2Attempts-1,0):task2Attempts)+(finalSubmitted?(4-(task3Score/10)):0);
            totalAttemptsEl.textContent=tAttempts;totalErrorsEl.textContent=tErrors;
            elapsedTimeEl.textContent=(TOTAL_TIME-timeRemaining)+'秒';drawRadar();
        }
        function drawRadar(){
            const w=radarCanvas.width,h=radarCanvas.height; ctx.clearRect(0,0,w,h);
            const cx=w/2,cy=h/2,maxR=95,axes=5;
            const labels=['任务一','任务二','任务三','总分','效率'];
            const t1s=task1Locked?Math.max(task1Score,-99):(task1Attempts>0?Math.max(30-task1Attempts*5,-99):0);
            const t2s=task2Locked?Math.max(task2Score,-99):(task2Attempts>0?Math.max(30-task2Attempts*5,-99):0);
            const t3s=finalSubmitted?task3Score:0;
            const raw=[t1s,t2s,t3s,t1s+t2s+t3s,100-((task1Attempts+task2Attempts)*8)];
            const pct=raw.map((v,i)=>Math.max(v/[30,30,40,100,100][i]*100,0));
            for(let r=1;r<=4;r++){ctx.beginPath();for(let i=0;i<axes;i++){const a=-Math.PI/2+i*(2*Math.PI/axes);const rx=cx+maxR*(r/4)*Math.cos(a),ry=cy+maxR*(r/4)*Math.sin(a);i===0?ctx.moveTo(rx,ry):ctx.lineTo(rx,ry);}ctx.closePath();ctx.strokeStyle='rgba(200,170,130,0.15)';ctx.lineWidth=0.8;ctx.stroke();}
            for(let i=0;i<axes;i++){const a=-Math.PI/2+i*(2*Math.PI/axes);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+maxR*Math.cos(a),cy+maxR*Math.sin(a));ctx.strokeStyle='rgba(200,170,130,0.25)';ctx.lineWidth=1;ctx.stroke();}
            ctx.beginPath();for(let i=0;i<axes;i++){const a=-Math.PI/2+i*(2*Math.PI/axes);const v=Math.min(pct[i],100)/100;const rx=cx+maxR*v*Math.cos(a),ry=cy+maxR*v*Math.sin(a);i===0?ctx.moveTo(rx,ry):ctx.lineTo(rx,ry);}ctx.closePath();ctx.fillStyle='rgba(212,167,116,0.22)';ctx.fill();ctx.strokeStyle='rgba(240,184,100,0.7)';ctx.lineWidth=2;ctx.stroke();
            for(let i=0;i<axes;i++){const a=-Math.PI/2+i*(2*Math.PI/axes);const v=Math.min(pct[i],100)/100;ctx.beginPath();ctx.arc(cx+maxR*v*Math.cos(a),cy+maxR*v*Math.sin(a),4,0,2*Math.PI);ctx.fillStyle='#f0c060';ctx.fill();ctx.strokeStyle='#1a1f2e';ctx.lineWidth=1.2;ctx.stroke();}
            ctx.fillStyle='#c0b8a8';ctx.font='9px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
            for(let i=0;i<axes;i++){const a=-Math.PI/2+i*(2*Math.PI/axes);ctx.fillText(labels[i],cx+(maxR+12)*Math.cos(a),cy+(maxR+12)*Math.sin(a));}
        }

        function getSumCollection(nums){ const s=[]; for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)s.push(nums[i]+nums[j]); return [...new Set(s)].sort((a,b)=>a-b); }
        function randomInts(count,min,max){ const nums=[]; for(let i=0;i<count;i++) nums.push(Math.floor(Math.random()*(max-min+1))+min); return nums; }

        function startNewGame(){
            const minV=parseInt(minInput.value),maxV=parseInt(maxInput.value);
            if(isNaN(minV)||isNaN(maxV)||minV>=maxV){alert('请设置有效的范围');return;}
            const nums=randomInts(4,minV,maxV);
            secret=nums;
            sums=[secret[0]+secret[1],secret[1]+secret[2],secret[2]+secret[3],secret[3]+secret[0],secret[0]+secret[2],secret[1]+secret[3]];
            sumCollection=getSumCollection(secret);
            const freq={};secret.forEach(v=>freq[v]=(freq[v]||0)+1);
            const values=Object.values(freq);
            if(values.length===1) maxRevealedAllowed=0;
            else if(values.length===2 && values.includes(2) && values.includes(2)) maxRevealedAllowed=1;
            else maxRevealedAllowed=2;
            sumRevealed=[false,false,false,false,false,false];maxRevealed=0;
            selectedMax=null;sortOrder=[];task1Locked=false;task2Locked=false;
            task1Attempts=0;task2Attempts=0;task1Score=0;task2Score=0;task3Score=0;
            gameOver=false;gameStarted=true;finalSubmitted=false;
            timeRemaining=TOTAL_TIME;stopTimer();updateTimerDisplay();timerBox.classList.remove('warning');
            minInput.disabled=true;maxInput.disabled=true;btnStartGame.textContent='🔄 重新开始';
            document.querySelectorAll('.max-btn').forEach(b=>b.classList.remove('active'));
            task1Feedback.textContent='';task1Feedback.className='feedback-inline';
            task2Feedback.textContent='';task2Feedback.className='feedback-inline';
            finalResult.innerHTML='';
            Object.values(numberInputs).forEach(inp=>{inp.value='';inp.disabled=false;});
            btnReveal.disabled=true;btnSubmitTask1.disabled=false;btnSubmitTask2.disabled=true;btnClearSort.disabled=true;
            sumCollectionText.textContent='{'+sumCollection.join(', ')+'}';
            limitHint.textContent=maxRevealedAllowed===0?'(不可查看和)':maxRevealedAllowed===1?'(仅可点开1个和)':'(可点开2个和)';
            renderCardsAndLines();updateSortDisplay();updateCardSelectionUI();updateSidePanel();drawRadar();
            timerInterval=setInterval(()=>{timeRemaining--;updateTimerDisplay();updateSidePanel();if(timeRemaining<=0){stopTimer();autoSubmit();}},1000);
        }

        function autoSubmit(){
            if(gameOver||finalSubmitted)return;
            if(!task1Locked){task1Score=task1Attempts>0?Math.max(30-task1Attempts*5,-99):0;task1Locked=true;}
            if(!task2Locked){task2Score=task2Attempts>0?Math.max(30-task2Attempts*5,-99):0;task2Locked=true;}
            let correct3=0;LABELS.forEach(l=>{if(parseInt(numberInputs[l].value)===secret[LABELS.indexOf(l)])correct3++;});
            task3Score=correct3*10;finalSubmitted=true;gameOver=true;btnReveal.disabled=true;
            revealAll();updateSidePanel();showFinalFeedback();sendRecord(3,correct3===4,task3Score);
        }

        function resetGame(){
            stopTimer();gameStarted=false;gameOver=false;task1Locked=false;task2Locked=false;
            task1Attempts=0;task2Attempts=0;task1Score=0;task2Score=0;task3Score=0;finalSubmitted=false;
            secret=[];sumRevealed=[false,false,false,false,false,false];maxRevealed=0;maxRevealedAllowed=2;
            sumCollection=[];selectedMax=null;sortOrder=[];timeRemaining=TOTAL_TIME;updateTimerDisplay();timerBox.classList.remove('warning');
            minInput.disabled=false;maxInput.disabled=false;btnStartGame.textContent='▶ 开始';
            sumCollectionText.textContent='--';limitHint.textContent='(可点开2个和)';
            document.querySelectorAll('.max-btn').forEach(b=>b.classList.remove('active'));
            task1Feedback.textContent='';task2Feedback.textContent='';finalResult.innerHTML='';
            Object.values(numberInputs).forEach(inp=>{inp.value='';inp.disabled=false;});
            btnReveal.disabled=false;btnSubmitTask1.disabled=false;btnSubmitTask2.disabled=true;btnClearSort.disabled=true;
            circleStage.querySelectorAll('.card-node').forEach(c=>c.remove());linesSvg.innerHTML='';
            updateSortDisplay();updateSidePanel();drawRadar();
        }

        function renderCardsAndLines(){
            circleStage.querySelectorAll('.card-node').forEach(c=>c.remove());
            const radius = 50, center = 50;
            const angles = [45, 135, 225, 315];
            const positions = angles.map(a => ({
                x: center + radius * Math.cos(a * Math.PI / 180),
                y: center + radius * Math.sin(a * Math.PI / 180),
            }));
            for(let i=0;i<4;i++){
                const cardNode=document.createElement('div');cardNode.className='card-node';
                cardNode.setAttribute('data-index',i);cardNode.setAttribute('data-label',LABELS[i]);
                cardNode.style.left=positions[i].x+'%';cardNode.style.top=positions[i].y+'%';
                cardNode.innerHTML=`<div class="card-inner"><div class="card-face card-back"><span class="back-letter">${LABELS[i]}</span></div><div class="card-face card-front"><span class="number">${secret[i]}</span><span style="font-size:0.55rem;">卡片${LABELS[i]}</span></div></div>`;
                cardNode.addEventListener('click',()=>onCardClick(i,cardNode));
                circleStage.appendChild(cardNode);
            }
            drawLines(positions);
        }

        function drawLines(pos){
            linesSvg.innerHTML='';
            const edges=[{i:0,j:1,id:0,type:'edge'},{i:1,j:2,id:1,type:'edge'},{i:2,j:3,id:2,type:'edge'},{i:3,j:0,id:3,type:'edge'},{i:0,j:2,id:4,type:'diag'},{i:1,j:3,id:5,type:'diag'}];
            edges.forEach(edge=>{
                const p1=pos[edge.i],p2=pos[edge.j];
                const line=document.createElementNS('http://www.w3.org/2000/svg','line');
                ['x1','y1','x2','y2'].forEach((attr,idx)=>line.setAttribute(attr,[p1.x,p1.y,p2.x,p2.y][idx]));
                line.setAttribute('stroke',edge.type==='diag'?'rgba(255,200,130,0.45)':'rgba(200,170,120,0.35)');
                line.setAttribute('stroke-width',edge.type==='diag'?'1.2':'1.5');
                if(edge.type==='diag')line.setAttribute('stroke-dasharray','4 3');
                linesSvg.appendChild(line);
                let mx,my;
                if(edge.type==='edge'){mx=(p1.x+p2.x)/2;my=(p1.y+p2.y)/2;}
                else{const t=1/3;mx=p1.x+(p2.x-p1.x)*t;my=p1.y+(p2.y-p1.y)*t;const dx=mx-50,dy=my-50;const dist=Math.sqrt(dx*dx+dy*dy)||1;mx+=dx/dist*4;my+=dy/dist*4;}
                const g=document.createElementNS('http://www.w3.org/2000/svg','g');
                g.setAttribute('class','sum-point');g.setAttribute('data-sum-index',edge.id);
                g.addEventListener('click',ev=>{ev.stopPropagation();toggleSum(edge.id);});
                const circ=document.createElementNS('http://www.w3.org/2000/svg','circle');
                ['cx','cy','r'].forEach((attr,idx)=>circ.setAttribute(attr,[mx,my,7][idx]));
                circ.classList.add('sum-circle');if(edge.type==='diag')circ.classList.add('diag');
                if(sumRevealed[edge.id])circ.classList.add('revealed');g.appendChild(circ);
                const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
                txt.setAttribute('x',mx);txt.setAttribute('y',my);txt.setAttribute('class','sum-text');txt.setAttribute('id','sumText'+edge.id);
                updateSumText(txt,edge.id);g.appendChild(txt);linesSvg.appendChild(g);
            });
        }

        function updateSumText(el, idx) {
            while (el.firstChild) el.removeChild(el.firstChild);
            const tS = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
            tS.textContent = 'S';
            const tSub = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
            tSub.setAttribute('class', 'subscript'); tSub.textContent = (idx + 1);
            el.appendChild(tS); el.appendChild(tSub);
            if (sumRevealed[idx]) {
                const tEq = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
                tEq.textContent = '=' + sums[idx]; el.appendChild(tEq);
            }
        }

        function toggleSum(i) {
            if (!gameStarted || gameOver) return;
            if (sumRevealed[i]) { alert('此和已显示，不能隐藏。'); return; }
            if (maxRevealed >= maxRevealedAllowed) {
                alert(maxRevealedAllowed === 0 ? '当前题目不允许查看任何和。' : '最多只能查看' + maxRevealedAllowed + '个和！');
                return;
            }
            sumRevealed[i] = true; maxRevealed++;
            const el = document.getElementById('sumText' + i); if (el) updateSumText(el, i);
            const circ = document.querySelector(`.sum-point[data-sum-index="${i}"] .sum-circle`); if (circ) circ.classList.add('revealed');
        }

        function onCardClick(index) {
            if (!gameStarted || gameOver || task2Locked) return;
            if (!task1Locked) { alert('请先完成任务一！'); return; }
            const label = LABELS[index];
            if (sortOrder.includes(label)) { alert('该卡片已在排序中'); return; }
            if (sortOrder.length >= 4) { alert('排序已满'); return; }
            if (label === selectedMax) { alert('最大值已在首位'); return; }
            sortOrder.push(label); updateSortDisplay();
        }

        function updateSortDisplay() {
            let h = '';
            for (let i = 0; i < 4; i++) {
                h += `<span class="sort-slot">${sortOrder[i]||'?'}</span>`;
                if (i < 3) h += ' <span style="color:#b4945a;">≥</span> ';
            }
            sortDisplay.innerHTML = h;
        }

        function clearSort() {
            if (task2Locked || gameOver) return;
            sortOrder = task1Locked && selectedMax ? [selectedMax] : [];
            updateSortDisplay();
        }

        function updateCardSelectionUI() {
            circleStage.querySelectorAll('.card-node').forEach(c => {
                c.classList.toggle('selected-max', c.dataset.label === selectedMax && !gameOver);
            });
        }

        function activateTask2() {
            sortOrder = [selectedMax]; updateSortDisplay();
            btnSubmitTask2.disabled = false; btnClearSort.disabled = false;
            task2Feedback.textContent = ''; task2Feedback.className = 'feedback-inline';
            checkRevealBtn();
        }

        function checkRevealBtn() { btnReveal.disabled = !(task1Locked && task2Locked); }

        function verifyAnswer(guesses) {
            const nums = [guesses.A, guesses.B, guesses.C, guesses.D];
            const candCollection = getSumCollection(nums);
            if (candCollection.join(',') !== sumCollection.join(',')) return false;
            for (let i = 0; i < 6; i++) {
                if (sumRevealed[i]) {
                    const pairs = [[0,1],[1,2],[2,3],[3,0],[0,2],[1,3]];
                    const [a,b] = pairs[i];
                    if (nums[a] + nums[b] !== sums[i]) return false;
                }
            }
            return true;
        }

        function getQuestionSignature() {
            return LABELS.map((l,i) => l + secret[i]).join('');
        }

        function getAnswerRecord(taskId, isCorrect, score) {
            const elapsed = TOTAL_TIME - timeRemaining;
            const t1s = task1Locked ? task1Score : (task1Attempts > 0 ? Math.max(30 - task1Attempts * 5, -99) : 0);
            const t2s = task2Locked ? task2Score : (task2Attempts > 0 ? Math.max(30 - task2Attempts * 5, -99) : 0);
            const t3s = finalSubmitted ? task3Score : 0;
            const tAttempts = task1Attempts + task2Attempts + (finalSubmitted ? 1 : 0);
            const tErrors = (task1Locked ? Math.max(task1Attempts - 1, 0) : task1Attempts) + (task2Locked ? Math.max(task2Attempts - 1, 0) : task2Attempts) + (finalSubmitted ? (4 - (task3Score / 10)) : 0);
            return {
                姓名: studentName,
                班级: studentClass + '班',
                任务编号: taskId,
                任务名称: taskId === 1 ? '猜最大值' : (taskId === 2 ? '排序' : '推算数字'),
                提交次数: taskId === 1 ? task1Attempts : (taskId === 2 ? task2Attempts : (finalSubmitted ? 1 : 0)),
                本次是否正确: isCorrect ? '正确' : '错误',
                任务得分: score,
                总提交次数: tAttempts,
                总错误次数: tErrors,
                任务一得分: t1s,
                任务二得分: t2s,
                任务三得分: t3s,
                总得分: t1s + t2s + t3s,
                总耗时秒: elapsed,
                数字范围: minInput.value + '~' + maxInput.value,
                时间戳: new Date().toLocaleString('zh-CN'),
                questionSignature: getQuestionSignature()  // 新增题目签名
            };
        }

        async function sendRecord(taskId, isCorrect, score) {
            try {
                await fetch(QUICKFORM_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(getAnswerRecord(taskId, isCorrect, score)),
                });
            } catch (e) {}
        }

        function revealAll() {
            const cards = circleStage.querySelectorAll('.card-node');
            cards.forEach((c, i) => setTimeout(() => c.classList.add('flipped'), i * 120));
            sumRevealed = [true, true, true, true, true, true];
            for (let i = 0; i < 6; i++) { const el = document.getElementById('sumText' + i); if (el) updateSumText(el, i); }
        }

        function showFinalFeedback() {
            const realMax = LABELS[secret.indexOf(Math.max(...secret))];
            const t1c = task1Locked && selectedMax === realMax;
            const t2c = task2Locked && sortOrder.length === 4 && verifySort(sortOrder);
            let h = '';
            h += `<div style="padding:0.35rem 0.5rem;border-left:4px solid ${t1c?'#5cb878':'#e0556a'};background:rgba(255,255,255,0.03);">任务一：${t1c?'✅正确 '+task1Score+'分':'❌ 最大值是'+realMax+'（'+Math.max(...secret)+'）'}</div>`;
            h += `<div style="padding:0.35rem 0.5rem;border-left:4px solid ${t2c?'#5cb878':'#e0556a'};background:rgba(255,255,255,0.03);">任务二：${t2c?'✅正确 '+task2Score+'分':'❌ 排序不满足从大到小（含相等）'}</div>`;
            h += `<div style="padding:0.35rem 0.5rem;border-left:4px solid ${task3Score===40?'#5cb878':'#e0556a'};background:rgba(255,255,255,0.03);">任务三：${task3Score}分（正确${task3Score/10}/4空）</div>`;
            h += `<div style="text-align:center;font-size:1rem;margin-top:0.25rem;">🌟 总分：<strong>${task1Score+task2Score+task3Score}</strong>/100</div>`;
            finalResult.innerHTML = h;
        }

        function verifySort(order) {
            if (order.length !== 4) return false;
            const values = order.map(l => secret[LABELS.indexOf(l)]);
            const maxVal = Math.max(...secret);
            if (values[0] !== maxVal) return false;
            for (let i = 1; i < 4; i++) {
                if (values[i-1] < values[i]) return false;
            }
            return true;
        }

        // 事件绑定
        maxButtons.addEventListener('click', e => {
            if (!gameStarted || gameOver || task1Locked) return;
            if (e.target.classList.contains('max-btn')) {
                const card = e.target.dataset.card;
                selectedMax = (selectedMax === card) ? null : card;
                document.querySelectorAll('.max-btn').forEach(b => b.classList.remove('active'));
                if (selectedMax) e.target.classList.add('active');
                updateCardSelectionUI();
            }
        });
        btnSubmitTask1.addEventListener('click', () => {
            if (!gameStarted || gameOver || task1Locked) return;
            if (!selectedMax) { task1Feedback.textContent = '请先选择卡片'; task1Feedback.className = 'feedback-inline incorrect'; return; }
            task1Attempts++;
            const realMax = LABELS[secret.indexOf(Math.max(...secret))];
            const isCorrect = (selectedMax === realMax);
            if (isCorrect) {
                task1Locked = true; task1Score = Math.max(30 - (task1Attempts - 1) * 5, -99);
                task1Feedback.textContent = '✅ 正确！得分：' + task1Score + '分'; task1Feedback.className = 'feedback-inline correct';
                btnSubmitTask1.disabled = true; activateTask2();
            } else {
                task1Feedback.textContent = '❌ 不对（已提交' + task1Attempts + '次）'; task1Feedback.className = 'feedback-inline incorrect';
            }
            updateSidePanel(); drawRadar(); sendRecord(1, isCorrect, task1Score);
        });
        btnSubmitTask2.addEventListener('click', () => {
            if (!gameStarted || gameOver || task2Locked) return;
            if (!task1Locked) { alert('请先完成任务一'); return; }
            if (sortOrder.length < 4) { alert('请填满4个排序位置'); return; }
            task2Attempts++;
            const isCorrect = verifySort(sortOrder);
            if (isCorrect) {
                task2Locked = true; task2Score = Math.max(30 - (task2Attempts - 1) * 5, -99);
                task2Feedback.textContent = '✅ 正确！得分：' + task2Score + '分'; task2Feedback.className = 'feedback-inline correct';
                btnSubmitTask2.disabled = true; btnClearSort.disabled = true;
            } else {
                task2Feedback.textContent = '❌ 排序不满足从大到小（含相等）'; task2Feedback.className = 'feedback-inline incorrect';
            }
            checkRevealBtn(); updateSidePanel(); drawRadar(); sendRecord(2, isCorrect, task2Score);
        });
        btnClearSort.addEventListener('click', clearSort);
        btnReveal.addEventListener('click', () => {
            if (!gameStarted || gameOver || finalSubmitted) return;
            if (!task1Locked || !task2Locked) { alert('请先完成任务一和任务二并提交正确！'); return; }
            const guesses = {}; LABELS.forEach(l => guesses[l] = parseInt(numberInputs[l].value));
            if (Object.values(guesses).some(v => isNaN(v))) { alert('请填写所有数字'); return; }
            stopTimer();
            const correct = verifyAnswer(guesses);
            const correctCount = LABELS.filter(l => guesses[l] === secret[LABELS.indexOf(l)]).length;
            task3Score = correct ? 40 : correctCount * 10;
            finalSubmitted = true; gameOver = true; btnReveal.disabled = true;
            revealAll(); updateSidePanel(); showFinalFeedback(); sendRecord(3, correct, task3Score);
        });

        btnStartGame.addEventListener('click', startNewGame);
        btnResetGame.addEventListener('click', resetGame);

        initClassSelect(); resetGame(); updateSortDisplay(); drawRadar();
    })();
</script>
