            const maxInput = document.getElementById('maxInput');
            const task1Feedback = document.getElementById('task1Feedback');
            const task2Feedback = document.getElementById('task2Feedback');
            const timerBox = document.getElementById('timerBox');
            const score1El = document.getElementById('score1');
            const score2El = document.getElementById('score2');
            const score3El = document.getElementById('score3');
            const totalScoreEl = document.getElementById('totalScore');
            const totalAttemptsEl = document.getElementById('totalAttempts');
            const totalErrorsEl = document.getElementById('totalErrors');
            const elapsedTimeEl = document.getElementById('elapsedTime');
            const radarCanvas = document.getElementById('radarCanvas');
            const ctx = radarCanvas.getContext('2d');
            const cloudStatusSpan = document.getElementById('cloudStatus');
            const testCloudBtn = document.getElementById('testCloudBtn');

            const numberInputs = {
                A: document.getElementById('inputA'),
                B: document.getElementById('inputB'),
                C: document.getElementById('inputC'),
                D: document.getElementById('inputD'),
                E: document.getElementById('inputE'),
            };

            // 生成班级下拉框
            function initClassSelect() {
                studentClassSelect.innerHTML = '<option value="">-- 请选择班级 --</option>';
                for (let i = 1; i <= 24; i++) {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = i + ' 班';
                    studentClassSelect.appendChild(option);
                }
            }

            // 云端状态显示
            function updateCloudStatus(status, msg) {
                if (cloudStatusSpan) {
                    const color = (status === '成功') ? '#5cb878' : ((status === '测试') ? '#f0b84d' : '#e0556a');
                    cloudStatusSpan.innerHTML = `<span style="color:${color}">${status}</span> ${msg}`;
                    setTimeout(() => {
                        if (cloudStatusSpan.innerText.includes(msg)) cloudStatusSpan.innerText = '就绪';
                    }, 4000);
                }
            }

            // 发送数据到云端（带详细错误反馈）
            async function sendToQuickForm(data) {
                try {
                    const response = await fetch(QUICKFORM_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        mode: 'cors',
                        body: JSON.stringify(data)
                    });
                    if (response.ok) {
                        console.log('✅ 数据已提交到QuickForm', data);
                        updateCloudStatus('成功', `任务${data.任务编号}已提交`);
                    } else {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                } catch (error) {
                    console.error('❌ QuickForm提交失败:', error.message);
                    let errMsg = error.message;
                    if (errMsg.includes('Failed to fetch') || errMsg.includes('NetworkError')) errMsg = '网络错误或CORS拦截';
                    updateCloudStatus('失败', `${errMsg}`);
                    alert(`云端提交失败：${errMsg}\n请检查网络连接，如持续失败请联系老师。`);
                }
            }

            // 生成题目签名 (A数字B数字C数字...)
            function getQuestionSignature() {
                if (secret && secret.length === 5) {
                    return secret.map((val, idx) => LABELS[idx] + val).join('');
                }
                return '';
            }

            // 构建答题记录
            function getAnswerRecord(taskId, attemptCount, isCorrect, score) {
                const elapsed = TOTAL_TIME - timeRemaining;
                const t1s = task1Locked ? task1Score : (task1Attempts > 0 ? Math.max(30 - task1Attempts * 5, -99) : 0);
                const t2s = task2Locked ? task2Score : (task2Attempts > 0 ? Math.max(30 - task2Attempts * 5, -99) : 0);
                const t3s = finalSubmitted ? task3Score : 0;
                const tAttempts = task1Attempts + task2Attempts + (finalSubmitted ? 1 : 0);
                const tErrors = (task1Locked ? Math.max(task1Attempts - 1, 0) : task1Attempts) +
                    (task2Locked ? Math.max(task2Attempts - 1, 0) : task2Attempts) +
                    (finalSubmitted ? (5 - (task3Score / 8)) : 0);
                return {
                    姓名: studentName,
                    班级: studentClass + '班',
                    任务编号: taskId,
                    任务名称: taskId === 1 ? '猜最大值' : (taskId === 2 ? '排序' : '推算数字'),
                    提交次数: attemptCount,
                    本次是否正确: isCorrect ? '正确' : '错误',
                    任务得分: score,
                    总提交次数: tAttempts,
                    总错误次数: tErrors,
                    任务一得分: t1s,
                    任务二得分: t2s,
                    任务三得分: t3s,
                    总得分: t1s + t2s + t3s,
                    总耗时秒: elapsed,
                    游戏模式: isAdvancedMode ? '升级' : '普通',
                    数字范围: minInput.value + '~' + maxInput.value,
                    题目签名: getQuestionSignature(),
                    时间戳: new Date().toLocaleString('zh-CN')
                };
            }

            function sendTaskSubmit(taskId, isCorrect, score) {
                const record = getAnswerRecord(taskId, taskId===1 ? task1Attempts : (taskId===2 ? task2Attempts : 1), isCorrect, score);
                sendToQuickForm(record);
            }

            // 随机生成5个不重复数字
            function randomDistinctNumbers(count, min, max) {
                if (max - min + 1 < count) return null;
                const arr = [];
                for (let i = min; i <= max; i++) arr.push(i);
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr.slice(0, count);
            }

            function stopTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = null; }
            function updateTimerDisplay() {
                const m = Math.floor(timeRemaining / 60), s = timeRemaining % 60;
                timerBox.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                timerBox.classList.toggle('warning', timeRemaining <= 60);
            }

            function drawRadar() {
                const w = radarCanvas.width, h = radarCanvas.height, cx = w/2, cy = h/2, maxR = 95, axes = 5;
                ctx.clearRect(0,0,w,h);
                const t1s = task1Locked ? task1Score : (task1Attempts>0 ? Math.max(30-task1Attempts*5,-99):0);
                const t2s = task2Locked ? task2Score : (task2Attempts>0 ? Math.max(30-task2Attempts*5,-99):0);
                const t3s = finalSubmitted ? task3Score : 0;
                const raw = [t1s, t2s, t3s, t1s+t2s+t3s, 100 - (task1Attempts+task2Attempts)*8];
                const percs = raw.map((v,i)=> Math.max(v / [30,30,40,100,100][i] * 100, 0));
                for (let r=1;r<=4;r++) {
                    ctx.beginPath();
                    for (let i=0;i<axes;i++) {
                        const angle = -Math.PI/2 + i*2*Math.PI/axes;
                        const x = cx + maxR*(r/4)*Math.cos(angle), y = cy + maxR*(r/4)*Math.sin(angle);
                        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
                    }
                    ctx.closePath();
                    ctx.strokeStyle = 'rgba(200,170,130,0.15)'; ctx.stroke();
                }
                for (let i=0;i<axes;i++) {
                    const angle = -Math.PI/2 + i*2*Math.PI/axes;
                    ctx.beginPath();
                    ctx.moveTo(cx,cy);
                    ctx.lineTo(cx+maxR*Math.cos(angle), cy+maxR*Math.sin(angle));
                    ctx.strokeStyle = 'rgba(200,170,130,0.25)'; ctx.stroke();
                }
                ctx.beginPath();
                for(let i=0;i<axes;i++) {
                    const angle = -Math.PI/2 + i*2*Math.PI/axes;
                    const val = Math.min(percs[i],100)/100;
                    const x = cx + maxR*val*Math.cos(angle), y = cy + maxR*val*Math.sin(angle);
                    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
                }
                ctx.closePath();
                ctx.fillStyle = 'rgba(212,167,116,0.22)'; ctx.fill();
                ctx.strokeStyle = '#f0b84d'; ctx.lineWidth = 2; ctx.stroke();
            }

            function updateSidePanel() {
                const t1s = task1Locked ? task1Score : (task1Attempts>0?Math.max(30-task1Attempts*5,-99):0);
                const t2s = task2Locked ? task2Score : (task2Attempts>0?Math.max(30-task2Attempts*5,-99):0);
                const t3s = finalSubmitted ? task3Score : 0;
                score1El.textContent = task1Locked ? task1Score+'分' : (task1Attempts>0?'提交中...':'--');
                score2El.textContent = task2Locked ? task2Score+'分' : (task2Attempts>0?'提交中...':'--');
                score3El.textContent = finalSubmitted ? task3Score+'分' : '--';
                totalScoreEl.textContent = finalSubmitted ? (t1s+t2s+t3s)+'分' : '--';
                totalAttemptsEl.textContent = task1Attempts+task2Attempts+(finalSubmitted?1:0);
                const errs = (task1Locked?Math.max(task1Attempts-1,0):task1Attempts)+(task2Locked?Math.max(task2Attempts-1,0):task2Attempts)+(finalSubmitted?(5-(task3Score/8)):0);
                totalErrorsEl.textContent = errs;
                elapsedTimeEl.textContent = (TOTAL_TIME - timeRemaining)+'秒';
                drawRadar();
            }

            function revealAll() {
                document.querySelectorAll('.card-node').forEach((c,i)=>setTimeout(()=>c.classList.add('flipped'), i*100));
                sumRevealed = [true,true,true,true,true];
                for(let i=0;i<5;i++) { const el = document.getElementById('sumText'+i); if(el) updateSumText(el,i); }
                const realMax = LABELS[secret.indexOf(Math.max(...secret))];
                const maxCard = circleStage.querySelector(`.card-node[data-label="${realMax}"]`);
                if(maxCard) maxCard.style.filter = 'drop-shadow(0 0 18px gold)';
            }

            function showFinalFeedback() {
                const realMax = LABELS[secret.indexOf(Math.max(...secret))];
                const realSorted = [...secret].sort((a,b)=>b-a).map(n=>LABELS[secret.indexOf(n)]);
                const t1c = task1Locked && selectedMax === realMax;
                const t2c = task2Locked && sortOrder.join(',') === realSorted.join(',');
                let h = '';
                h += `<div style="padding:0.4rem 0.6rem;border-left:4px solid ${t1c?'#5cb878':'#e0556a'};background:rgba(255,255,255,0.03);border-radius:0 0.5rem 0.5rem 0;">任务一：${t1c?'✅正确 '+task1Score+'分':'❌ 最大值是'+realMax+'（'+Math.max(...secret)+'）'}</div>`;
                h += `<div style="padding:0.4rem 0.6rem;border-left:4px solid ${t2c?'#5cb878':'#e0556a'};background:rgba(255,255,255,0.03);border-radius:0 0.5rem 0.5rem 0;">任务二：${t2c?'✅正确 '+task2Score+'分':'❌ 正确排序：'+realSorted.join(' > ')}</div>`;
                h += `<div style="padding:0.4rem 0.6rem;border-left:4px solid ${task3Score===40?'#5cb878':'#e0556a'};background:rgba(255,255,255,0.03);border-radius:0 0.5rem 0.5rem 0;">任务三：${task3Score}分（正确${task3Score/8}/5空）</div>`;
                const total = task1Score + task2Score + task3Score;
                h += `<div style="text-align:center;font-size:1.1rem;margin-top:0.3rem;">🌟 总分：<strong>${total}</strong>/100 ${total===100?'🏆 完美！':''}</div>`;
                finalResult.innerHTML = h;
            }

            function autoSubmit() {
                if(gameOver || finalSubmitted) return;
                if(!task1Locked) { task1Score = task1Attempts>0?Math.max(30-task1Attempts*5,-99):0; task1Locked=true; }
                if(!task2Locked) { task2Score = task2Attempts>0?Math.max(30-task2Attempts*5,-99):0; task2Locked=true; }
                let correct3=0;
                LABELS.forEach(l=>{ if(parseInt(numberInputs[l].value)===secret[LABELS.indexOf(l)]) correct3++; });
                task3Score = correct3*8;
                finalSubmitted = true; gameOver = true;
                revealAll(); updateSidePanel(); showFinalFeedback();
                sendTaskSubmit(3, correct3===5, task3Score);
            }

            function startNewGame() {
                const minv = parseInt(minInput.value), maxv = parseInt(maxInput.value);
                if(isNaN(minv)||isNaN(maxv)||minv>=maxv) { alert('无效范围'); return; }
                const nums = randomDistinctNumbers(5, minv, maxv);
                if(!nums) { alert('范围数字不足5个'); return; }
                secret = nums;
                sums = [secret[0]+secret[1], secret[1]+secret[2], secret[2]+secret[3], secret[3]+secret[4], secret[4]+secret[0]];
                diffIndex=-1; diffValue=0; sumRevealed=[false,false,false,false,false]; selectedMax=null; sortOrder=[];
                task1Locked=task2Locked=false; task1Attempts=task2Attempts=0; task1Score=task2Score=task3Score=0;
                gameOver=false; gameStarted=true; finalSubmitted=false; timeRemaining=TOTAL_TIME;
                stopTimer(); updateTimerDisplay();
                minInput.disabled=true; maxInput.disabled=true; btnStartGame.textContent='🔄 重新开始';
                document.querySelectorAll('.max-btn').forEach(b=>b.classList.remove('active'));
                task1Feedback.textContent=task2Feedback.textContent=''; finalResult.innerHTML='';
                Object.values(numberInputs).forEach(inp=>{ inp.value=''; inp.disabled=false; });
                btnReveal.disabled=true; btnSubmitTask1.disabled=false; btnSubmitTask2.disabled=true; btnClearSort.disabled=true;
                renderCardsAndLines(); updateSortDisplay(); updateCardSelectionUI(); updateSidePanel();
                timerInterval = setInterval(()=>{ timeRemaining--; updateTimerDisplay(); updateSidePanel(); if(timeRemaining<=0) { stopTimer(); autoSubmit(); } }, 1000);
            }

            function resetGame() {
                stopTimer(); gameStarted=false; gameOver=false; task1Locked=task2Locked=false;
                task1Attempts=task2Attempts=0; task1Score=task2Score=task3Score=0; finalSubmitted=false;
                secret=[]; diffIndex=-1; sumRevealed=[false,false,false,false,false]; selectedMax=null; sortOrder=[];
                minInput.disabled=false; maxInput.disabled=false; btnStartGame.textContent='▶ 开始';
                circleStage.querySelectorAll('.card-node').forEach(c=>c.remove()); linesSvg.innerHTML='';
                updateSortDisplay(); updateSidePanel();
            }

            function renderCardsAndLines() {
                circleStage.querySelectorAll('.card-node').forEach(c=>c.remove());
                const radius=50, center=50, angles=[-90,-18,54,126,198];
                for(let i=0;i<5;i++) {
                    const a = angles[i]*Math.PI/180;
                    const x = center+radius*Math.cos(a), y = center+radius*Math.sin(a);
                    const card = document.createElement('div');
                    card.className='card-node'; card.setAttribute('data-index',i); card.setAttribute('data-label',LABELS[i]);
                    card.style.left = x+'%'; card.style.top = y+'%';
                    card.innerHTML = `<div class="card-inner"><div class="card-face card-back"><span class="back-letter">${LABELS[i]}</span></div><div class="card-face card-front"><span class="number">${secret[i]}</span><span style="font-size:0.6rem;">卡片${LABELS[i]}</span></div></div>`;
                    card.addEventListener('click',()=>onCardClick(i));
                    circleStage.appendChild(card);
                }
                drawLines(angles, radius, center);
            }

            function drawLines(angles, radius, center) {
                linesSvg.innerHTML='';
                for(let i=0;i<5;i++) {
                    const j = (i+1)%5;
                    const a1 = angles[i]*Math.PI/180, a2 = angles[j]*Math.PI/180;
                    const x1 = center+radius*Math.cos(a1), y1 = center+radius*Math.sin(a1);
                    const x2 = center+radius*Math.cos(a2), y2 = center+radius*Math.sin(a2);
                    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
                    line.setAttribute('x1',x1); line.setAttribute('y1',y1); line.setAttribute('x2',x2); line.setAttribute('y2',y2);
                    line.setAttribute('stroke','rgba(200,170,120,0.35)'); line.setAttribute('stroke-width','1.1');
                    linesSvg.appendChild(line);
                    const mx = (x1+x2)/2, my = (y1+y2)/2;
                    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
                    g.setAttribute('class','sum-point'); g.setAttribute('data-sum-index',i);
                    g.addEventListener('click',(e)=>{ e.stopPropagation(); toggleSum(i); });
                    const circ = document.createElementNS('http://www.w3.org/2000/svg','circle');
                    circ.setAttribute('cx',mx); circ.setAttribute('cy',my); circ.setAttribute('r',8);
                    circ.classList.add('sum-circle'); if(isAdvancedMode && i===diffIndex) circ.classList.add('diff');
                    g.appendChild(circ);
                    const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
                    txt.setAttribute('x',mx); txt.setAttribute('y',my); txt.setAttribute('class','sum-text'); txt.setAttribute('id','sumText'+i);
                    updateSumText(txt,i);
                    g.appendChild(txt); linesSvg.appendChild(g);
                }
            }

            function updateSumText(el, idx) {
                el.innerHTML='';
                if(isAdvancedMode && idx===diffIndex) {
                    el.innerHTML = `<tspan class="diff-label">差</tspan><tspan>=${diffValue}</tspan>`;
                } else {
                    el.innerHTML = `<tspan>S</tspan><tspan class="subscript">${idx+1}</tspan>${sumRevealed[idx]?`=${sums[idx]}`:''}`;
                }
            }

            function toggleSum(i) {
                if (!gameStarted || gameOver) return;
                if (isAdvancedMode) {
                    if (diffIndex === i) { alert('此位置显示差值，不可操作。'); return; }
                    if (diffIndex !== -1 && sumRevealed[i]) { alert('升级模式：已显示的和不能隐藏。'); return; }
                    if (diffIndex === -1) {
                        const revealedCount = sumRevealed.filter(v => v).length;
                        if (sumRevealed[i]) { alert('升级模式：已显示的和不能隐藏。'); return; }
                        if (revealedCount < 4) { sumRevealed[i] = true; } else {
                            diffIndex = i;
                            const nextIdx = (i + 1) % 5;
                            diffValue = Math.abs(secret[nextIdx] - secret[i]);
                            sumRevealed[i] = false;
                            const el = document.getElementById('sumText' + i);
                            if (el) updateSumText(el, i);
                            const circ = document.querySelector(`.sum-point[data-sum-index="${i}"] .sum-circle`);
                            if (circ) circ.classList.add('diff');
                            return;
                        }
                    } else {
                        if (sumRevealed[i]) { alert('升级模式：已显示的和不能隐藏。'); return; }
                        const revealedCount = sumRevealed.filter(v => v).length;
                        if (revealedCount >= 4) { alert('升级模式：最多只能查看4个和！'); return; }
                        sumRevealed[i] = true;
                    }
                } else { sumRevealed[i] = !sumRevealed[i]; }
                const el = document.getElementById('sumText' + i);
                if (el) updateSumText(el, i);
            }
            function onCardClick(idx) {
                if(!gameStarted||gameOver||task2Locked) return;
                if(!task1Locked) { alert('请先完成任务一！'); return; }
                const label = LABELS[idx];
                if(sortOrder.includes(label)) { alert('该卡片已在排序中'); return; }
                if(sortOrder.length>=5) { alert('排序已满'); return; }
                if(label === selectedMax) { alert('最大值已在首位'); return; }
                sortOrder.push(label);
                updateSortDisplay();
            }
            function updateSortDisplay() {
                let html='';
                for(let i=0;i<5;i++) html += `<span class="sort-slot">${sortOrder[i]||'?'}</span>${i<4?' <span style="color:#b4945a;">></span> ':''}`;
                sortDisplay.innerHTML=html;
            }
            function updateCardSelectionUI() {
                circleStage.querySelectorAll('.card-node').forEach(c=>c.classList.toggle('selected-max', c.dataset.label===selectedMax && !gameOver));
            }
            function activateTask2() { sortOrder = [selectedMax]; updateSortDisplay(); btnSubmitTask2.disabled=false; btnClearSort.disabled=false; task2Feedback.textContent=''; task2Feedback.className='feedback-inline'; checkRevealBtn(); }
            function checkRevealBtn() { btnReveal.disabled = !(task1Locked&&task2Locked); }

            // 事件绑定
            btnLogin.addEventListener('click',()=>{
                const name = studentNameInput.value.trim();
                const cls = studentClassSelect.value;
                if(!name){ nameError.textContent='请输入演示称呼'; return; } else nameError.textContent='';
                if(!cls){ classError.textContent='请选择班级'; return; } else classError.textContent='';
                studentName=name; studentClass=cls;
                welcomeText.textContent=`👋 欢迎 ${studentName} 同学（${studentClass}班）挑战推理！`;
                loginPage.style.display='none'; gamePage.style.display='flex'; resetGame();
            });
            btnLogout.addEventListener('click',()=>{ stopTimer(); loginPage.style.display='flex'; gamePage.style.display='none'; studentNameInput.value=''; studentClassSelect.value=''; nameError.textContent=''; classError.textContent=''; });
            btnStartGame.addEventListener('click',startNewGame);
            btnResetGame.addEventListener('click',resetGame);
            btnAdvancedMode.addEventListener('click',()=>{ isAdvancedMode=!isAdvancedMode; btnAdvancedMode.textContent=isAdvancedMode?'🔄 普通模式':'🚀 游戏升级'; btnAdvancedMode.classList.toggle('btn-advanced',isAdvancedMode); circleStage.classList.toggle('advanced-mode',isAdvancedMode); resetGame(); });
            maxButtons.addEventListener('click',(e)=>{
                if(!gameStarted||gameOver||task1Locked) return;
                if(e.target.classList.contains('max-btn')){
                    const card = e.target.dataset.card;
                    selectedMax = selectedMax===card ? null : card;
                    document.querySelectorAll('.max-btn').forEach(b=>b.classList.remove('active'));
                    if(selectedMax) e.target.classList.add('active');
                    updateCardSelectionUI();
                }
            });
            btnSubmitTask1.addEventListener('click',()=>{
                if(!gameStarted||gameOver||task1Locked) return;
                if(!selectedMax){ task1Feedback.textContent='请先选择卡片'; task1Feedback.className='feedback-inline incorrect'; return; }
                task1Attempts++;
                const realMax = LABELS[secret.indexOf(Math.max(...secret))];
                const correct = selectedMax===realMax;
                if(correct){
                    task1Locked=true;
                    task1Score = Math.max(30-(task1Attempts-1)*5,-99);
                    task1Feedback.textContent=`✅ 正确！得分：${task1Score}分`;
                    task1Feedback.className='feedback-inline correct';
                    btnSubmitTask1.disabled=true;
                    activateTask2();
                } else {
                    task1Feedback.textContent=`❌ 不对（已提交${task1Attempts}次）`;
                    task1Feedback.className='feedback-inline incorrect';
                }
                updateSidePanel();
                sendTaskSubmit(1, correct, task1Score);
            });
            btnSubmitTask2.addEventListener('click',()=>{
                if(!gameStarted||gameOver||task2Locked) return;
                if(!task1Locked) { alert('请先完成任务一'); return; }
                if(sortOrder.length<5){ alert('请填满5个排序位置'); return; }
                task2Attempts++;
                const realSorted = [...secret].sort((a,b)=>b-a).map(n=>LABELS[secret.indexOf(n)]);
                const correct = sortOrder.join(',') === realSorted.join(',');
                if(correct){
                    task2Locked=true;
                    task2Score = Math.max(30-(task2Attempts-1)*5,-99);
                    task2Feedback.textContent=`✅ 正确！得分：${task2Score}分`;
                    task2Feedback.className='feedback-inline correct';
                    btnSubmitTask2.disabled=true; btnClearSort.disabled=true;
                } else {
                    task2Feedback.textContent=`❌ 排序有误（已提交${task2Attempts}次）`;
                    task2Feedback.className='feedback-inline incorrect';
                }
                checkRevealBtn(); updateSidePanel(); sendTaskSubmit(2, correct, task2Score);
            });
            btnClearSort.addEventListener('click',()=>{ if(!task2Locked) sortOrder = (task1Locked&&selectedMax)?[selectedMax]:[]; updateSortDisplay(); });
            btnReveal.addEventListener('click',()=>{
                if(!gameStarted||gameOver||finalSubmitted) return;
                if(!task1Locked||!task2Locked){ alert('请先完成任务一和任务二并提交正确！'); return; }
                const guesses = {};
                LABELS.forEach(l=>guesses[l]=parseInt(numberInputs[l].value));
                if(Object.values(guesses).some(v=>isNaN(v))){ alert('请填写所有数字'); return; }
                stopTimer();
                let correct3=0;
                LABELS.forEach(l=>{ if(guesses[l]===secret[LABELS.indexOf(l)]) correct3++; });
                task3Score = correct3*8;
                finalSubmitted=true; gameOver=true; btnReveal.disabled=true;
                revealAll(); updateSidePanel(); showFinalFeedback();
                sendTaskSubmit(3, correct3===5, task3Score);
            });
            testCloudBtn.addEventListener('click', async ()=>{
                updateCloudStatus('测试', '发送测试中...');
                try{
                    const testData = { 测试: true, 姓名: studentName||'匿名', 时间: new Date().toISOString() };
                    const res = await fetch(QUICKFORM_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(testData) });
                    if(res.ok) updateCloudStatus('测试', '连接成功 ✅');
                    else updateCloudStatus('测试', `HTTP ${res.status}`);
                } catch(e){ updateCloudStatus('测试', '失败 (CORS/网络)'); }
            });
            initClassSelect(); resetGame(); updateSidePanel();
        })();
    </script>

</body></html>
