    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            padding: 25px;
            position: relative;

        h1 {
            text-align: center;

            font-size: 28px;
        }
        
        .description {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 16px;
        }
        
        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin-bottom: 25px;
            min-height: 400px;
        }
        
        .word-column, .meaning-column {
            width: 48%;
            display: flex;
            flex-direction: column;
        }
        
        .word-item, .meaning-item {
            background-color: #3498db;
            color: white;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 8px;

            transition: all 0.2s;
            user-select: none;

        }
        
        .word-item:hover, .meaning-item:hover {
            transform: translateY(-2px);

        }
        
        .word-item.selected {
            background-color: #e74c3c;
        }
        
        .meaning-item.selected {
            background-color: #e74c3c;
        }
        
        .word-item.matched, .meaning-item.matched {
            background-color: #2ecc71;
            cursor: default;
        }
        
        .word-item.matched:hover, .meaning-item.matched:hover {
            transform: none;
            box-shadow: none;
        }
        
        .canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        canvas {
            width: 100%;
            height: 100%;
        }
        
        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        
        .page-indicator {
            text-align: center;
            margin: 10px 0;
            font-weight: bold;

        }
        
        .progress-bar {
            height: 8px;

        .progress {
            height: 100%;
            background-color: #2ecc71;

        .modal {

            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 100;

            align-items: center;
        }
        
        .modal-content {
            background-color: white;

            width: 90%;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }
        
        .modal h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ddd;

        .success-message {
            display: none;

<body>
    <div class="container">
        <h1>七年级英语单词连连看</h1>
        <p class="description">请将左侧的英语单词与右侧的中文释义正确连线</p>
        
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        
        <div class="page-indicator" id="page-indicator">第 1 页 / 共 3 页</div>
        
        <div class="game-container" id="game-container">
            <div class="word-column" id="word-column"></div>
            <div class="meaning-column" id="meaning-column"></div>
            <div class="canvas-container">
                <canvas id="connection-canvas"></canvas>
            </div>
        </div>
        
        <div class="navigation">
            <button id="prev-btn" disabled>上一页</button>
            <button id="next-btn">下一页</button>
        </div>
        
        <div class="success-message" id="success-message">
            数据回收成功！
        </div>
    </div>
    
    <div class="modal" id="name-modal">
        <div class="modal-content">
            <h2>游戏完成！</h2>
            <p>请输入您的名字以提交成绩</p>
            <input type="text" id="student-name" placeholder="请输入您的姓名">
            <button id="submit-btn">提交成绩</button>
        </div>
    </div>

    <script>
        // 七年级英语单词数据（示例）
        const wordData = [
            // 第一页
            [
                { word: "hello", meaning: "你好" },
                { word: "teacher", meaning: "老师" },
                { word: "student", meaning: "学生" },
                { word: "book", meaning: "书" },
                { word: "pen", meaning: "钢笔" },
                { word: "pencil", meaning: "铅笔" },
                { word: "classroom", meaning: "教室" },
                { word: "desk", meaning: "书桌" },
                { word: "chair", meaning: "椅子" },
                { word: "school", meaning: "学校" }
            ],
            // 第二页
            [
                { word: "friend", meaning: "朋友" },
                { word: "family", meaning: "家庭" },
                { word: "mother", meaning: "母亲" },
                { word: "father", meaning: "父亲" },
                { word: "brother", meaning: "兄弟" },
                { word: "sister", meaning: "姐妹" },
                { word: "home", meaning: "家" },
                { word: "room", meaning: "房间" },
                { word: "bed", meaning: "床" },
                { word: "window", meaning: "窗户" }
            ],
            // 第三页
            [
                { word: "apple", meaning: "苹果" },
                { word: "banana", meaning: "香蕉" },
                { word: "orange", meaning: "橙子" },
                { word: "water", meaning: "水" },
                { word: "food", meaning: "食物" },
                { word: "cat", meaning: "猫" },
                { word: "dog", meaning: "狗" },
                { word: "bird", meaning: "鸟" },
                { word: "fish", meaning: "鱼" },
                { word: "color", meaning: "颜色" }
            ]
        ];

        // 游戏状态
        let currentPage = 0;
        let selectedWord = null;
        let selectedMeaning = null;
        let matchedPairs = [[], [], []];
        let connections = [];
        
        // DOM元素
        const wordColumn = document.getElementById('word-column');
        const meaningColumn = document.getElementById('meaning-column');
        const canvas = document.getElementById('connection-canvas');
        const ctx = canvas.getContext('2d');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageIndicator = document.getElementById('page-indicator');
        const progressBar = document.getElementById('progress');
        const nameModal = document.getElementById('name-modal');
        const studentNameInput = document.getElementById('student-name');
        const submitBtn = document.getElementById('submit-btn');
        const successMessage = document.getElementById('success-message');

        // 初始化游戏
        function initGame() {
            renderPage(currentPage);
            updateNavigation();
            updateProgress();
            
            // 设置Canvas大小
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // 绑定事件监听器
            prevBtn.addEventListener('click', goToPrevPage);
            nextBtn.addEventListener('click', goToNextPage);
            submitBtn.addEventListener('click', submitResults);
        }

        // 渲染当前页
        function renderPage(pageIndex) {
            wordColumn.innerHTML = '';
            meaningColumn.innerHTML = '';
            connections = [];
            
            const words = [...wordData[pageIndex]];
            const meanings = [...wordData[pageIndex]];
            
            // 打乱单词顺序
            shuffleArray(words);
            
            // 打乱释义顺序
            shuffleArray(meanings);
            
            // 渲染单词
            words.forEach((item, index) => {
                const wordElement = document.createElement('div');
                wordElement.className = 'word-item';
                if (matchedPairs[pageIndex].some(pair => pair.word === item.word)) {
                    wordElement.classList.add('matched');
                }
                wordElement.textContent = item.word;
                wordElement.dataset.word = item.word;
                wordElement.dataset.index = index;
                wordElement.addEventListener('click', () => selectWord(wordElement, pageIndex));
                wordColumn.appendChild(wordElement);
            });
            
            // 渲染释义
            meanings.forEach((item, index) => {
                const meaningElement = document.createElement('div');
                meaningElement.className = 'meaning-item';
                if (matchedPairs[pageIndex].some(pair => pair.meaning === item.meaning)) {
                    meaningElement.classList.add('matched');
                }
                meaningElement.textContent = item.meaning;
                meaningElement.dataset.meaning = item.meaning;
                meaningElement.dataset.index = index;
                meaningElement.addEventListener('click', () => selectMeaning(meaningElement, pageIndex));
                meaningColumn.appendChild(meaningElement);
            });
            
            // 更新页面指示器
            pageIndicator.textContent = `第 ${pageIndex + 1} 页 / 共 3 页`;
            
            // 重绘画布
            redrawConnections();
        }

        // 选择单词
        function selectWord(wordElement, pageIndex) {
            if (wordElement.classList.contains('matched')) return;
            
            // 清除之前的选择
            clearSelections();
            
            // 选择当前单词
            selectedWord = wordElement;
            wordElement.classList.add('selected');
        }

        // 选择释义
        function selectMeaning(meaningElement, pageIndex) {
            if (meaningElement.classList.contains('matched')) return;
            
            // 如果有选中的单词
            if (selectedWord) {
                selectedMeaning = meaningElement;
                meaningElement.classList.add('selected');
                
                // 检查是否匹配
                const word = selectedWord.dataset.word;
                const meaning = selectedMeaning.dataset.meaning;
                
                const isMatch = wordData[pageIndex].some(item => 
                    item.word === word && item.meaning === meaning
                );
                
                if (isMatch) {
                    // 匹配成功
                    setTimeout(() => {
                        selectedWord.classList.remove('selected');
                        selectedMeaning.classList.remove('selected');
                        selectedWord.classList.add('matched');
                        selectedMeaning.classList.add('matched');
                        
                        // 保存匹配对
                        matchedPairs[pageIndex].push({ word, meaning });
                        
                        // 绘制连线
                        drawConnection(selectedWord, selectedMeaning);
                        
                        // 检查页面是否完成
                        checkPageCompletion(pageIndex);
                        
                        // 重置选择
                        selectedWord = null;
                        selectedMeaning = null;
                    }, 300);
                } else {
                    // 匹配失败
                    setTimeout(() => {
                        selectedWord.classList.remove('selected');
                        selectedMeaning.classList.remove('selected');
                        selectedWord = null;
                        selectedMeaning = null;
                    }, 500);
                }
            }
        }

        // 清除选择
        function clearSelections() {
            if (selectedWord) {
                selectedWord.classList.remove('selected');
                selectedWord = null;
            }
            if (selectedMeaning) {
                selectedMeaning.classList.remove('selected');
                selectedMeaning = null;
            }
        }

        // 绘制连线
        function drawConnection(wordElement, meaningElement) {
            const wordRect = wordElement.getBoundingClientRect();
            const meaningRect = meaningElement.getBoundingClientRect();
            const containerRect = document.getElementById('game-container').getBoundingClientRect();
            
            const startX = wordRect.right - containerRect.left;
            const startY = wordRect.top + wordRect.height / 2 - containerRect.top;
            const endX = meaningRect.left - containerRect.left;
            const endY = meaningRect.top + meaningRect.height / 2 - containerRect.top;
            
            connections.push({
                startX, startY, endX, endY,
                word: wordElement.dataset.word,
                meaning: meaningElement.dataset.meaning
            });
            
            redrawConnections();
        }

        // 重绘所有连线
        function redrawConnections() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#2ecc71';
            ctx.lineWidth = 2;
            
            connections.forEach(conn => {
                ctx.beginPath();
                ctx.moveTo(conn.startX, conn.startY);
                ctx.lineTo(conn.endX, conn.endY);
                ctx.stroke();
            });
        }

        // 调整Canvas大小
        function resizeCanvas() {
            const container = document.getElementById('game-container');
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
            redrawConnections();
        }

        // 检查页面是否完成
        function checkPageCompletion(pageIndex) {
            if (matchedPairs[pageIndex].length === wordData[pageIndex].length) {
                // 页面完成
                updateProgress();
                
                // 如果是最后一页，显示完成模态框
                if (pageIndex === 2) {
                    setTimeout(() => {
                        nameModal.style.display = 'flex';
                    }, 1000);
                }
            }
        }

        // 更新进度条
        function updateProgress() {
            const totalPairs = wordData[0].length + wordData[1].length + wordData[2].length;
            const completedPairs = matchedPairs[0].length + matchedPairs[1].length + matchedPairs[2].length;
            const progress = (completedPairs / totalPairs) * 100;
            progressBar.style.width = `${progress}%`;
        }

        // 上一页
        function goToPrevPage() {
            if (currentPage > 0) {
                currentPage--;
                renderPage(currentPage);
                updateNavigation();
            }
        }

        // 下一页
        function goToNextPage() {
            if (currentPage < 2) {
                currentPage++;
                renderPage(currentPage);
                updateNavigation();
            }
        }

        // 更新导航按钮状态
        function updateNavigation() {
            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = currentPage === 2;
        }

        // 提交结果
        function submitResults() {
            const name = studentNameInput.value.trim();
            if (!name) {
                alert('请输入您的姓名');
                return;
            }
            
            // 准备提交数据
            const submitData = {
                name: name,
                score: calculateScore(),
                completedAt: new Date().toISOString(),
                matchedPairs: matchedPairs
            };
            
            // 发送数据到服务器
            fetch('https://qf.kjxs.site/api/mT7b48FfiLC', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(submitData)
            })
            .then(response => {
                if (response.ok) {
                    // 提交成功
                    nameModal.style.display = 'none';
                    successMessage.style.display = 'block';
                } else {
                    throw new Error('提交失败');
                }
            })
            .catch(error => {
                alert('提交失败，请稍后重试');
                console.error('Error:', error);
            });
        }

        // 计算分数
        function calculateScore() {
            let score = 0;
            for (let i = 0; i < 3; i++) {
                score += matchedPairs[i].length;
            }
            return score;
        }

        // 辅助函数：打乱数组
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 初始化游戏
        window.onload = initGame;
    </script>
</body>
</html>
