<script>
    // ---------- 全局数据 ----------
    let groupDiscussions = {};      // { groupName: [ {studentId, text, timestamp} ] }
    let currentUser = { group: null, studentId: null, isLoggedIn: false };
    let mindmapChart = null;        // echarts 实例

    const allGroups = ["丝路历史人物","丝路美食传承","陆上丝路地理","海上丝绸之路","丝路历史","丝路与一带一路","丝路艺术之音乐","丝路艺术之美术","丝路建筑","丝路文学"];

    // 初始化 localStorage
    function loadData() {
        const stored = localStorage.getItem("silkroad_mindmap_data");
        if(stored) {
            groupDiscussions = JSON.parse(stored);
        } else {
            groupDiscussions = {};
            allGroups.forEach(g => { groupDiscussions[g] = []; });
            // 示例预置数据
            groupDiscussions["丝路历史人物"].push({ studentId: "研学助手", text: "张骞出使西域，开辟丝路通道", timestamp: new Date().toISOString() });
            groupDiscussions["丝路历史人物"].push({ studentId: "历史小学者", text: "班超再通西域，加强汉朝治理", timestamp: new Date().toISOString() });
            groupDiscussions["丝路美食传承"].push({ studentId: "美食探索者", text: "胡饼、葡萄、石榴丰富了中原饮食", timestamp: new Date().toISOString() });
        }
        persistData();
    }
    function persistData() {
        localStorage.setItem("silkroad_mindmap_data", JSON.stringify(groupDiscussions));
    }

    // 渲染左侧观点列表
    function renderOpinions() {
        if(!currentUser.isLoggedIn) return;
        const group = currentUser.group;
        const opinions = groupDiscussions[group] || [];
        const container = document.getElementById("opinionsList");
        if(opinions.length === 0) {
            container.innerHTML = '<div style="color:#b48a5c; text-align:center; padding:20px;">✨ 暂无观点，点击「金点子」获得启发 ✨</div>';
            return;
        }
        container.innerHTML = opinions.map(op => `
            <div class="opinion-card">
                <div class="opinion-meta"><span><i class="fas fa-user-graduate"></i> ${escapeHtml(op.studentId)}</span><span>${new Date(op.timestamp).toLocaleTimeString()}</span></div>
                <div class="opinion-text">${escapeHtml(op.text)}</div>
            </div>
        `).join('');
        container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    // 发表观点
    function addOpinion(text) {
        if(!currentUser.isLoggedIn) { alert("请先登录小组"); return false; }
        if(!text.trim()) { alert("观点不能为空"); return false; }
        const group = currentUser.group;
        if(!groupDiscussions[group]) groupDiscussions[group] = [];
        groupDiscussions[group].push({
            studentId: currentUser.studentId,
            text: text.trim(),
            timestamp: new Date().toISOString()
        });
        persistData();
        renderOpinions();
        renderMindmap();   // 每次发表后自动更新思维导图
        return true;
    }

    // 核心：生成 ECharts 树形图数据（真正的思维导图）
    function buildTreeData() {
        const group = currentUser.group;
        const opinions = groupDiscussions[group] || [];
        if(opinions.length === 0) {
            return {
                name: group,
                children: [{ name: "暂无讨论观点", value: "发表你的见解" }]
            };
        }
        // 根节点：小组主题
        let root = {
            name: group,
            children: [],
            itemStyle: { color: "#b8834b" }
        };
        // 为了避免孩子过多导致拥挤，使用 children 列表：每个成员的最新观点作为一个节点，但为了展现讨论精华，将每个成员一条或若干条合并?
        // 为了清晰，我们将每条观点作为一个叶子节点，按学生归组展示更符合讨论思维。
        // 更好方式：学生作为二级分支，观点作为三级。
        const studentMap = new Map(); // studentId -> { name: studentId, children: [] }
        opinions.forEach(op => {
            if(!studentMap.has(op.studentId)) {
                studentMap.set(op.studentId, { name: op.studentId, children: [] });
            }
            const studentNode = studentMap.get(op.studentId);
            // 每条观点独立展示，限定长度
            let shortText = op.text.length > 38 ? op.text.slice(0, 38) + "…" : op.text;
            studentNode.children.push({ name: shortText, value: op.text });
        });
        // 将学生节点转为数组
        root.children = Array.from(studentMap.values()).map(node => {
            return {
                name: node.name,
                children: node.children,
                itemStyle: { color: "#d9a066" }
            };
        });
        if(root.children.length === 0) {
            root.children = [{ name: "等待更多讨论" }];
        }
        return root;
    }

    // 渲染思维导图 (echarts 树图)
    function renderMindmap() {
        if(!currentUser.isLoggedIn) return;
        const dom = document.getElementById("mindmapChart");
        if(!dom) return;
        if(mindmapChart) {
            mindmapChart.dispose();
        }
        mindmapChart = echarts.init(dom);
        const treeData = buildTreeData();
        const option = {
            tooltip: {
                trigger: 'item',
                triggerOn: 'mousemove',
                formatter: function(params) {
                    if(params.data.value) return `<strong>${params.name}</strong><br/>${params.data.value}`;
                    return `<strong>${params.name}</strong>`;
                }
            },
            series: [{
                type: 'tree',
                data: [treeData],
                layout: 'orthogonal',
                orient: 'LR',
                symbol: 'circle',
                symbolSize: 16,
                edgeShape: 'curve',
                edgeLabel: { fontSize: 10 },
                initialTreeDepth: 2,
                roam: true,
                expandAndCollapse: true,
                label: {
                    position: 'left',
                    verticalAlign: 'middle',
                    align: 'right',
                    fontSize: 11,
                    fontWeight: 'normal',
                    color: '#4a2e1a',
                    offset: [5,0]
                },
                leaves: { label: { position: 'right', align: 'left', offset: [5,0] } },
                itemStyle: {
                    borderWidth: 1.5,
                    color: '#c28142'
                },
                lineStyle: { color: '#dbb282', width: 1.5, curveness: 0.5 }
            }]
        };
        // 根据浏览器宽度微调
        mindmapChart.setOption(option);
        mindmapChart.on('click', function(params) {
            if(params.data && params.data.value) {
                // 轻提示显示完整观点
                alert("💡 观点详情：\n" + params.data.value);
            }
        });
    }

    // 金点子生成器
    function generateGoldenIdea() {
        if(!currentUser.isLoggedIn) { alert("请先登录小组"); return; }
        const group = currentUser.group;
        const ideaMap = {
            "丝路历史人物": "💡 金点子：除了张骞、班超，马可波罗和伊本·白图泰在丝路上扮演什么角色？去查一下分享给组员。",
            "丝路美食传承": "🍇 金点子：讨论一下「胡饼」和现代馕的关联，或者葡萄酒的传入如何影响古代贵族饮食。",
            "陆上丝路地理": "🏔 金点子：天山、帕米尔高原如何影响路线选择？绘制简单路线图并描述气候变化对商队的影响。",
            "海上丝绸之路": "🌊 金点子：从广州、泉州出发，瓷器外销到东非，哪些沉船考古证实了海上丝路的繁荣？",
            "丝路历史": "📜 金点子：唐朝的开放政策对丝路贸易起到什么作用？不同宗教的传播路线如何交织？",
            "丝路与一带一路": "🤝 金点子：古代丝路精神与“一带一路”五通（政策沟通、设施联通等）有何关联？举一个实例。",
            "丝路艺术之音乐": "🎵 金点子：琵琶、筚篥、箜篌如何沿着丝路传入？找一首融合丝路元素的现代音乐作品推荐。",
            "丝路艺术之美术": "🎨 金点子：敦煌壁画中的「飞天」形象融合了哪些文化特色？或者讨论一下犍陀罗艺术。",
            "丝路建筑": "🏛 金点子：伊斯兰建筑风格如何影响喀什古城？对比长安城与撒马尔罕城市规划。",
            "丝路文学": "📖 金点子：以「丝路·驼铃」为题写两句诗，或者分享王维、岑参边塞诗中的西域意象。"
        };
        let idea = ideaMap[group] || "✨ 从贸易、科技、文化融合角度思考丝路影响，试着提出一个独特问题与同学讨论。";
        document.getElementById("newOpinion").value = idea;
        document.getElementById("newOpinion").focus();
    }

    // 提交数据到 quickform
    async function submitToTeacher() {
        if(!currentUser.isLoggedIn) { alert("请先登录后提交"); return; }
        const payload = {
            group: currentUser.group,
            studentId: currentUser.studentId,
            timestamp: new Date().toISOString(),
            all_discussions_json: JSON.stringify(groupDiscussions[currentUser.group] || []),
            action: "丝绸之路跨学科讨论提交"
        };
        try {
            const res = await fetch("https://qf.kjxs.site/api/sfCV84wNnBQ", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            alert("✅ 成功提交讨论数据至教师端！");
        } catch(err) {
            alert("网络问题，数据已本地保存，稍后可重试。");
        }
    }

    // 登录
    function login() {
        const group = document.getElementById("groupSelect").value;
        const studentId = document.getElementById("studentIdInput").value.trim();
        if(!studentId) { alert("请输入学号或昵称"); return; }
        currentUser = { group, studentId, isLoggedIn: true };
        document.getElementById("loginPanel").style.display = "none";
        document.getElementById("discussionContainer").style.display = "block";
        document.getElementById("currentGroupTopic").innerHTML = `<i class="fas fa-tent"></i> ${group}`;
        document.getElementById("groupMemberBadge").innerHTML = `<i class="fas fa-id-badge"></i> ${studentId} <button id="switchGroupBtn" class="switch-group-btn"><i class="fas fa-arrows-spin"></i> 切换小组</button>`;
        renderOpinions();
        renderMindmap();   // 初始渲染思维导图
        const switchBtn = document.getElementById("switchGroupBtn");
        if(switchBtn) switchBtn.onclick = () => { if(confirm("切换小组将返回登录页，所有讨论已保存")) location.reload(); };
    }

    // ---------- 写作模态框逻辑 ----------
    const modal = document.getElementById("writingModal");
    const markdownEditor = document.getElementById("markdownEditor");
    const previewDiv = document.getElementById("previewContent");
    function updatePreview() { if(marked) previewDiv.innerHTML = marked.parse(markdownEditor.value); }
    document.getElementById("openWriteModalBtn").onclick = () => {
        if(!currentUser.isLoggedIn){ alert("请先登录小组"); return; }
        markdownEditor.value = `# ${currentUser.group} · 丝路创作\n\n**作者：${currentUser.studentId}**\n\n## 探究总结\n- 通过小组讨论获得灵感...\n\n![丝绸之路](https://placehold.co/600x400/e9d5b0/6b4423?text=SilkRoad)`;
        updatePreview();
        modal.showModal();
    };
    document.getElementById("closeWritingModal").onclick = () => modal.close();
    document.getElementById("exportHtmlBtn").onclick = () => {
        const htmlContent = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>丝路作品</title><style>body{background:#faf0e1; padding:2rem;}</style></head><body>${marked.parse(markdownEditor.value)}</body></html>`;
        const blob = new Blob([htmlContent], {type:"text/html"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `silkroad_${currentUser.group}_创意.html`;
        a.click();
        URL.revokeObjectURL(a.href);
    };
    document.getElementById("copyHtmlBtn").onclick = () => {
        const rich = marked.parse(markdownEditor.value);
        navigator.clipboard.writeText(rich).then(()=>alert("HTML已复制，可粘贴到PPT或文档编辑"));
    };
    document.getElementById("saveDraftBtn").onclick = () => {
        localStorage.setItem("writing_draft_"+currentUser.studentId, markdownEditor.value);
        alert("草稿已保存本地");
    };
    markdownEditor.addEventListener("input", updatePreview);

    // 绑定其他事件
    document.getElementById("loginBtn").onclick = login;
    document.getElementById("submitOpinionBtn").onclick = () => {
        const txt = document.getElementById("newOpinion").value;
        if(addOpinion(txt)) document.getElementById("newOpinion").value = "";
    };
    document.getElementById("goldenIdeaBtn").onclick = generateGoldenIdea;
    document.getElementById("refreshMindmapBtn").onclick = () => { if(currentUser.isLoggedIn) renderMindmap(); else alert("未登录"); };
    document.getElementById("submitToServerBtn").onclick = submitToTeacher;

    // 初始化
    loadData();
    window.addEventListener("resize", () => { if(mindmapChart) mindmapChart.resize(); });
</script>
</body>
</html>
