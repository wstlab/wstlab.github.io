<style id="exam-progress-layer">
/* ============================================================
   答题进度层 · 学考模拟卷

    --e-bad:     #f56565;

    --e-pill:    40px;
}

/* 进度面板：吸顶，答题时始终可见 */
.exam-progress {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255, 255, 255, .96);
    backdrop-filter: blur(8px);
    border: 1px solid var(--e-line);

    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 9px;
}

.exam-progress .ep-num {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--e-ink-2);
    line-height: 1;
    font-variant-numeric: tabular-nums;
}

.exam-progress .ep-num .done { color: var(--e-ok); }

.exam-progress .ep-label {
    font-size: .92rem;
    font-weight: 600;
    color: var(--e-ink-3);
}

.exam-progress .ep-rest {
    margin-left: auto;
    font-size: .88rem;
    color: var(--e-ink-3);
    font-variant-numeric: tabular-nums;
}

.exam-progress .ep-track {
    height: 10px;
    border-radius: var(--e-pill);
    background: #e2edf7;
    overflow: hidden;
}

.exam-progress .ep-fill {
    height: 100%;
    width: 0;
    border-radius: var(--e-pill);
    background: linear-gradient(90deg, #63b3ed, var(--e-accent));
    transition: width .35s ease;
}

    display: grid;                            /* 用 grid 精确排布，避免 flex 把按钮拉伸/换行成色条 */
    grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
    gap: 6px;
    margin-top: 10px;
    max-height: 104px;
    overflow-y: auto;
}

.exam-progress .ep-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    max-width: 46px;
    height: 28px;

    border-radius: 9px;

}

@media (prefers-reduced-motion: reduce) {
    .question-card.locate { animation: none; }
    .exam-progress .ep-fill { transition: none; }
}
</style>

    // 批改试卷并显示解析

        for (let i = 1; i <= 30; i++) {

            const isCorrect = (userAnswer === correct);
            if (isCorrect) singleScore += 2;
            const card = document.querySelector(`.question-card[data-qtype="single"][data-qid="${i}"]`);

                card.classList.remove('correct', 'wrong');
                card.classList.add(isCorrect ? 'correct' : 'wrong');

                }
            }
        }
        const operScore = calculateOperationalScore();
        // 为操作题每个子题添加解析（显示参考答案）

            for (let sub=1; sub<=4; sub++) {
                const expDiv = document.querySelector(`.question-card[data-qid="${qid}"] .sub-question[data-sub="${sub}"] .sub-exp`);

                    expDiv.innerHTML = `<strong>📝 参考答案</strong><br>${getOperExplanation(`${qid}`, sub)}`;

            }

        return { totalScore, singleScore, operScore };
    }

    // 防重复提交标记的存储key

        return `exam_submitted_${classVal}_${nameVal}_${studentIdVal || ''}`;
    }

    // 检查是否已经提交过
    function isAlreadySubmitted(classVal, nameVal, studentIdVal) {
        const key = getSubmissionKey(classVal, nameVal, studentIdVal);
        return localStorage.getItem(key) === 'true';
    }

    // 标记已提交
    function markSubmitted(classVal, nameVal, studentIdVal) {
        const key = getSubmissionKey(classVal, nameVal, studentIdVal);
        localStorage.setItem(key, 'true');
    }

    async function submitExam() {
        const classVal = document.getElementById('classSelect').value;
        const nameVal = document.getElementById('studentName').value.trim();
        const studentIdVal = document.getElementById('studentId').value.trim();
        if (!classVal || !nameVal) {
            alert('请填写班级和姓名后再提交。');
            return;
        }
        // 检查是否已提交
        if (isAlreadySubmitted(classVal, nameVal, studentIdVal)) {
            alert('您已经提交过答卷，不可重复提交！');
            return;
        }

        const { totalScore, singleScore, operScore } = gradeExam();
        const payload = {
            class: classVal,
            name: nameVal,
            studentId: studentIdVal || "未填写",
            totalScore: totalScore,
            singleScore: singleScore,
            operScore: operScore,
            timestamp: new Date().toISOString(),
            answers: {}
        };
        const allInputs = document.querySelectorAll('input, select');
        allInputs.forEach(el => {
            if (el.type === 'radio' && !el.checked) return;
            if (el.type === 'radio' && el.checked) payload.answers[el.name] = el.value;
            else if (el.type !== 'radio' && el.value !== undefined && el.value !== '') payload.answers[el.name] = el.value;
        });
        const sortNumbers = document.querySelectorAll('input[type="number"]');
        sortNumbers.forEach(inp => { if(inp.name) payload.answers[inp.name] = inp.value; });
        
        try {
            await fetch('https://qf.kjxs.site/api/nI9Cv88JlAA', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            // 提交成功后标记
            markSubmitted(classVal, nameVal, studentIdVal);
            // 可选：禁用提交按钮
            document.getElementById('submitBtn').disabled = true;
            alert('提交成功！成绩已记录，不可再次提交。');
        } catch(e) {
            console.warn('提交失败', e);
            alert('提交失败，请稍后重试。');
        }
    }

    // 页面加载时，如果用户已经填写过信息且已提交，可禁用按钮（可选）
    function checkPreviousSubmission() {
        const classVal = document.getElementById('classSelect').value;
        const nameVal = document.getElementById('studentName').value.trim();
        const studentIdVal = document.getElementById('studentId').value.trim();
        if (classVal && nameVal && isAlreadySubmitted(classVal, nameVal, studentIdVal)) {
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('scoreDisplay').innerHTML = '⚠️ 您已经完成了本次考试，不可重复提交。';
            document.getElementById('scoreDisplay').classList.add('visible');
        }
    }

    document.getElementById('exam-root').innerHTML = buildFullExamHTML();

    // 监听信息改变时，重新检测提交状态（可选）
    const fields = ['classSelect', 'studentName', 'studentId'];
    fields.forEach(id => {
        document.getElementById(id).addEventListener('change', checkPreviousSubmission);
        document.getElementById(id).addEventListener('input', checkPreviousSubmission);
    });
    checkPreviousSubmission();

<script id="exam-progress-script">
/* 答题进度与题号导航：独立脚本，只读取 DOM，不触碰题库与判分逻辑 */
(function () {
  'use strict';

  function cards() {
    return Array.prototype.slice.call(document.querySelectorAll('.question-card'));
  }

  // 判断某题是否已作答
  function isAnswered(card) {
    var type = card.getAttribute('data-qtype');
    if (type === 'oper') {
      var subs = card.querySelectorAll('.sub-question');
      if (subs.length) {
        // 操作题含多个小问：每个小问都必须有作答
        for (var i = 0; i < subs.length; i++) {
          if (!subAnswered(subs[i])) return false;
        }
        return true;
      }
      return subAnswered(card);
    }
    // 单选：radio 有选中即可
    return !!card.querySelector('input[type=radio]:checked');
  }

  function subAnswered(scope) {
    var groups = {};
    var inputs = scope.querySelectorAll('input, select');
    for (var i = 0; i < inputs.length; i++) {
      var el = inputs[i];
      if (el.type === 'radio') {
        var n = el.name;
        if (!groups[n]) groups[n] = false;
        if (el.checked) groups[n] = true;
      } else if (el.type === 'number') {
        if (String(el.value).trim() !== '') return true;   // 排序题：填了任一顺序即计入
      } else if (el.tagName === 'SELECT') {
        if (String(el.value).trim() !== '') return true;   // 连线题：选了任一项即计入
      }
    }
    for (var k in groups) { if (!groups[k]) return false; }
    return Object.keys(groups).length > 0;
  }

  function build() {
    var list = cards();
    if (!list.length) return;

    var panel = document.createElement('div');
    panel.className = 'exam-progress';
    panel.id = 'examProgress';
    panel.setAttribute('role', 'progressbar');
    panel.setAttribute('aria-valuemin', '0');
    panel.setAttribute('aria-valuemax', '100');
    panel.innerHTML =
      '<div class="ep-head">' +
        '<span class="ep-num"><span class="done" id="epDone">0</span> / ' + list.length + '</span>' +
        '<span class="ep-label">已作答</span>' +
        '<span class="ep-rest" id="epRest"></span>' +
      '</div>' +
      '<div class="ep-track"><div class="ep-fill" id="epFill"></div></div>' +
      '<div class="ep-grid" id="epGrid"></div>';

    var anchor = document.getElementById('exam-root');
    anchor.parentNode.insertBefore(panel, anchor);

    // 题号导航
    var grid = panel.querySelector('#epGrid');
    list.forEach(function (card, idx) {
      var qid = card.getAttribute('data-qid') || (idx + 1);
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ep-chip' + (card.getAttribute('data-qtype') === 'oper' ? ' oper' : '');
      btn.textContent = qid;
      btn.title = '跳转到第 ' + qid + ' 题';
      btn.setAttribute('aria-label', '跳转到第 ' + qid + ' 题');
      btn.addEventListener('click', function () {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.remove('locate');
        void card.offsetWidth;           // 重启动画
        card.classList.add('locate');
        setTimeout(function () { card.classList.remove('locate'); }, 1600);
      });
      grid.appendChild(btn);
    });

    update();
  }

  function update() {
    var panel = document.getElementById('examProgress');
    if (!panel) return;
    var list = cards();
    var chips = panel.querySelectorAll('.ep-chip');
    var done = 0;

    list.forEach(function (card, idx) {
      var answered = isAnswered(card);
      if (answered) done++;
      if (chips[idx]) chips[idx].classList.toggle('answered', answered);
    });

    var total = list.length;
    var rest = total - done;
    var pct = total ? Math.round(done / total * 100) : 0;

    panel.querySelector('#epDone').textContent = done;
    panel.querySelector('#epRest').innerHTML = rest > 0
      ? '还有 <b>' + rest + '</b> 题未作答'
      : '✅ 已全部作答，可以提交';
    panel.querySelector('#epFill').style.width = pct + '%';
    panel.setAttribute('aria-valuenow', String(pct));
    panel.classList.toggle('all-done', rest === 0 && total > 0);
  }

  // 事件委托：任何输入变化都刷新进度
  document.addEventListener('change', function (e) {
    if (e.target && e.target.closest && e.target.closest('.question-card')) update();
  });
  document.addEventListener('input', function (e) {
    if (e.target && e.target.tagName === 'INPUT' && e.target.type === 'number') update();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', build);
  } else {
    build();
  }
})();
</script>
</body>
</html>
