    shortNameMap.set("西藏自治区", ["藏"]); shortNameMap.set("陕西省", ["陕", "秦"]); shortNameMap.set("甘肃省", ["甘", "陇"]);
    shortNameMap.set("青海省", ["青"]); shortNameMap.set("宁夏回族自治区", ["宁"]); shortNameMap.set("新疆维吾尔自治区", ["新"]);
    shortNameMap.set("香港特别行政区", ["港"]); shortNameMap.set("澳门特别行政区", ["澳"]); shortNameMap.set("台湾省", ["台"]);
    shortNameMap.set("内蒙古自治区", ["内蒙古"]);
    
    // 行政中心映射
    const capitalMap = new Map();
    capitalMap.set("北京市","北京"); capitalMap.set("天津市","天津"); capitalMap.set("上海市","上海");
    capitalMap.set("重庆市","重庆"); capitalMap.set("河北省","石家庄"); capitalMap.set("山西省","太原");
    capitalMap.set("辽宁省","沈阳"); capitalMap.set("吉林省","长春"); capitalMap.set("黑龙江省","哈尔滨");
    capitalMap.set("江苏省","南京"); capitalMap.set("浙江省","杭州"); capitalMap.set("安徽省","合肥");
    capitalMap.set("福建省","福州"); capitalMap.set("江西省","南昌"); capitalMap.set("山东省","济南");
    capitalMap.set("河南省","郑州"); capitalMap.set("湖北省","武汉"); capitalMap.set("湖南省","长沙");
    capitalMap.set("广东省","广州"); capitalMap.set("广西壮族自治区","南宁"); capitalMap.set("海南省","海口");
    capitalMap.set("四川省","成都"); capitalMap.set("贵州省","贵阳"); capitalMap.set("云南省","昆明");
    capitalMap.set("西藏自治区","拉萨"); capitalMap.set("陕西省","西安"); capitalMap.set("甘肃省","兰州");
    capitalMap.set("青海省","西宁"); capitalMap.set("宁夏回族自治区","银川"); capitalMap.set("新疆维吾尔自治区","乌鲁木齐");
    capitalMap.set("香港特别行政区","香港"); capitalMap.set("澳门特别行政区","澳门"); capitalMap.set("台湾省","台北");
    capitalMap.set("内蒙古自治区","呼和浩特");
    
    // ---------- 语音朗读函数 ----------
    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
    }
    
    // 朗读当前任务（不暴露省份名称）
    function speakCurrentTask() {
        if (!currentTask) return;
        if (currentTask.type === 'short') {
            // 提示：请找出简称是“XX”的省份
            speakText(`请找出简称是${currentTask.displayText}的省份`);
        } else {
            // 提示：请找出行政中心是“XX”的省份
            speakText(`请找出行政中心是${currentTask.displayText}的省份`);
        }
    }
    
    // 全局变量
    let myChart = null;
    let currentGameActive = false;
    let currentRound = 0;
    let currentScore = 0;
    let roundTimeout = null;
    let roundRemainingSec = 10;
    let currentTask = null;
    let allCapitalButtons = [];
    let allShortButtons = [];
    let playerName = "";
    let failureRecords = [];
    let gameStartTimestamp = 0;
    let _roundInterval = null;
    
    // UI 元素
    const scoreSpan = document.getElementById('scoreValue');
    const roundNumSpan = document.getElementById('roundNum');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    
    function updateUI() {
        scoreSpan.innerText = currentScore;
        roundNumSpan.innerText = currentRound;
    }
    
    function showMessage(msg, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.innerText = msg;
        toast.style.borderLeftColor = isError ? '#ff7777' : '#88ff88';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 1500);
    }
    
    function clearHighlight() {
        allCapitalButtons.forEach(item => item.dom.classList.remove('btn-highlight'));
        allShortButtons.forEach(item => item.dom.classList.remove('btn-highlight'));
    }
    
    function stopRoundTimer() {
        if (_roundInterval) { clearInterval(_roundInterval); _roundInterval = null; }
        if (roundTimeout) { clearTimeout(roundTimeout); roundTimeout = null; }
    }
    
    function updateTimerDisplay(sec) {
        timerDisplaySpan.innerText = sec.toFixed(1) + "s";
    }
    
    // 游戏结束，展示得分面板 + 提交数据 + 继续挑战按钮
    function endGame(showOverlay = true) {
        if (!currentGameActive) return;
        currentGameActive = false;
        stopRoundTimer();
        clearHighlight();
        const totalTimeSec = Math.floor((Date.now() - gameStartTimestamp) / 1000);
        
        // 提交数据
        const payload = {
            playerName: playerName,
            score: currentScore,
            totalRounds: 10,
            totalTimeSeconds: totalTimeSec,
            failureRecords: failureRecords,
            completedAt: new Date().toISOString()
        };
        fetch("https://qf.kjxs.site/api/wTAt7YpJ3NB", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).then(res => res.json()).then(data => {
            console.log("提交成功", data);
            showMessage("📊 成绩已提交！", false);
        }).catch(err => {
            console.error("提交失败", err);
            showMessage("⚠️ 网络问题，成绩提交失败", true);
        });
        
        if (showOverlay) {
            showGameOverPanel();
        }
    }
    
    // 显示游戏结束面板（得分 + 继续挑战）
    function showGameOverPanel() {
        const overlay = document.createElement('div');
        overlay.className = 'gameover-overlay';
        overlay.innerHTML = `
            <div class="gameover-card">
                <h2>🎉 挑战完成 🎉</h2>
                <div style="font-size:20px;">你的得分</div>
                <div class="score-big">${currentScore} / 100</div>
                <button id="restartGameBtn">🔄 继续挑战</button>
                <button id="closeOverlayBtn">✖ 关闭</button>
            </div>
        `;
        document.body.appendChild(overlay);
        const restartBtn = overlay.querySelector('#restartGameBtn');
        const closeBtn = overlay.querySelector('#closeOverlayBtn');
        restartBtn.addEventListener('click', () => {
            overlay.remove();
            resetAndRestartGame();
        });
        closeBtn.addEventListener('click', () => {
            overlay.remove();
        });
    }
    
    // 重置并重新开始游戏（保留玩家姓名，重置所有状态）
    function resetAndRestartGame() {
        // 重置全局变量
        currentScore = 0;
        currentRound = 0;
        failureRecords = [];
        currentGameActive = false;
        if (_roundInterval) clearInterval(_roundInterval);
        if (roundTimeout) clearTimeout(roundTimeout);
        clearHighlight();
        updateUI();
        // 启用开始按钮
        const startBtn = document.getElementById('gameStartBtn');
        startBtn.disabled = false;
        startBtn.innerText = "▶ 开始游戏";
        timerDisplaySpan.innerText = "10.0s";
        // 不清除按钮顺序，但重新开始后新一轮会重新随机出题，按钮列表不变
        // 重新开始需要用户再次点击开始
        showMessage("✨ 点击「开始游戏」继续挑战", false);
    }
    
    // 进入下一轮
    function nextRoundAfterDelay() {
        if (!currentGameActive) return;
        stopRoundTimer();
        setTimeout(() => {
            if (currentGameActive && currentRound <= 10) {
                currentRound++;
                if (currentRound > 10) {
                    endGame(true);
                } else {
                    updateUI();
                    startNewRound();
                }
            }
        }, 800);
    }
    
    // 开始新回合
    function startNewRound() {
        if (!currentGameActive || currentRound > 10) return;
        clearHighlight();
        stopRoundTimer();
        
        // 随机选题
        const type = Math.random() < 0.5 ? 'short' : 'capital';
        let buttonPool = (type === 'short') ? allShortButtons : allCapitalButtons;
        if (buttonPool.length === 0) return;
        const randomIndex = Math.floor(Math.random() * buttonPool.length);
        const selected = buttonPool[randomIndex];
        const province = selected.provinceName;
        const display = selected.displayText;
        
        currentTask = { type, provinceName: province, buttonDom: selected.dom, displayText: display };
        selected.dom.classList.add('btn-highlight');
        
        // 语音朗读当前任务（不暴露省份名称）
        speakCurrentTask();
        
        roundRemainingSec = 10;
        updateTimerDisplay(roundRemainingSec);
        
        // 倒计时
        _roundInterval = setInterval(() => {
            if (!currentGameActive || currentRound > 10) {
                clearInterval(_roundInterval);
                return;
            }
            if (roundRemainingSec <= 0.1) {
                clearInterval(_roundInterval);
                if (currentGameActive && currentRound <= 10) {
                    showMessage(`⏰ 超时！正确答案是 ${currentTask.type === 'short' ? '简称' : '行政中心'} “${currentTask.displayText}” (${currentTask.provinceName})`, true);
                    failureRecords.push({ round: currentRound, type: currentTask.type, province: currentTask.provinceName, wrongChoice: "超时未选" });
                    nextRoundAfterDelay();
                }
            } else {
                roundRemainingSec -= 0.1;
                updateTimerDisplay(roundRemainingSec);
            }
        }, 100);
    }
    
    // 地图点击匹配
    function onMapClick(clickedProvince) {
        if (!currentGameActive || currentRound > 10 || !currentTask) {
            if (!currentGameActive) showMessage("游戏未开始，点击「开始游戏」", true);
            return;
        }
        const isMatch = (clickedProvince === currentTask.provinceName);
        if (isMatch) {
            currentScore += 5;
            updateUI();
            showMessage(`✅ 正确！ +5分 (${currentTask.provinceName} 的${currentTask.type === 'short' ? '简称' : '行政中心'}是 ${currentTask.displayText})`, false);
            // 正确时停止倒计时并进入下一轮
            if (_roundInterval) clearInterval(_roundInterval);
            stopRoundTimer();
            nextRoundAfterDelay();
        } else {
            showMessage(`❌ 错误！点击了 ${clickedProvince}，正确答案是 ${currentTask.provinceName}`, true);
            failureRecords.push({ round: currentRound, type: currentTask.type, province: currentTask.provinceName, wrongChoice: clickedProvince });
            // 错误后也立即进入下一轮（一次机会）
            if (_roundInterval) clearInterval(_roundInterval);
            stopRoundTimer();
            nextRoundAfterDelay();
        }
    }
    
    // 开始游戏主控
    function startGame() {
        if (currentGameActive) return;
        // 重置数据
        currentScore = 0;
        currentRound = 1;
        failureRecords = [];
        currentGameActive = true;
        updateUI();
        const startBtn = document.getElementById('gameStartBtn');
        startBtn.disabled = true;
        startBtn.innerText = "游戏中...";
        gameStartTimestamp = Date.now();
        if (_roundInterval) clearInterval(_roundInterval);
        stopRoundTimer();
        clearHighlight();
        startNewRound();
    }
    
    // 构建随机顺序按钮
    function buildRandomButtons() {
        const capitalsList = [];
        for (let prov of PROVINCES_STANDARD) {
            const cap = capitalMap.get(prov);
            if (cap) capitalsList.push({ provinceName: prov, displayText: cap });
        }
        const shortList = [];
        for (let prov of PROVINCES_STANDARD) {
            let shortArray = shortNameMap.get(prov);
            let display = (prov === "内蒙古自治区") ? "内蒙古" : (shortArray && shortArray[0] ? shortArray[0] : "");
            if (display) shortList.push({ provinceName: prov, displayText: display });
        }
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        const shuffledCap = shuffle(capitalsList);
        const shuffledShort = shuffle(shortList);
        
        const capitalDiv = document.getElementById('capital-buttons');
        const shortDiv = document.getElementById('short-buttons');
        capitalDiv.innerHTML = '';
        shortDiv.innerHTML = '';
        allCapitalButtons = [];
        allShortButtons = [];
        
        shuffledCap.forEach(item => {
            const btn = document.createElement('button');
            btn.innerText = item.displayText;
            btn.className = 'btn-capital';
            btn.style.cursor = 'default';
            capitalDiv.appendChild(btn);
            allCapitalButtons.push({ dom: btn, provinceName: item.provinceName, displayText: item.displayText });
        });
        shuffledShort.forEach(item => {
            const btn = document.createElement('button');
            btn.innerText = item.displayText;
            btn.className = 'btn-short';
            btn.style.cursor = 'default';
            shortDiv.appendChild(btn);
            allShortButtons.push({ dom: btn, provinceName: item.provinceName, displayText: item.displayText });
        });
    }
    
    // 初始化地图
    async function initMap() {
        const geoJsonUrl = 'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json';
        try {
            const resp = await fetch(geoJsonUrl);
            const data = await resp.json();
            let features = data.features.filter(f => f.properties.level === 'province');
            const chinaGeo = { type: "FeatureCollection", features: features };
            echarts.registerMap('china', chinaGeo);
            const chartDom = document.getElementById('mapChart');
            myChart = echarts.init(chartDom);
            myChart.setOption({
                tooltip: { trigger: 'item', formatter: '{b}' },
                series: [{
                    type: 'map', map: 'china', roam: true, zoom: 1.2,
                    label: { show: true, fontSize: 10, color: '#111', fontWeight: 'bold' },
                    itemStyle: { borderColor: '#2c3e4e', borderWidth: 1, areaColor: '#b0c4de' },
                    emphasis: { label: { show: true, color: '#ffaa33' }, itemStyle: { areaColor: '#ffaa66' } }
                }]
            });
            myChart.on('click', (params) => {
                if (params.componentType === 'series' && params.name) {
                    let name = params.name;
                    let matched = PROVINCES_STANDARD.find(p => p === name);
                    if (!matched) {
                        if (name === "广西") matched = "广西壮族自治区";
                        else if (name === "宁夏") matched = "宁夏回族自治区";
                        else if (name === "新疆") matched = "新疆维吾尔自治区";
                        else if (name === "内蒙古") matched = "内蒙古自治区";
                        else matched = PROVINCES_STANDARD.find(p => p.includes(name) || name.includes(p));
                    }
                    if (matched) onMapClick(matched);
                    else showMessage("请点击标准省份区域", true);
                }
            });
        } catch(e) { console.error(e); showMessage("地图加载失败", true); }
    }
    
    // Three.js 背景
    function initThree() {
        const container = document.getElementById('three-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x051a2a);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 12);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        const starsGeo = new THREE.BufferGeometry();
        const starsPos = [];
        for (let i = 0; i < 1200; i++) {
            starsPos.push((Math.random() - 0.5) * 200);
            starsPos.push((Math.random() - 0.5) * 120);
            starsPos.push((Math.random() - 0.5) * 80 - 40);
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starsPos), 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2 });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);
        const ringGeo = new THREE.TorusGeometry(3.5, 0.05, 64, 300);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0x442200 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        scene.add(ring);
        const light = new THREE.AmbientLight(0x333333);
        scene.add(light);
        const pointLight = new THREE.PointLight(0xffaa66, 0.6);
        pointLight.position.set(3,5,5);
        scene.add(pointLight);
        function animate() {
            requestAnimationFrame(animate);
            ring.rotation.z += 0.005;
            ring.rotation.x += 0.003;
            stars.rotation.y += 0.0005;
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }
    
    // 登录
    function setupLogin() {
        const startBtn = document.getElementById('startGameBtn');
        const nameInput = document.getElementById('usernameInput');
        const overlay = document.getElementById('loginOverlay');
        const gameContainer = document.getElementById('gameContainer');
        startBtn.addEventListener('click', () => {
            const name = nameInput.value.trim();
            if (!name) { document.getElementById('nameError').innerText = "请输入名字"; return; }
            playerName = name;
            overlay.style.display = 'none';
            gameContainer.style.display = 'flex';
            buildRandomButtons();
            initMap();
            initThree();
            const gameStart = document.getElementById('gameStartBtn');
            gameStart.onclick = () => { if (!currentGameActive) startGame(); };
        });
        nameInput.addEventListener('keypress', e => { if (e.key === 'Enter') startBtn.click(); });
    }
    
    setupLogin();
</script>
