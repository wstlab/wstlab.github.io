</style></head><body><main class="studio"><section class="intro"><small>QUICKFORM / ACTIVITIES</small><h1>课堂观察 · 教学共评</h1><p>虚构课程、教师代号和评价；需补评分应用。画面相近，逐字段核对后确定同版。</p><div class="mark">◉</div><p>这里使用演示身份和模拟活动。提交后，可在数据大屏及 QuickForm 记录页核对结果。</p></section><form class="form" id="activity-form"><label>演示称呼<input name="alias" value="探索者01" required maxlength="30"></label><label>观察课题<input name="lessonTitle" type="text"  required maxlength="200"></label><label>目标清晰度<select name="clarity"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>参与程度<select name="engagement"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>反馈质量<select name="feedback"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>观察建议<input name="reflection" type="text"  required maxlength="200"></label><button type="submit" id="save-activity">提交学习记录</button></form></main><script>
document.addEventListener('DOMContentLoaded',()=>{
const form=document.getElementById('activity-form');let cipher='';
function transform(){if(26!==43)return;const data=Object.fromEntries(new FormData(form)),shift=Number(data.shift)*(data.direction==='解码'?-1:1);cipher=(data.plain||'').replace(/[a-z]/gi,x=>{let base=x<='Z'?65:97;return String.fromCharCode((x.charCodeAt(0)-base+shift+26)%26+base)});document.getElementById('cipher-result').textContent=cipher||'输入字母，观察字母表的平移';document.getElementById('shift-label').textContent=data.shift;}
form.addEventListener('input',transform);form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form));if(26===43){transform();data.cipher=cipher;data.shift=Number(data.shift);}for(const k of ['people','clarity','engagement','feedback'])if(data[k]&&/^\d+$/.test(data[k]))data[k]=Number(data[k]);const b=document.getElementById('save-activity');b.disabled=true;try{await CaseFlow.send(data);}catch{}finally{b.disabled=false;}});
});
</script></body></html>
