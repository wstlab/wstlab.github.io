    <script>
        // 前20号元素数据
        const elements = [
            { symbol: 'H', name: '氢', number: 1 },
            { symbol: 'He', name: '氦', number: 2 },
            { symbol: 'Li', name: '锂', number: 3 },
            { symbol: 'Be', name: '铍', number: 4 },
            { symbol: 'B', name: '硼', number: 5 },
            { symbol: 'C', name: '碳', number: 6 },
            { symbol: 'N', name: '氮', number: 7 },
            { symbol: 'O', name: '氧', number: 8 },
            { symbol: 'F', name: '氟', number: 9 },
            { symbol: 'Ne', name: '氖', number: 10 },
            { symbol: 'Na', name: '钠', number: 11 },
            { symbol: 'Mg', name: '镁', number: 12 },
            { symbol: 'Al', name: '铝', number: 13 },
            { symbol: 'Si', name: '硅', number: 14 },
            { symbol: 'P', name: '磷', number: 15 },
            { symbol: 'S', name: '硫', number: 16 },
            { symbol: 'Cl', name: '氯', number: 17 },
            { symbol: 'Ar', name: '氩', number: 18 },
            { symbol: 'K', name: '钾', number: 19 },
            { symbol: 'Ca', name: '钙', number: 20 }
        ];
        
        // 游戏状态
        let gameState = {
            score: 0,
            combo: 0,
            matched: 0,
            selectedTiles: [],
            tiles: [],
            hintsRemaining: 3,
            isProcessing: false
        };
        
        // 初始化游戏
        window.captureLesson=()=>({score:gameState.score,matches:gameState.matched,hintsRemaining:gameState.hintsRemaining});
function initGame() {
            gameState = {
                score: 0,
                combo: 0,
                matched: 0,
                selectedTiles: [],
                tiles: [],
                hintsRemaining: 3,
                isProcessing: false
            };
            
            createGameTiles();
            updateUI();
            
            // 入场动画
            anime({
                targets: '.element-tile',
                scale: [0, 1],
                opacity: [0, 1],
                duration: 800,
                delay: anime.stagger(50),
                easing: 'easeOutElastic(1, .8)'
            });
        }
        
        // 创建游戏方块
        function createGameTiles() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            
            // 创建所有元素的名称和符号方块
            const allTiles = [];
            elements.forEach(element => {
                allTiles.push({
                    id: `symbol-${element.number}`,
                    content: element.symbol,
                    type: 'symbol',
                    elementNumber: element.number,
                    matched: false
                });
                allTiles.push({
                    id: `name-${element.number}`,
                    content: element.name,
                    type: 'name',
                    elementNumber: element.number,
                    matched: false
                });
            });
            
            // 打乱顺序
            gameState.tiles = shuffleArray(allTiles);
            
            // 创建DOM元素
            gameState.tiles.forEach((tile, index) => {
                const tileElement = document.createElement('div');
                tileElement.className = 'element-tile rounded-xl p-4 text-center font-bold text-lg min-h-[80px] flex items-center justify-center';
                tileElement.textContent = tile.content;
                tileElement.dataset.id = tile.id;
                tileElement.dataset.index = index;
                tileElement.addEventListener('click', () => handleTileClick(index));
                gameBoard.appendChild(tileElement);
            });
        }
        
        // 处理方块点击
        function handleTileClick(index) {
            if (gameState.isProcessing) return;
            
            const tile = gameState.tiles[index];
            if (tile.matched) return;
            
            const tileElement = document.querySelector(`[data-index="${index}"]`);
            
            // 如果已经选中，取消选中
            if (gameState.selectedTiles.includes(index)) {
                gameState.selectedTiles = gameState.selectedTiles.filter(i => i !== index);
                tileElement.classList.remove('selected');
                return;
            }
            
            // 如果已经选中了2个，先清除选择
            if (gameState.selectedTiles.length >= 2) {
                clearSelection();
            }
            
            // 选中当前方块
            gameState.selectedTiles.push(index);
            tileElement.classList.add('selected');
            
            // 如果选中了2个方块，检查匹配
            if (gameState.selectedTiles.length === 2) {
                setTimeout(() => checkMatch(), 300);
            }
        }
        
        // 检查匹配
        function checkMatch() {
            gameState.isProcessing = true;
            
            const [index1, index2] = gameState.selectedTiles;
            const tile1 = gameState.tiles[index1];
            const tile2 = gameState.tiles[index2];
            
            const element1 = document.querySelector(`[data-index="${index1}"]`);
            const element2 = document.querySelector(`[data-index="${index2}"]`);
            
            // 检查是否匹配（同一个元素的名称和符号）
            const isMatch = tile1.elementNumber === tile2.elementNumber && 
                           tile1.type !== tile2.type;
            
            if (isMatch) {
                // 匹配成功
                tile1.matched = true;
                tile2.matched = true;
                
                element1.classList.remove('selected');
                element2.classList.remove('selected');
                element1.classList.add('matched');
                element2.classList.add('matched');
                
                // 更新分数和连击
                gameState.combo++;
                const points = 100 + (gameState.combo - 1) * 20;
                gameState.score += points;
                gameState.matched++;
                
                // 显示得分动画
                showFloatingScore(points, element1);
                
                // 成功音效（用动画代替）
                anime({
                    targets: [element1, element2],
                    scale: [1, 1.2, 1],
                    duration: 600,
                    easing: 'easeOutElastic(1, .8)'
                });
                
                // 检查游戏是否完成
                if (gameState.matched === elements.length) {
                    setTimeout(() => {
                        showVictory();
                    }, 1000);
                }
                
            } else {
                // 匹配失败
                gameState.combo = 0;
                
                element1.classList.remove('selected');
                element2.classList.remove('selected');
                element1.classList.add('wrong');
                element2.classList.add('wrong');
                
                // 错误动画
                anime({
                    targets: [element1, element2],
                    translateX: [-10, 10, -5, 5, 0],
                    duration: 500,
                    easing: 'easeOutQuad'
                });
                
                setTimeout(() => {
                    element1.classList.remove('wrong');
                    element2.classList.remove('wrong');
                }, 500);
            }
            
            gameState.selectedTiles = [];
            updateUI();
            
            setTimeout(() => {
                gameState.isProcessing = false;
            }, 600);
        }
        
        // 清除选择
        function clearSelection() {
            gameState.selectedTiles.forEach(index => {
                const element = document.querySelector(`[data-index="${index}"]`);
                element.classList.remove('selected');
            });
            gameState.selectedTiles = [];
        }
        
        // 显示浮动分数
        function showFloatingScore(points, element) {
            const rect = element.getBoundingClientRect();
            const floatingScore = document.createElement('div');
            floatingScore.className = 'floating-score';
            floatingScore.textContent = `+${points}`;
            floatingScore.style.left = rect.left + rect.width / 2 + 'px';
            floatingScore.style.top = rect.top + 'px';
            document.body.appendChild(floatingScore);
            
            anime({
                targets: floatingScore,
                translateY: -50,
                opacity: [1, 0],
                duration: 1500,
                easing: 'easeOutQuad',
                complete: () => {
                    document.body.removeChild(floatingScore);
                }
            });
        }
        
        // 显示胜利
        function showVictory() {
            const message = document.createElement('div');
            message.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
            message.innerHTML = `
                <div class="bg-white rounded-3xl p-12 text-center shadow-2xl max-w-md mx-4">
                    <div class="text-6xl mb-4">🎉</div>
                    <h2 class="text-3xl font-bold text-gray-800 mb-4">恭喜完成！</h2>
                    <p class="text-lg text-gray-600 mb-6">你已经掌握了前20号元素！</p>
                    <div class="text-2xl font-bold text-primary mb-6">最终得分: ${gameState.score}</div>
                    <button onclick="this.parentElement.parentElement.remove(); initGame();" 
                            class="btn-primary text-white px-8 py-3 rounded-full font-semibold text-lg shadow-lg">
                        再玩一次
                    </button>
                </div>
            `;
            document.body.appendChild(message);
            
            // 胜利动画
            anime({
                targets: message.querySelector('div'),
                scale: [0, 1],
                duration: 800,
                easing: 'easeOutElastic(1, .8)'
            });
        }
        
        // 提示功能
        function showHint() {
            if (gameState.hintsRemaining <= 0) return;
            
            // 找到一对未匹配的元素
            const unmatchedTiles = gameState.tiles
                .map((tile, index) => ({ ...tile, index }))
                .filter(tile => !tile.matched);
            
            if (unmatchedTiles.length < 2) return;
            
            // 找到第一个符号方块
            const symbolTile = unmatchedTiles.find(tile => tile.type === 'symbol');
            if (!symbolTile) return;
            
            // 找到对应的名称方块
            const nameTile = unmatchedTiles.find(tile => 
                tile.type === 'name' && tile.elementNumber === symbolTile.elementNumber
            );
            if (!nameTile) return;
            
            // 高亮显示这一对
            const symbolElement = document.querySelector(`[data-index="${symbolTile.index}"]`);
            const nameElement = document.querySelector(`[data-index="${nameTile.index}"]`);
            
            symbolElement.style.border = '3px solid #f59e0b';
            nameElement.style.border = '3px solid #f59e0b';
            
            // 闪烁动画
            anime({
                targets: [symbolElement, nameElement],
                opacity: [1, 0.5, 1],
                duration: 1000,
                loop: 2,
                complete: () => {
                    symbolElement.style.border = '';
                    nameElement.style.border = '';
                }
            });
            
            gameState.hintsRemaining--;
            updateUI();
        }
        
        // 更新UI
        function updateUI() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('combo').textContent = gameState.combo;
            document.getElementById('remaining').textContent = elements.length - gameState.matched;
            document.getElementById('hintCount').textContent = gameState.hintsRemaining;
            
            const progress = (gameState.matched / elements.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }
        
        // 打乱数组
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }
        
        // 事件监听
        document.getElementById('newGameBtn').addEventListener('click', initGame);
        document.getElementById('hintBtn').addEventListener('click', showHint);
        
        // 初始化游戏
        initGame();

        // 二维码功能
        const shareBtn = document.getElementById('shareBtn');
        
        // 创建模态框
        const qrModal = document.createElement('div');
        qrModal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden';
        qrModal.innerHTML = `
            <div class="bg-white rounded-3xl p-8 text-center shadow-2xl max-w-sm mx-4 relative">
                <button id="closeQrBtn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                <h3 class="text-2xl font-bold text-gray-800 mb-2">扫码在平板上玩</h3>
                <p class="text-sm text-gray-500 mb-6">请确保设备在同一网络环境下</p>
                <div id="qrcode" class="flex justify-center mb-6"></div>
                <p class="text-xs text-gray-400">生成的二维码指向当前页面地址</p>
            </div>
        `;
        document.body.appendChild(qrModal);

        const closeQrBtn = qrModal.querySelector('#closeQrBtn');
        const qrcodeContainer = qrModal.querySelector('#qrcode');
        let qrcodeObj = null;

        shareBtn.addEventListener('click', () => {
            qrModal.classList.remove('hidden');
            qrModal.classList.add('flex');
            
            // 清除旧的二维码
            qrcodeContainer.innerHTML = '';
            
            // 生成新二维码
            // 获取当前URL，如果是file协议，提示用户
            const currentUrl = window.location.href;
            
            if (currentUrl.startsWith('file://')) {
                qrcodeContainer.innerHTML = '<div class="text-red-500 p-4 bg-red-50 rounded-lg text-sm">注意：当前是本地文件模式(file://)<br>请将此HTML文件部署到服务器<br>或使用VS Code Live Server插件打开<br>才能在其他设备访问</div>';
            } else {
                qrcodeObj = new QRCode(qrcodeContainer, {
                    text: currentUrl,
                    width: 200,
                    height: 200,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            }
            
            // 动画
            anime({
                targets: qrModal.querySelector('div'),
                scale: [0.9, 1],
                opacity: [0, 1],
                duration: 300,
                easing: 'easeOutQuad'
            });
        });

        function closeQrModal() {
            anime({
                targets: qrModal.querySelector('div'),
                scale: 0.9,
                opacity: 0,
                duration: 200,
                easing: 'easeInQuad',
                complete: () => {
                    qrModal.classList.add('hidden');
                    qrModal.classList.remove('flex');
                }
            });
        }

        closeQrBtn.addEventListener('click', closeQrModal);
        qrModal.addEventListener('click', (e) => {
            if (e.target === qrModal) closeQrModal();
        });

    </script>
