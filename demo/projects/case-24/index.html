</style></head><body><main class="studio"><section class="intro"><small>QUICKFORM / ACTIVITIES</small><h1>影像作品 · 模拟共评</h1><p>匿名作品A/B/C替代真实学生与作品；保留选择上限、投票与统计。</p><div class="mark">▶</div><p>这里使用演示身份和模拟活动。提交后，可在数据大屏及 QuickForm 记录页核对结果。</p></section><form class="form" id="activity-form"><label>演示称呼<input name="alias" value="探索者01" required maxlength="30"></label><label>演示作品<select name="work"><option>作品01 · 校园光影</option><option>作品02 · 自然之声</option><option>作品03 · 城市节奏</option><option>作品04 · 科学瞬间</option></select></label><label>评价<select name="rating"><option>5 · 表达清晰</option><option>4 · 有创意</option><option>3 · 可继续完善</option></select></label><label>推荐理由<input name="reason" type="text"  required maxlength="200"></label><button type="submit" id="save-activity">提交学习记录</button></form></main><script>
document.addEventListener('DOMContentLoaded',()=>{
const form=document.getElementById('activity-form');let cipher='';
function transform(){if(24!==43)return;const data=Object.fromEntries(new FormData(form)),shift=Number(data.shift)*(data.direction==='解码'?-1:1);cipher=(data.plain||'').replace(/[a-z]/gi,x=>{let base=x<='Z'?65:97;return String.fromCharCode((x.charCodeAt(0)-base+shift+26)%26+base)});document.getElementById('cipher-result').textContent=cipher||'输入字母，观察字母表的平移';document.getElementById('shift-label').textContent=data.shift;}
form.addEventListener('input',transform);form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form));if(24===43){transform();data.cipher=cipher;data.shift=Number(data.shift);}for(const k of ['people','clarity','engagement','feedback'])if(data[k]&&/^\d+$/.test(data[k]))data[k]=Number(data[k]);const b=document.getElementById('save-activity');b.disabled=true;try{await CaseFlow.send(data);}catch{}finally{b.disabled=false;}});
});
</script></body></html>
