<script>
    (function(){
        // ---------- 生成随机题目，元素个数 7~12 ----------
        function generateRandomArray() {
            const count = Math.floor(Math.random() * 6) + 7; // 7-12
            const numbers = new Set();
            while (numbers.size < count) {
                numbers.add(Math.floor(Math.random() * 100) + 1);
            }
            return Array.from(numbers).sort((a, b) => a - b);
        }

        // 存储题目序列及策略
        let questionSequence = [];          
        let roundStrategy = [];              

        // 游戏状态
        let gameActive = false;
        let timerInterval = null;
        let timeLeft = 180;               
        const MAX_TIME = 180;

        let submittedRounds = [];           
        let roundCorrect = [];               

        let currentRound = 0;                

        // 当前题目数据
        let sortedArray = [];  
        let answerSteps = [];
        let answerTreeRoot = null;
        let manualRoot = null;
        let placedElements = new Set();

        // 数据上报URL
        const SUBMIT_URL = 'https://qf.kjxs.site/api/AqfQw6d79EG';

        // DOM
        const classInput = document.getElementById('classInput');
        const nameInput = document.getElementById('nameInput');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const startGameBtn = document.getElementById('startGameBtn');
        const newRoundBtn = document.getElementById('newRoundBtn');
        const submitRoundBtn = document.getElementById('submitRoundBtn');
        const elementPool = document.getElementById('elementPool');
        const manualTreeSvg = document.getElementById('manualTreeSvg');
        const autoTreeSvg = document.getElementById('autoTreeSvg');
        const historyMessage = document.getElementById('historyMessage');
        const submittedCountSpan = document.getElementById('submittedCount');
        const correctCountSpan = document.getElementById('correctCount');
        const wrongCountSpan = document.getElementById('wrongCount');
        const finalGradeMessage = document.getElementById('finalGradeMessage');
        const sendStatus = document.getElementById('sendStatus');
        
        // 策略标签
        const manualStrategyTag = document.getElementById('manualStrategyTag');

        // 生成随机策略 (每次调用保证随机)
        function randomStrategy() {
            return Math.random() < 0.5 ? 'left' : 'right';
        }

        // 初始化第一题
        function resetGameSequences() {
            const firstArr = generateRandomArray();
            questionSequence = [firstArr];
            roundStrategy = [randomStrategy()];   // 每次开始都随机
            submittedRounds = [false];
            roundCorrect = [false];
            currentRound = 0;
        }

        // 确保下一题存在 (动态生成，策略随机)
        function ensureNextRoundExists() {
            if (currentRound + 1 >= questionSequence.length) {
                const newArr = generateRandomArray();
                questionSequence.push(newArr);
                roundStrategy.push(randomStrategy());  // 新题生成新随机策略
                submittedRounds.push(false);
                roundCorrect.push(false);
            }
        }

        // 加载指定题目
        function loadRound(roundIdx) {
            while (roundIdx >= questionSequence.length) {
                const newArr = generateRandomArray();
                questionSequence.push(newArr);
                roundStrategy.push(randomStrategy());
                submittedRounds.push(false);
                roundCorrect.push(false);
            }

            sortedArray = [...questionSequence[roundIdx]];
            const strat = roundStrategy[roundIdx];
            answerSteps = generateStepsFromArray(sortedArray, strat);
            answerTreeRoot = buildFullBST(sortedArray, strat);

            // 更新策略标签
            updateStrategyTag(strat);

            manualRoot = null;
            placedElements.clear();

            renderElementPool();
            renderManualTree();
            if (submittedRounds[roundIdx]) {
                renderAutoTree();
            } else {
                renderEmptyAutoTree();
            }
        }

        // 根据策略生成插入步骤 (左偏/右偏)
        function generateStepsFromArray(arr, strat) {
            const n = arr.length;
            if (n===0) return [];
            const steps = [];
            function recurse(i,j) {
                if (i>j) return;
                let mid = (strat === 'left') ? Math.floor((i+j)/2) : Math.floor((i+j+1)/2);
                steps.push(arr[mid]);
                recurse(i, mid-1);
                recurse(mid+1, j);
            }
            recurse(0, n-1);
            return steps;
        }

        function buildFullBST(arr, strat) {
            let root = null;
            const steps = generateStepsFromArray(arr, strat);
            steps.forEach(val => { root = insertIntoTree(root, val); });
            return root;
        }

        function insertIntoTree(root, val) {
            const newNode = { val, left: null, right: null };
            if (!root) return newNode;
            let cur = root;
            while (true) {
                if (val < cur.val) { if (!cur.left) { cur.left = newNode; break; } cur = cur.left; }
                else if (val > cur.val) { if (!cur.right) { cur.right = newNode; break; } cur = cur.right; }
                else break;
            }
            return root;
        }

        function copyTree(root) {
            if (!root) return null;
            return { val: root.val, left: copyTree(root.left), right: copyTree(root.right) };
        }

        function treesEqual(a, b) {
            if (!a && !b) return true;
            if (!a || !b) return false;
            if (a.val !== b.val) return false;
            return treesEqual(a.left, b.left) && treesEqual(a.right, b.right);
        }

        // 更新策略标签
        function updateStrategyTag(strat) {
            if (strat === 'left') {
                manualStrategyTag.innerText = '左偏';
                manualStrategyTag.className = 'strategy-tag strategy-left';
            } else {
                manualStrategyTag.innerText = '右偏';
                manualStrategyTag.className = 'strategy-tag strategy-right';
            }
        }

        function renderEmptyAutoTree() {
            while (autoTreeSvg.firstChild) autoTreeSvg.removeChild(autoTreeSvg.firstChild);
            autoTreeSvg.setAttribute('width', '500');
            autoTreeSvg.setAttribute('height', '200');
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute('x', 250);
            text.setAttribute('y', 100);
            text.setAttribute('font-size', '13');
            text.setAttribute('fill', '#b47b5c');
            text.setAttribute('text-anchor', 'middle');
            text.textContent = '🤖 提交后显示答案';
            autoTreeSvg.appendChild(text);
        }

        function updateScoreBoard() {
            const submitted = submittedRounds.filter(v=>v).length;
            const correct = roundCorrect.filter(v=>v).length;
            submittedCountSpan.innerText = submitted;
            correctCountSpan.innerText = correct;
            wrongCountSpan.innerText = submitted - correct;
            scoreDisplay.innerText = `${correct} / ${submitted}`;
            
            if (submitted === questionSequence.length && questionSequence.length > 0) {
                finalGradeMessage.innerText = `🏁 当前所有题目已提交! 正确:${correct}`;
            } else {
                finalGradeMessage.innerText = '';
            }
        }

        // 发送数据到服务器
        function sendScoreToServer() {
            const className = classInput.value.trim() || '211';
            const studentName = nameInput.value.trim() || '你的姓名';
            const correctCount = roundCorrect.filter(v=>v).length;
            const totalSubmitted = submittedRounds.filter(v=>v).length;
            
            const data = {
                class: className,
                name: studentName,
                score: correctCount,
                total: totalSubmitted,
                timestamp: new Date().toISOString()
            };

            sendStatus.innerText = '📤 发送中...';
            
            fetch(SUBMIT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (response.ok) {
                    sendStatus.innerText = '✅ 已上报';
                    updateHistory('📊 成绩已成功上报服务器');
                } else {
                    sendStatus.innerText = '❌ 上报失败';
                    updateHistory('❌ 成绩上报失败，请检查网络');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                sendStatus.innerText = '❌ 上报失败';
                updateHistory('❌ 成绩上报失败，请检查网络');
            });
        }

        function submitCurrentRound() {
            if (!gameActive) { updateHistory('⏳ 游戏未开始或已结束'); return; }
            if (submittedRounds[currentRound]) { updateHistory('本题已提交'); return; }
            if (placedElements.size !== sortedArray.length) {
                updateHistory(`还有 ${sortedArray.length - placedElements.size} 个元素未放置`);
                return;
            }

            const isCorrect = treesEqual(manualRoot, answerTreeRoot);
            roundCorrect[currentRound] = isCorrect;
            submittedRounds[currentRound] = true;

            renderAutoTree();
            updateScoreBoard();
            updateHistory(isCorrect ? '✅ 正确！' : '❌ 错误，对比标准树');

            ensureNextRoundExists();  // 预生成下一题

            if (gameActive) newRoundBtn.disabled = false;
        }

        function goToNextRound() {
            if (!gameActive) return;
            if (currentRound + 1 < questionSequence.length) {
                currentRound++;
            } else {
                ensureNextRoundExists();
                currentRound++;
            }
            loadRound(currentRound);
            newRoundBtn.disabled = true;
            submitRoundBtn.disabled = false;
            if (submittedRounds[currentRound]) renderAutoTree();
            else renderEmptyAutoTree();
            updateScoreBoard();
        }

        // 计时器
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timeLeft = MAX_TIME;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (!gameActive) return;
                timeLeft -= 1;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    updateTimerDisplay();
                    gameActive = false;
                    clearInterval(timerInterval);
                    timerInterval = null;
                    startGameBtn.disabled = false;
                    newRoundBtn.disabled = true;
                    submitRoundBtn.disabled = true;
                    
                    alert('⏰ 时间到！游戏结束。');
                    
                    updateHistory('⏰ 时间到！游戏结束。点击“开始”重玩。');
                    renderElementPool();
                    const submitted = submittedRounds.filter(v=>v).length;
                    if (submitted > 0) {
                        sendScoreToServer();
                    }
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerDisplay.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        }

        function resetAndStartGame() {
            stopTimer();
            resetGameSequences();   

            currentRound = 0;
            gameActive = true;
            timeLeft = MAX_TIME;
            updateTimerDisplay();

            loadRound(0);
            renderEmptyAutoTree();

            startGameBtn.disabled = true;
            newRoundBtn.disabled = true;
            submitRoundBtn.disabled = false;
            updateScoreBoard();
            
            sendStatus.innerText = '📤 等待发送';

            startTimer();
            updateHistory('⏳ 游戏开始！');
        }

        // 渲染树
        function renderTree(svgElement, root, type) {
            if (!root) {
                while (svgElement.firstChild) svgElement.removeChild(svgElement.firstChild);
                svgElement.setAttribute('width', '500');
                svgElement.setAttribute('height', '200');
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute('x', 250);
                text.setAttribute('y', 100);
                text.setAttribute('font-size', '13');
                text.setAttribute('fill', '#b47b5c');
                text.setAttribute('text-anchor', 'middle');
                text.textContent = type==='auto'? '🤖 标准树' : '👆 拖拽构建';
                svgElement.appendChild(text);
                return;
            }
            const levels = [];
            function computePositions(node, depth, left, right) {
                if (!node) return;
                if (!levels[depth]) levels[depth] = [];
                const x = (left+right)/2;
                levels[depth].push({val: node.val, x, node});
                const gap = (right-left)*0.4;
                if (node.left) computePositions(node.left, depth+1, x-gap, x);
                if (node.right) computePositions(node.right, depth+1, x, x+gap);
            }
            computePositions(root, 0, 0, 500);
            let minX=9999,maxX=-9999;
            levels.forEach(lev=>lev.forEach(item=>{if(item.x<minX)minX=item.x;if(item.x>maxX)maxX=item.x;}));
            const pad=50; minX=Math.min(minX-pad,0); maxX=maxX+pad;
            const svgW = Math.max(500, maxX-minX);
            const svgH = Math.max(200, levels.length*50+50);
            svgElement.setAttribute('width', svgW);
            svgElement.setAttribute('height', svgH);
            while(svgElement.firstChild) svgElement.removeChild(svgElement.firstChild);
            const offsetX = -minX;

            for(let d=0; d<levels.length-1; d++) {
                levels[d].forEach(p => {
                    const px = p.x+offsetX, py = 25+d*45;
                    if(p.node.left) {
                        let child = levels[d+1].find(c=>c.node===p.node.left);
                        if(child) drawLine(svgElement, px, py+16, child.x+offsetX, 25+(d+1)*45-16);
                    }
                    if(p.node.right) {
                        let child = levels[d+1].find(c=>c.node===p.node.right);
                        if(child) drawLine(svgElement, px, py+16, child.x+offsetX, 25+(d+1)*45-16);
                    }
                });
            }
            levels.forEach((lev,d)=>{
                lev.forEach(item=>{
                    const cx = item.x+offsetX, cy = 25+d*45;
                    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    circle.setAttribute('cx', cx); circle.setAttribute('cy', cy);
                    circle.setAttribute('r', '18');
                    circle.setAttribute('fill', type==='auto'? '#e68a5e' : '#b47b5c');
                    circle.setAttribute('stroke','#f5bc8e'); circle.setAttribute('stroke-width','2');
                    svgElement.appendChild(circle);
                    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    text.setAttribute('x', cx); text.setAttribute('y', cy+3);
                    text.setAttribute('font-size','12'); text.setAttribute('fill','#2f1f15');
                    text.setAttribute('font-weight','bold'); text.setAttribute('text-anchor','middle');
                    text.setAttribute('dominant-baseline','middle'); text.textContent = item.val;
                    svgElement.appendChild(text);
                });
            });
        }
        function drawLine(svg,x1,y1,x2,y2) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute('x1',x1); line.setAttribute('y1',y1); line.setAttribute('x2',x2); line.setAttribute('y2',y2);
            line.setAttribute('stroke','#f5bc8e'); line.setAttribute('stroke-width','2');
            svg.appendChild(line);
        }
        function renderManualTree() { renderTree(manualTreeSvg, manualRoot, 'manual'); }
        function renderAutoTree() { renderTree(autoTreeSvg, answerTreeRoot, 'auto'); }

        // 元素池渲染 (修复: 确保所有数字都可拖拽)
        function renderElementPool() {
            elementPool.innerHTML = '';
            sortedArray.forEach(val => {
                const div = document.createElement('div');
                // 可拖拽条件：游戏进行中 && 当前题未提交 && 该元素尚未被放置
                const canDrag = gameActive && !submittedRounds[currentRound] && !placedElements.has(val);
                div.className = `draggable-item ${!canDrag ? 'placed' : ''}`;  // 使用placed样式表示不可拖拽
                div.textContent = val;
                if (canDrag) {
                    div.setAttribute('draggable', true);
                } else {
                    div.setAttribute('draggable', false);
                }
                div.dataset.value = val;
                div.addEventListener('dragstart', handleDragStart);
                div.addEventListener('dragend', handleDragEnd);
                elementPool.appendChild(div);
            });
        }

        let draggedValue = null;
        function handleDragStart(e) {
            if (!gameActive || submittedRounds[currentRound]) { 
                e.preventDefault(); 
                return false; 
            }
            const val = parseInt(e.target.dataset.value);
            if (placedElements.has(val)) { 
                e.preventDefault(); 
                return false; 
            }
            draggedValue = val;
            e.target.classList.add('dragging');
            e.dataTransfer.setData('text/plain', val);
            // 修复：明确设置拖拽效果
            e.dataTransfer.effectAllowed = 'move';
        }
        function handleDragEnd(e) { 
            e.target.classList.remove('dragging'); 
            draggedValue = null; 
        }

        // drop 处理
        manualTreeSvg.addEventListener('dragover', e => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        });

        manualTreeSvg.addEventListener('drop', e => {
            e.preventDefault();
            if (!gameActive || submittedRounds[currentRound]) { 
                updateHistory('游戏已结束或本题已提交'); 
                return; 
            }
            const val = draggedValue;  // 从 dragstart 保存的值
            if (val === null || val === undefined) {
                // 降级尝试从 dataTransfer 获取
                const data = e.dataTransfer.getData('text/plain');
                if (!data) return;
                draggedValue = parseInt(data);
            }
            const finalVal = (val !== null && val !== undefined) ? val : parseInt(e.dataTransfer.getData('text/plain'));
            if (isNaN(finalVal) || placedElements.has(finalVal)) return;

            // 获取 drop 坐标
            const pt = manualTreeSvg.createSVGPoint();
            pt.x = e.clientX; pt.y = e.clientY;
            const ctm = manualTreeSvg.getScreenCTM();
            if (!ctm) return;
            const svgPt = pt.matrixTransform(ctm.inverse());
            const dropX = svgPt.x, dropY = svgPt.y;

            if (!manualRoot) {
                manualRoot = { val: finalVal, left: null, right: null };
                placedElements.add(finalVal);
                updateHistory(`根节点: ${finalVal}`);
                renderManualTree(); 
                renderElementPool(); 
                draggedValue = null;
                return;
            }

            // 查找最近的节点
            const nodes = [];
            function collect(node, depth, x, range) {
                if (!node) return;
                nodes.push({ node, x, y: 25 + depth*45 });
                const gap = range*0.4;
                if (node.left) collect(node.left, depth+1, x-gap, gap);
                if (node.right) collect(node.right, depth+1, x+gap, gap);
            }
            collect(manualRoot, 0, 250, 200);
            
            let closest = null;
            let minDist = Infinity;
            nodes.forEach(n => {
                let d = Math.hypot(n.x - dropX, n.y - dropY); 
                if (d < minDist) {
                    minDist = d; 
                    closest = n;
                }
            });
            
            if (!closest) { 
                draggedValue = null;
                return; 
            }

            let success = false;
            if (finalVal < closest.node.val && !closest.node.left) {
                closest.node.left = { val: finalVal, left: null, right: null };
                placedElements.add(finalVal); 
                success = true;
                updateHistory(`插入 ${finalVal} 到 ${closest.node.val} 左侧`);
            } else if (finalVal > closest.node.val && !closest.node.right) {
                closest.node.right = { val: finalVal, left: null, right: null };
                placedElements.add(finalVal); 
                success = true;
                updateHistory(`插入 ${finalVal} 到 ${closest.node.val} 右侧`);
            } else {
                updateHistory(`❌ 无效放置`);
            }
            
            if (success) {
                renderManualTree(); 
                renderElementPool();
            }
            draggedValue = null;
        });

        function updateHistory(msg) { historyMessage.innerText = msg; }

        // 事件绑定
        startGameBtn.addEventListener('click', resetAndStartGame);
        newRoundBtn.addEventListener('click', goToNextRound);
        submitRoundBtn.addEventListener('click', submitCurrentRound);

        // 初始状态
        resetGameSequences();        
        loadRound(0);
        renderEmptyAutoTree();
        startGameBtn.disabled = false;
        newRoundBtn.disabled = true;
        submitRoundBtn.disabled = true;   
        updateHistory('点击“开始”按钮开始游戏');
        updateScoreBoard(); 
    })();
</script>
