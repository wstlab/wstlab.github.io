<body>
    <div class="container">
        <div class="main-content">
            <div class="circuit-diagram-container">

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ---------- DOM 元素绑定 ----------
            const buttons = document.querySelectorAll('.controls button');
            const lights = {
                red: document.getElementById('light-red'),
                yellow: document.getElementById('light-yellow'),
                green: document.getElementById('light-green')
            };
            // 各分支所有导线 (并联通路)
            const circuitPathWires = {
                red: document.querySelectorAll('.wire-path-red'),
                yellow: document.querySelectorAll('.wire-path-yellow'),
                green: document.querySelectorAll('.wire-path-green'),
            };
            const terminals = {
                red: document.getElementById('terminal-red'),
                yellow: document.getElementById('terminal-yellow'),
                green: document.getElementById('terminal-green'),
            };
            const switches = {
                red: document.getElementById('switch-red'),
                yellow: document.getElementById('switch-yellow'),
                green: document.getElementById('switch-green'),
            };
            const commonBusWires = document.querySelectorAll('#positive-bus, #negative-bus');
            
            // 电路状态追踪 (true = 点亮/闭合)
            const circuitStates = { red: false, yellow: false, green: false }; window.captureLesson=()=>({...circuitStates,allOn:Object.values(circuitStates).every(Boolean)});
            
            // ---------- 音频控制 (核心功能: 三灯全亮播放 signal.wav) ----------
            // 创建音频实例，使用同目录下的 signal.wav，循环播放
            const bgMusic = new Audio('./signal.wav');
            bgMusic.loop = true;      // 循环播放，保持音乐持续
            bgMusic.preload = 'auto'; // 预加载，提升响应速度
            
            // 可选: 处理音频加载失败的情况 (静默降级，不影响使用体验)
            bgMusic.addEventListener('error', (e) => {
                console.warn('⚠️ 音乐文件加载失败，请检查 signal.wav 是否存在于同一目录下', e);
                // 不影响核心交互，只输出提醒
            });
            
            // 标记音乐播放状态 (用于避免重复play/pause干扰)
            let musicPlayingFlag = false; // 辅助记录，实际以 audio 元素状态为准
            
            // 核心函数: 根据当前红黄绿灯状态决定音乐播放或停止
            function updateMusicPlayback() {
                // 检测是否三个灯全部点亮 (红、黄、绿都为 true)
                const allThreeOn = circuitStates.red === true && circuitStates.yellow === true && circuitStates.green === true;
                
                // 需要播放的条件: 三个全亮，并且音乐目前是暂停状态(或未播放)
                if (allThreeOn) {
                    // 若音乐尚未播放 或 由于某种原因被暂停，则从头播放并开启循环
                    if (bgMusic.paused) {
                        // 重置播放位置，让每次全亮时从开头重新播放，体验更佳
                        bgMusic.currentTime = 0;
                        // 播放音乐 (在用户手势上下文中已经被触发，安全)
                        const playPromise = bgMusic.play();
                        if (playPromise !== undefined) {
                            playPromise.then(() => {
                                musicPlayingFlag = true;
                                // 可选：轻量反馈（控制台不刷屏，可忽略）
                            }).catch(err => {
                                // 捕获自动播放策略错误: 但是所有全亮均是由按钮点击引发，一般不会拒绝
                                console.warn('音乐播放失败，可能是浏览器限制或文件问题:', err);
                                musicPlayingFlag = false;
                            });
                        }
                    } else {
                        // 已经在播放状态，无需操作，但确保标志同步
                        musicPlayingFlag = true;
                    }
                } else {
                    // 不全亮情况: 如果音乐正在播放则停止并重置时间
                    if (!bgMusic.paused) {
                        bgMusic.pause();
                        // 重置播放进度，以便下次全亮从头播放，符合直觉
                        bgMusic.currentTime = 0;
                        musicPlayingFlag = false;
                    } else {
                        musicPlayingFlag = false;
                    }
                }
            }
            
            // 辅助: 更新公共母线高亮 (只要任一电路激活，母线就亮)
            function updateCommonBusWires() {
                const anyCircuitActive = Object.values(circuitStates).some(state => state === true);
                commonBusWires.forEach(wire => {
                    if (anyCircuitActive) {
                        wire.classList.add('active');
                    } else {
                        wire.classList.remove('active');
                    }
                });
            }
            
            // 激活某一路径 (闭合开关，点亮对应灯)
            function activateCircuit(color) {
                if (!circuitStates[color]) {
                    circuitStates[color] = true;
                    // 更新物理灯效
                    if (lights[color]) lights[color].classList.add('on');
                    // 点亮该路径所有导线
                    if (circuitPathWires[color]) {
                        circuitPathWires[color].forEach(wire => wire.classList.add('active'));
                    }
                    // 更新灯符号终端高亮
                    if (terminals[color]) {
                        // 清除之前可能残留的其他颜色类，再添加特定类
                        terminals[color].classList.remove('active-red', 'active-yellow', 'active-green');
                        terminals[color].classList.add(`active-${color}`);
                    }
                    // 切换开关样式 (闭合)
                    if (switches[color]) {
                        switches[color].classList.remove('open');
                        switches[color].classList.add('closed');
                    }
                    // 更新母线高亮
                    updateCommonBusWires();
                    // 🎵 状态改变后立即检查全亮条件并更新音乐播放
                    updateMusicPlayback();
                }
            }
            
            // 关闭某一路径 (断开开关，熄灭对应灯)
            function deactivateCircuit(color) {
                if (circuitStates[color]) {
                    circuitStates[color] = false;
                    // 熄灭物理灯
                    if (lights[color]) lights[color].classList.remove('on');
                    // 熄灭路径所有导线高亮
                    if (circuitPathWires[color]) {
                        circuitPathWires[color].forEach(wire => wire.classList.remove('active'));
                    }
                    // 熄灭终端高亮
                    if (terminals[color]) {
                        terminals[color].classList.remove('active-red', 'active-yellow', 'active-green');
                    }
                    // 开关恢复断开姿态
                    if (switches[color]) {
                        switches[color].classList.remove('closed');
                        switches[color].classList.add('open');
                    }
                    // 更新母线
                    updateCommonBusWires();
                    // 🎵 状态改变后检查音乐播放（任意灯关闭导致不全亮时应停止音乐）
                    updateMusicPlayback();
                }
            }
            
            // ---------- 绑定按钮交互 (切换电路) ----------
            buttons.forEach(button => {
                button.addEventListener('click', (e) => {
                    const color = button.dataset.color;
                    // 当前状态: 如果已激活就关闭，否则激活
                    if (circuitStates[color]) {
                        deactivateCircuit(color);
                    } else {
                        activateCircuit(color);
                    }
                });
            });
            
            // ---------- 额外优雅处理: 页面可见性变化时若音乐还在播放但条件不满足则停止(安全) ----------
            document.addEventListener('visibilitychange', () => {
                // 当页面隐藏，且音乐正在播放但条件可能已经不符合时，主动暂停避免后台消耗
                if (document.hidden && !bgMusic.paused) {
                    const allThreeOn = circuitStates.red && circuitStates.yellow && circuitStates.green;
                    if (!allThreeOn && !bgMusic.paused) {
                        bgMusic.pause();
                        bgMusic.currentTime = 0;
                        musicPlayingFlag = false;
                    } else if (allThreeOn && !bgMusic.paused) {
                        // 页面隐藏但全亮条件满足，音乐继续播放（合理），不做额外操作
                    }
                } else if (!document.hidden) {
                    // 恢复可见时，重新检查状态 (确保UI与音乐同步)
                    const allThreeOn = circuitStates.red && circuitStates.yellow && circuitStates.green;
                    if (allThreeOn && bgMusic.paused) {
                        // 由于页面恢复且全亮条件满足但音乐没播（异常情况），重新播放
                        bgMusic.currentTime = 0;
                        bgMusic.play().catch(e => console.warn("恢复播放失败", e));
                    } else if (!allThreeOn && !bgMusic.paused) {
                        bgMusic.pause();
                        bgMusic.currentTime = 0;
                    }
                }
            });
            
            // 初始化: 确保所有电路为断开状态 (红灯、黄灯、绿灯全灭)
            // 手动调用deactivate确保初始样式干净 (已经默认open)
            deactivateCircuit('red');
            deactivateCircuit('yellow');
            deactivateCircuit('green');
            // 最后额外更新一次母线状态，保证母线视觉无高亮 (updateCommonBusWires已经在deactivate里调用过，但以防万一)
            updateCommonBusWires();
            // 确保音乐处于停止状态 (初始无全亮)
            if (!bgMusic.paused) {
                bgMusic.pause();
                bgMusic.currentTime = 0;
            }
            musicPlayingFlag = false;
            
            // 附加说明: 如果用户快速点击并且三个灯同时点亮，音乐会在最后一个灯激活瞬间触发播放。
            // 当任意灯关闭时音乐立刻停止，完全符合需求。
            // 为防止音频加载延迟，调用预加载友好
            if (bgMusic.readyState === 0) {
                bgMusic.load(); // 主动预加载但不播放，避免无交互报错
            }
            
            // 小彩蛋: 控制台输出提示
            console.log('🎛️ 交通信号灯已启动 | 三灯齐亮 → 播放 signal.wav ✨');
        });
    </script>
