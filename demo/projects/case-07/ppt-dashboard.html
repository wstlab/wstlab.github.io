<body>
<div class="container">
    <header>
        <div>
            <h1>
                🧮 24点答题动态分析
                <span class="badge">实时获取</span>
            </h1>
            <div class="api-url">🔗 https://qf.kjxs.site/api/3R1MoMlX7OB/all</div>
        </div>
        <div class="refresh-area">
            <span class="time-tag" id="update-time">刚刚</span>
            <button class="refresh-btn" id="refreshButton">⟳ 刷新数据</button>
        </div>
    </header>

    <!-- 动态内容容器 -->
    <div id="analysis-root">
        <div class="loading">
            <div class="spinner"></div>
            <div>正在从服务器获取最新答题数据...</div>
        </div>
    </div>
</div>

<script>
    (function() {
        const esc=CaseFlow.escape;
        const API_URL = 'https://qf.kjxs.site/api/3R1MoMlX7OB/all';
        const root = document.getElementById('analysis-root');
        const refreshBtn = document.getElementById('refreshButton');
        const timeSpan = document.getElementById('update-time');

        // 核心处理函数：将API数据转换为分析结构
        function processApiData(apiData) {
            if (!apiData || !apiData.submissions || !Array.isArray(apiData.submissions)) {
                throw new Error('API返回格式异常，缺少submissions数组');
            }

            const rawStudents = apiData.submissions.filter(s => s.lesson === "PPT同题多解" && !s.verification && Array.isArray(s.submissions)).map(s => ({
                ...s,
                displayName: s.studentName || '匿名',
            }));

            const processedStudents = rawStudents.map(studentRaw => {
                const submissionList = studentRaw.submissions || [];
                const puzzleMap = new Map(); // key: 排序后数字组合

                for (let sub of submissionList) {
                    if (!sub.puzzle || !Array.isArray(sub.puzzle)) continue;
                    // 统一用排序后的数字作为题目唯一标识 (24点题目由数字组合决定)
                    const sortedKey = [...sub.puzzle].sort((a,b)=>a-b).join(',');
                    
                    if (!puzzleMap.has(sortedKey)) {
                        puzzleMap.set(sortedKey, {
                            puzzle: sub.puzzle, // 保留原始顺序用于显示
                            totalAttempts: 0,
                            correctCount: 0,
                            skipCount: 0,
                        });
                    }
                    const record = puzzleMap.get(sortedKey);
                    
                    // 提交次数只统计 type='submit' 且 action 为 correct/incorrect (即真正提交了答案)
                    if (sub.type === 'submit' && (sub.action === 'correct' || sub.action === 'incorrect')) {
                        record.totalAttempts += 1;
                        if (sub.isCorrect === true) {
                            record.correctCount += 1;
                        }
                    } else if (sub.type === 'skip' || sub.action === 'skip') {
                        record.skipCount += 1;
                    }
                }

                const puzzleStats = Array.from(puzzleMap.values()).map(p => ({
                    ...p,
                    puzzleDisplay: p.puzzle.join(', '),
                })).sort((a,b) => a.puzzleDisplay.localeCompare(b.puzzleDisplay));

                return {
                    originalName: studentRaw.studentName,
                    displayName: studentRaw.studentName + (studentRaw.submitted_at ? ` (${new Date(studentRaw.submitted_at).toLocaleString('zh-CN',{hour12:false, timeZone: 'Asia/Shanghai'})})` : ''),
                    submitted_at: studentRaw.submitted_at,
                    puzzleStats,
                    totalCorrect: puzzleStats.reduce((acc, p) => acc + p.correctCount, 0),
                    totalAttemptsSum: puzzleStats.reduce((acc, p) => acc + p.totalAttempts, 0),
                };
            });

            return {
                students: processedStudents,
                totalStudents: processedStudents.length,
                totalSubmissionsRaw: apiData.submissions.length,
                taskTitle: apiData.task_title || '24点游戏',
                note: apiData.note || '',
            };
        }

        // 渲染HTML
        function renderDashboard(container, data) {
            const { students, totalStudents, taskTitle, note } = data;
            
            if (!students.length) {
                container.innerHTML = `<div class="student-section" style="text-align:center;padding:50px;">📭 暂无学生答题数据</div>`;
                return;
            }

            const totalCorrectAll = students.reduce((acc, s) => acc + s.totalCorrect, 0);
            const totalAttemptsAll = students.reduce((acc, s) => acc + s.totalAttemptsSum, 0);
            const totalPuzzleCount = students.reduce((acc, s) => acc + s.puzzleStats.length, 0);

            let html = `
                <div class="stats-summary">
                    <div class="stat-item"><span class="stat-label">📋 任务</span><span class="stat-number">${esc(taskTitle)}</span></div>
                    <div class="stat-item"><span class="stat-label">👥 学生答题记录</span><span class="stat-number">${totalStudents}</span></div>
                    <div class="stat-item"><span class="stat-label">✅ 总正确次数</span><span class="stat-number">${totalCorrectAll}</span></div>
                    <div class="stat-item"><span class="stat-label">📝 总提交次数</span><span class="stat-number">${totalAttemptsAll}</span></div>
                    <div class="stat-item"><span class="stat-label">🧩 涉及题目数</span><span class="stat-number">${totalPuzzleCount}</span></div>
                </div>
            `;

            students.forEach(student => {
                const puzzleRows = student.puzzleStats.map(p => {
                    const skipText = p.skipCount > 0 ? `<span class="skip-indicator"><span>⏭️ 跳过 ${p.skipCount}</span></span>` : '';
                    const correctBadgeClass = p.correctCount > 0 ? 'correct-badge' : 'correct-badge no-correct';
                    const correctText = p.correctCount > 0 ? `${p.correctCount} 次` : '0 次';

                    return `<tr>
                        <td><span class="puzzle-numbers">[ ${esc(p.puzzleDisplay)} ]</span></td>
                        <td><div class="stats-badge"><span class="attempts">${p.totalAttempts}</span> 次提交</div></td>
                        <td><div class="stats-badge"><span class="${correctBadgeClass}">✅ ${correctText}</span> ${skipText}</div></td>
                    </tr>`;
                }).join('');

                html += `
                    <div class="student-section">
                        <div class="student-header">
                            <span class="student-name">🧑‍🎓 ${esc(student.displayName)}</span>
                            <div class="student-meta">
                                <span>📅 ${esc(student.submitted_at ? student.submitted_at.split('T')[0] : '时间未知')}</span>
                                <span>✅ 正确 ${student.totalCorrect}</span>
                                <span>📤 提交 ${student.totalAttemptsSum}</span>
                            </div>
                        </div>
                        <div class="puzzle-grid">
                            <table>
                                <thead>
                                    <tr><th>题目 (四张牌)</th><th>提交次数 (不正确+正确)</th><th>正确次数 / 跳过</th></tr>
                                </thead>
                                <tbody>
                                    ${puzzleRows || '<tr><td colspan="3" style="text-align:center; padding:30px;">无题目记录</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            });

            html += `<div class="footer-note">🔍 实时数据 · 服务器备注：${esc(note)} · 页面刷新于 ${new Date().toLocaleString()}</div>`;
            container.innerHTML = html;
        }

        // 加载数据并更新界面
        async function fetchAndRender() {
            root.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div>正在连接服务器获取最新数据...</div>
                </div>
            `;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000); // 10秒超时

                const response = await fetch(API_URL, {
                    signal: controller.signal,
                    headers: { 'Accept': 'application/json' }
                });
                clearTimeout(timeoutId);

                if (!response.ok) {
                    throw new Error(`HTTP error! 状态码: ${response.status}`);
                }

                const apiData = await response.json();
                const processed = processApiData(apiData);
                renderDashboard(root, processed);

                // 更新刷新时间标记
                const now = new Date();
                timeSpan.textContent = now.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            } catch (error) {
                console.error('获取数据失败:', error);
                let errorMessage = error.message;
                if (error.name === 'AbortError') {
                    errorMessage = '请求超时，服务器响应过慢。';
                } else if (error.message.includes('Failed to fetch')) {
                    errorMessage = '无法连接到服务器，请检查网络或API地址是否可访问。';
                }

                root.innerHTML = `
                    <div class="error-box">
                        <div style="font-size: 2.5rem; margin-bottom: 16px;">⚠️</div>
                        <h2 style="margin:0 0 12px; font-weight:500;">加载失败</h2>
                        <p style="margin:0 0 24px; color:#b13b3b;">${errorMessage}</p>
                        <button class="refresh-btn" id="retryBtn" style="background: #a04646; border-color:#803a3a;">🔄 点击重试</button>
                    </div>
                `;
                // 重新绑定重试按钮
                document.getElementById('retryBtn')?.addEventListener('click', () => {
                    fetchAndRender();
                });
            }
        }

        // 初次加载
        fetchAndRender();

        // 刷新按钮事件
        refreshBtn.addEventListener('click', (e) => {
            e.preventDefault();
            fetchAndRender();
        });
    })();
</script>
</body>
