};

    init() {

    },
    
    playWrong() {
        this.playTone([200], 0.3); // 低音
    },
    
    playTone(frequencies, duration) {
        if (!this.audioContext) this.init();
        
        frequencies.forEach(freq => {
            const oscillator = this.audioContext.createOscillator();
            const gainNode = this.audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(this.audioContext.destination);
            
            oscillator.frequency.value = freq;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);
            
            oscillator.start(this.audioContext.currentTime);
            oscillator.stop(this.audioContext.currentTime + duration);
        });
    }
};

// 24点游戏核心算法
const Game24 = {
    // 生成随机题目
    generateRandomQuestion() {
        const numbers = [];
        for (let i = 0; i < 4; i++) {
            numbers.push(Math.floor(Math.random() * 13) + 1);
        }
        return numbers;
    },
    
    // 生成多道题目
    generateQuestions(count) {
        const questions = [];
        for (let i = 0; i < count; i++) {
            questions.push(this.generateRandomQuestion());
        }
        return questions;
    },
    
    // 验证表达式是否等于24
    evaluateExpression(expression, numbers) {
        try {
            // 替换数学符号
            let expr = expression
                .replace(/×/g, '*')
                .replace(/÷/g, '/')
                .replace(/（/g, '(')
                .replace(/）/g, ')');
            
            // 检查是否使用了正确的数字
            const usedNumbers = expr.match(/\d+/g);
            if (!usedNumbers || usedNumbers.length !== 4) {
                return { valid: false, message: '请使用全部4个数字' };
            }
            
            const sortedUsed = usedNumbers.map(n => parseInt(n)).sort((a, b) => a - b);
            const sortedGiven = [...numbers].sort((a, b) => a - b);
            
            for (let i = 0; i < 4; i++) {
                if (sortedUsed[i] !== sortedGiven[i]) {
                    return { valid: false, message: '请使用给定的数字' };
                }
            }
            
            // 计算结果
            const result = eval(expr);
            
            if (Math.abs(result - 24) < 0.0001) {
                return { valid: true, result: 24 };
            } else {
                return { valid: false, message: `结果是 ${result.toFixed(2)}，不等于24` };
            }
        } catch (error) {
            return { valid: false, message: '表达式格式错误' };
        }
    },
    
    // 查找答案（提示用）
    findSolution(numbers) {
        // 简单的暴力搜索（实际应用中可以使用更高效的算法）
        const ops = ['+', '-', '*', '/'];
        const perms = this.permutations(numbers);
        
        for (const perm of perms) {
            for (const op1 of ops) {
                for (const op2 of ops) {
                    for (const op3 of ops) {
                        // 尝试不同的括号组合
                        const expressions = [
                            `((${perm[0]} ${op1} ${perm[1]}) ${op2} ${perm[2]}) ${op3} ${perm[3]}`,
                            `(${perm[0]} ${op1} (${perm[1]} ${op2} ${perm[2]})) ${op3} ${perm[3]}`,
                            `(${perm[0]} ${op1} ${perm[1]}) ${op2} (${perm[2]} ${op3} ${perm[3]})`,
                            `${perm[0]} ${op1} ((${perm[1]} ${op2} ${perm[2]}) ${op3} ${perm[3]})`,
                            `${perm[0]} ${op1} (${perm[1]} ${op2} (${perm[2]} ${op3} ${perm[3]}))`
                        ];
                        
                        for (const expr of expressions) {
                            try {
                                const result = eval(expr);
                                if (Math.abs(result - 24) < 0.0001) {
                                    return expr
                                        .replace(/\*/g, '×')
                                        .replace(/\//g, '÷');
                                }
                            } catch (e) {
                                continue;
                            }
                        }
                    }
                }
            }
        }
        
        return null;
    },
    
    // 生成排列
    permutations(arr) {
        if (arr.length <= 1) return [arr];
        
        const result = [];
        for (let i = 0; i < arr.length; i++) {
            const rest = [...arr.slice(0, i), ...arr.slice(i + 1)];
            const perms = this.permutations(rest);
            for (const perm of perms) {
                result.push([arr[i], ...perm]);
            }
        }
        return result;
    }
};

    return `joined_${studentInfo.class}_${studentInfo.name}`;
}

function loadJoinedCompetitions() {
    const key = getJoinedKey();
    if (!key) { joinedCompetitionIds.clear(); return; }
    try {
        const saved = JSON.parse(localStorage.getItem(key) || '[]');
        joinedCompetitionIds = new Set(saved);
    } catch { joinedCompetitionIds.clear(); }
}

function saveJoinedCompetitions() {
    const key = getJoinedKey();
    if (!key) return;
    localStorage.setItem(key, JSON.stringify([...joinedCompetitionIds]));
}

// 初始化
document.addEventListener('DOMContentLoaded', () => {
    Utils.populateClassSelect('student-class');
    
    // 尝试恢复登录状态
    const savedInfo = Utils.storage.get('studentInfo');

// ==================== 登录/退出 ====================

    if (!cls || !name) {

    }

    };

// 同步用户信息到教师端
async function syncUserToTeacher() {

function handleLogout() {
    if (confirm('确定要退出登录吗？')) {
        studentInfo = null;
        Utils.storage.remove('studentInfo');
        showLoginPage();
    }
}

function showLoginPage() {
    hideAllPages();
    stopCompetitionPolling();
    // 清空已参加记录
    joinedCompetitionIds.clear();
    // 隐藏退出按钮
    document.getElementById('logout-btn').style.display = 'none';
    // 清空输入

}

function showModePage() {
    hideAllPages();
    stopCompetitionPolling();

    loadJoinedCompetitions();

    document.getElementById('welcome-name').textContent = studentInfo.name;
    document.getElementById('welcome-class').textContent = studentInfo.class;

// ==================== 模式选择 ====================

function startFreePractice() {
    gameMode = 'practice';
    hideAllPages();
    document.getElementById('practice-setup-page').classList.add('active');
}

async function startCompetition() {
    gameMode = 'competition';
    hideAllPages();
    document.getElementById('competition-list-page').classList.add('active');
    
    // 加载可用竞赛
    await loadAvailableCompetitions();
    
    // 启动轮询，每10秒检查是否有新竞赛
    startCompetitionPolling();
}

// ==================== 竞赛轮询 ====================

function startCompetitionPolling() {
    stopCompetitionPolling();
    competitionPollingTimer = setInterval(() => {
        // 只在竞赛列表页面可见时轮询
        const compPage = document.getElementById('competition-list-page');
        if (compPage && compPage.classList.contains('active')) {
            loadAvailableCompetitions(true); // silent=true 不重复显示消息
        }
    }, 10000); // 每10秒刷新一次
}

function stopCompetitionPolling() {
    if (competitionPollingTimer) {
        clearInterval(competitionPollingTimer);
        competitionPollingTimer = null;
    }
}

// ==================== 竞赛列表 ====================

async function loadAvailableCompetitions(silent = false) {
    try {
        const data = await API.getTeacherData(); // 从教师发布的数据中读取
        
        // 按竞赛ID去重，保留最新记录，再过滤
        const allComps = data.filter(item => item.type === 'competition');
        const compMap = new Map();
        allComps.forEach(c => {
            const existing = compMap.get(c.id);
            if (!existing) {
                compMap.set(c.id, c);
            } else {
                const t1 = existing.deletedAt || existing.endTime || existing.startTime || existing.createdAt;
                const t2 = c.deletedAt || c.endTime || c.startTime || c.createdAt;
                if (new Date(t2) > new Date(t1)) compMap.set(c.id, c);
            }
        });
        
        const competitions = Array.from(compMap.values()).filter(c =>
            c.status !== 'deleted' && c.status === 'running' && !joinedCompetitionIds.has(c.id)
        );
        
        const container = document.getElementById('available-competitions');
        
        if (competitions.length === 0) {
            container.innerHTML = '<p class="loading">暂无可用竞赛<br><small>教师发布竞赛后将自动出现在这里，请耐心等待…</small></p>';
            return;
        }
        
        let html = '';
        
        competitions.forEach(comp => {
            const isJoined = joinedCompetitionIds.has(comp.id);
            const questions = Array.isArray(comp.questions) ? comp.questions.filter(q => Array.isArray(q)) : [];
            const statusText = comp.status === 'running' ? '🏆 进行中 - 立即参加' : '⏰ 即将开始';
            const statusClass = comp.status === 'running' ? 'running' : 'scheduled';
            
            html += `
                <div class="competition-item ${statusClass}" ${!isJoined ? `onclick="joinCompetition('${comp.id}')"` : ''}>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h4>${comp.name}</h4>
                        ${isJoined ? '<span style="color:#11998e; font-weight:bold;">✓ 已参加</span>' : '<span style="color:#eb3349; font-weight:bold;">▶ 点击参加</span>'}
                    </div>
                    <p>📋 题目数量：${questions.length} 题</p>
                    <p>⏱️ 答题时间：${comp.time || 120} 秒</p>
                    <p>${statusText}</p>
                    ${comp.startTime ? `<p>🕐 开始时间：${Utils.formatDateTime(comp.startTime)}</p>` : ''}
                </div>
            `;
        });
        
        // 如果之前列表为空现在有了，提示用户
        if (!silent && container.querySelector('.loading')) {
            Utils.showMessage('有新的竞赛可参加！', 'success');
        }
        
        container.innerHTML = html;
        
    } catch (error) {
        console.error('加载竞赛列表失败:', error);
        if (!silent) {
            Utils.showMessage('加载竞赛列表失败，请稍后重试', 'error');
        }
    }
}

// ==================== 加入竞赛 ====================

async function joinCompetition(competitionId) {
    const data = await API.getTeacherData();
    const competition = data.find(item => item.id === competitionId);
    
    if (!competition) {
        Utils.showMessage('竞赛不存在或已被删除', 'error');
        return;
    }
    
    // 检查竞赛状态
    if (competition.status === 'ended') {
        Utils.showMessage('竞赛已结束', 'error');
        await loadAvailableCompetitions();
        return;
    }
    
    // 如果是定时竞赛且未到开始时间
    if (competition.status === 'scheduled' && competition.startTime) {
        const start = new Date(competition.startTime);
        const now = new Date();
        if (start > now) {
            const waitSeconds = Math.floor((start - now) / 1000);
            Utils.showMessage(`竞赛将在 ${waitSeconds} 秒后开始，请稍候…`, 'info');
            // 等待到开始时间自动加入
            setTimeout(() => joinCompetition(competitionId), Math.min(waitSeconds * 1000, 60000));
            return;
        }
    }
    
    // 提取有效的题目（过滤掉time等非数组字段）
    const rawQuestions = competition.questions;
    const questions = Array.isArray(rawQuestions) ? rawQuestions.filter(q => Array.isArray(q)) : [];
    
    if (questions.length === 0) {
        Utils.showMessage('竞赛题目为空', 'error');
        return;
    }
    
    currentQuestions = questions;
    timeRemaining = parseInt(competition.time) || 120;
    currentCompetitionName = competition.name;
    
    // 标记已参加
    joinedCompetitionIds.add(competitionId);
    saveJoinedCompetitions();
    
    stopCompetitionPolling();
    
    startGame(competition.name);
}

// ==================== 开始练习 ====================

function startPractice() {
    const count = parseInt(document.getElementById('practice-count').value);
    const time = parseInt(document.getElementById('practice-time').value);
    
    if (count < 1 || count > 20) {
        Utils.showMessage('题目数量必须在1-20之间', 'error');
        return;
    }
    
    currentQuestions = Game24.generateQuestions(count);
    timeRemaining = time;
    currentCompetitionName = '自由练习';
    
    startGame('自由练习');
}

function startGame(competitionName) {
    currentQuestionIndex = 0;
    answers = [];
    score = 0;
    startTime = new Date();
    
    hideAllPages();
    document.getElementById('game-page').classList.add('active');
    
    // 显示题目信息
    document.getElementById('total-questions').textContent = currentQuestions.length;
    document.getElementById('time-display').textContent = timeRemaining;
    
    // 开始计时
    startTimer();
    
    // 显示第一题
    showQuestion();
}

// ==================== 游戏逻辑 ====================

function startTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(() => {
        timeRemaining--;
        document.getElementById('time-display').textContent = timeRemaining;
        
        if (timeRemaining <= 0) {
            clearInterval(timer);
            endGame();
        }
    }, 1000);
}

function showQuestion() {
    const question = currentQuestions[currentQuestionIndex];
    
    document.getElementById('current-question').textContent = currentQuestionIndex + 1;
    document.getElementById('question-number').textContent = currentQuestionIndex + 1;
    document.getElementById('current-score').textContent = score;
    
    // 显示数字
    const numbersDisplay = document.getElementById('numbers-display');
    numbersDisplay.innerHTML = question.map(num => `
        <div class="number-box">${num}</div>
    `).join('');
    
    // 创建数字按钮
    const numberButtons = document.getElementById('number-buttons');
    numberButtons.innerHTML = question.map(num => `
        <button onclick="insertNumber(${num})">${num}</button>
    `).join('');
    
    // 清空输入
    document.getElementById('expression-input').value = '';
    
    // 隐藏反馈区域
    document.getElementById('feedback-section').style.display = 'none';
}

function insertNumber(num) {
    const input = document.getElementById('expression-input');
    input.value += num;
    input.focus();
}

function insertOperator(op) {
    const input = document.getElementById('expression-input');
    input.value += op;
    input.focus();
}

// 撤销：删除最后一个字符（支持多字符运算符 × ÷）
function backspace() {
    const input = document.getElementById('expression-input');
    input.value = input.value.slice(0, -1);
    input.focus();
}

// 清空输入框
function clearInput() {
    const input = document.getElementById('expression-input');
    input.value = '';
    input.focus();
}

function submitAnswer() {
    const expression = document.getElementById('expression-input').value.trim();
    const question = currentQuestions[currentQuestionIndex];
    
    if (!expression) {
        Utils.showMessage('请输入答案', 'error');
        return;
    }
    
    const result = Game24.evaluateExpression(expression, question);
    
    const answer = {
        question: question,
        expression: expression,
        correct: result.valid,
        solution: result.valid ? expression : Game24.findSolution(question)
    };
    
    answers.push(answer);
    
    // 显示反馈
    showFeedback(result.valid, answer.solution);
}

function showFeedback(isCorrect, solution) {
    const feedbackSection = document.getElementById('feedback-section');
    const feedbackMessage = document.getElementById('feedback-message');
    
    feedbackSection.style.display = 'block';
    
    if (isCorrect) {
        score += 10;
        document.getElementById('current-score').textContent = score;
        feedbackMessage.className = 'feedback-message correct';
        feedbackMessage.innerHTML = `
            ${Utils.getRandomEncouragement('correct')}<br>
            <small>你的答案正确！</small>
        `;
        SOUNDS.playCorrect();
    } else {
        feedbackMessage.className = 'feedback-message wrong';
        feedbackMessage.innerHTML = `
            ${Utils.getRandomEncouragement('wrong')}<br>
            <small>正确答案：${solution || '无解'}</small>
        `;
        SOUNDS.playWrong();
    }
}

function nextQuestion() {
    currentQuestionIndex++;
    
    if (currentQuestionIndex >= currentQuestions.length) {
        endGame();
    } else {
        showQuestion();
    }
}

function skipQuestion() {
    const question = currentQuestions[currentQuestionIndex];
    const solution = Game24.findSolution(question);
    
    answers.push({
        question: question,
        expression: '',
        correct: false,
        solution: solution
    });
    
    currentQuestionIndex++;
    
    if (currentQuestionIndex >= currentQuestions.length) {
        endGame();
    } else {
        showQuestion();
    }
}

// ==================== 结束游戏 ====================

async function endGame() {
    clearInterval(timer);
    
    const endTime = new Date();
    const timeUsed = Math.floor((endTime - startTime) / 1000);
    const correctCount = answers.filter(a => a.correct).length;
    
    // 保存结果 → POST到教师端读取的API
    const result = {
        id: Utils.generateId(),
        type: 'result',
        class: studentInfo.class,
        name: studentInfo.name,
        score: score,
        correctCount: correctCount,
        totalQuestions: currentQuestions.length,
        timeUsed: timeUsed,
        answers: answers,
        mode: gameMode,
        competitionName: currentCompetitionName || '自由练习',
        completedAt: new Date().toISOString()
    };
    
    try {
        await API.postStudentData(result);
    } catch (error) {
        console.error('保存结果失败:', error);
    }
    
    // 显示结果页面
    showResultPage(result);
}

function showResultPage(result) {
    hideAllPages();
    document.getElementById('result-page').classList.add('active');
    
    document.getElementById('result-score').textContent = result.score;
    document.getElementById('result-correct').textContent = result.correctCount;
    document.getElementById('result-time').textContent = Utils.formatTime(result.timeUsed);
    
    // 显示答题详情
    const detailsList = document.getElementById('result-details-list');
    detailsList.innerHTML = result.answers.map((a, index) => `
        <div class="detail-item ${a.correct ? 'correct' : 'wrong'}">
            <span>第${index + 1}题：${a.question.join(', ')}</span>
            <span>${a.correct ? '✓ 正确' : '✗ 错误'}</span>
        </div>
    `).join('');
    
    // 计算排名（从教师端读取的数据中比较）
    calculateRank(result);
}

async function calculateRank(result) {
    try {
        const data = await API.getStudentData(); // 从教师端读取的API
        const results = data.filter(item =>
            item.type === 'result' &&
            item.competitionName === result.competitionName
        );
        
        const sorted = [...results, result].sort((a, b) => (b.score || 0) - (a.score || 0));
        const rank = sorted.findIndex(r => r.id === result.id) + 1;
        
        document.getElementById('result-rank').textContent = rank;
    } catch (error) {
        document.getElementById('result-rank').textContent = '-';
    }
}

function reviewAnswers() {
    hideAllPages();
    document.getElementById('review-page').classList.add('active');
    
    const reviewList = document.getElementById('review-list');
    reviewList.innerHTML = answers.map((a, index) => `
        <div class="question-item" style="flex-direction: column; align-items: flex-start;">
            <div style="margin-bottom: 10px;">
                <strong>第${index + 1}题：</strong>${a.question.join(', ')}
            </div>
            <div style="color: ${a.correct ? '#11998e' : '#eb3349'}; margin-bottom: 10px;">
                你的答案：${a.expression || '未作答'} ${a.correct ? '✓' : '✗'}
            </div>
            ${!a.correct ? `
                <div style="color: #667eea;">
                    正确答案：${a.solution || '无解'}
                </div>
            ` : ''}
        </div>
    `).join('');
}

// ==================== 工具函数 ====================

function hideAllPages() {
    document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
    });
}
