<script>
    // ---------- 画板部分（与原代码一致） ----------
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d');
    let gridSize = 16;
    let pixelSize = 25;
    let currentTool = 'pencil';
    let isDrawing = false;
    let currentMode = 'binary';
    let currentColor = '#000000';

    // 黑白映射
    let binaryCodeMap = { '#FFFFFF': '0', '#000000': '1' };
    // 彩色预设
    const colorPresets = [
        { name: '橙', color: '#D2691E', defaultCode: '0' },
        { name: '浅褐', color: '#E6D5B8', defaultCode: '1' },
        { name: '棕', color: '#8B7355', defaultCode: '2' },
        { name: '米白', color: '#FFFDF5', defaultCode: '3' },
        { name: '深褐', color: '#3C2A21', defaultCode: '4' },
        { name: '红', color: '#FF6B6B', defaultCode: '5' },
        { name: '蓝', color: '#4D96FF', defaultCode: '6' },
        { name: '绿', color: '#51CF66', defaultCode: '7' },
        { name: '黄', color: '#FFD43B', defaultCode: '8' },
        { name: '紫', color: '#9D4EDD', defaultCode: '9' }
    ];
    let colorCodeMap = {};

    function normalizeColor(c) { return c.toUpperCase(); }

    function initColorCodeMap() {
        colorCodeMap = {};
        colorPresets.forEach(p => { colorCodeMap[normalizeColor(p.color)] = p.defaultCode; });
    }

    // 画板基础函数
    function setGridSize(size) {
        let newSize = Math.min(64, Math.max(4, Math.floor(size)));
        gridSize = newSize;
        const maxCanvas = 500;
        pixelSize = Math.floor(maxCanvas / gridSize);
        if (pixelSize < 8) pixelSize = 8;
        canvas.width = gridSize * pixelSize;
        canvas.height = gridSize * pixelSize;
        drawGrid();
    }

    function drawGrid() {
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#D4C1A7';
        ctx.lineWidth = 1;
        for (let i = 0; i <= gridSize; i++) {
            ctx.beginPath();
            ctx.moveTo(i * pixelSize, 0);
            ctx.lineTo(i * pixelSize, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * pixelSize);
            ctx.lineTo(canvas.width, i * pixelSize);
            ctx.stroke();
        }
    }

    function setPixel(x, y, color) {
        if (x < 0 || x >= gridSize || y < 0 || y >= gridSize) return;
        ctx.fillStyle = color;
        ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
        ctx.strokeStyle = '#D4C1A7';
        ctx.strokeRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
    }

    function getPixelColor(x, y) {
        const imgData = ctx.getImageData(x * pixelSize, y * pixelSize, 1, 1);
        const [r,g,b] = imgData.data;
        return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
    }

    function floodFill(startX, startY, targetColor, replaceColor) {
        if (targetColor === replaceColor) return;
        const stack = [[startX, startY]];
        const visited = new Set();
        while (stack.length) {
            const [x, y] = stack.pop();
            if (x<0 || x>=gridSize || y<0 || y>=gridSize) continue;
            const key = `${x},${y}`;
            if (visited.has(key)) continue;
            visited.add(key);
            if (getPixelColor(x, y) === targetColor) {
                setPixel(x, y, replaceColor);
                stack.push([x+1,y], [x-1,y], [x,y+1], [x,y-1]);
            }
        }
    }

    function handleDraw(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let mouseX = (e.clientX - rect.left) * scaleX;
        let mouseY = (e.clientY - rect.top) * scaleY;
        const x = Math.floor(mouseX / pixelSize);
        const y = Math.floor(mouseY / pixelSize);
        if (x<0 || x>=gridSize || y<0 || y>=gridSize) return;
        if (currentTool === 'pencil') {
            setPixel(x, y, currentColor);
        } else if (currentTool === 'eraser') {
            setPixel(x, y, '#FFFFFF');
        } else if (currentTool === 'fill') {
            const target = getPixelColor(x, y);
            floodFill(x, y, target, currentColor);
        }
    }
    function startDraw(e) { isDrawing = true; handleDraw(e); }
    function moveDraw(e) { if (isDrawing && (currentTool === 'pencil' || currentTool === 'eraser')) handleDraw(e); }
    function endDraw() { isDrawing = false; }

    // 获取正确答案（二维数组）
    function getCorrectEncoding() {
        const codeMap = currentMode === 'binary' ? binaryCodeMap : colorCodeMap;
        let correct = [];
        for (let y = 0; y < gridSize; y++) {
            let row = [];
            for (let x = 0; x < gridSize; x++) {
                let color = getPixelColor(x, y);
                let code = codeMap[normalizeColor(color)];
                if (code === undefined) {
                    // 黑白模式下，非纯白纯黑按非白色处理（输出1）
                    if (currentMode === 'binary' && color !== '#FFFFFF') code = '1';
                    else code = '?';
                }
                row.push(code);
            }
            correct.push(row);
        }
        return correct;
    }

    // 解析学生填写的答案
    function parseUserAnswer(answerText) {
        const lines = answerText.trim().split(/\r?\n/);
        let parsed = [];
        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (line === '') continue;
            // 按空格或制表符分割
            let tokens = line.split(/\s+/);
            let row = [];
            for (let t of tokens) {
                if (t.length > 0) row.push(t);
            }
            parsed.push(row);
        }
        return parsed;
    }

    // 检查答案
    function checkAnswer() {
        const userText = document.getElementById('userAnswer').value;
        const userRows = parseUserAnswer(userText);
        const correct = getCorrectEncoding();
        const feedbackDiv = document.getElementById('feedback');
        let html = '';
        let allCorrect = true;

        // 检查行数
        if (userRows.length !== gridSize) {
            html += `<p class="wrong">❌ 行数不正确：当前画板是 ${gridSize} 行，你填写了 ${userRows.length} 行。</p>`;
            allCorrect = false;
        }

        for (let i = 0; i < Math.min(userRows.length, gridSize); i++) {
            const userRow = userRows[i];
            const correctRow = correct[i];
            let rowCorrect = true;
            if (userRow.length !== gridSize) {
                html += `<p class="wrong">📌 第 ${i+1} 行：期望 ${gridSize} 个编码，你填写了 ${userRow.length} 个。</p>`;
                rowCorrect = false;
                allCorrect = false;
                continue;
            }
            for (let j = 0; j < gridSize; j++) {
                if (userRow[j] !== correctRow[j]) {
                    rowCorrect = false;
                    allCorrect = false;
                }
            }
            if (rowCorrect) {
                html += `<p class="correct">✅ 第 ${i+1} 行 正确</p>`;
            } else {
                html += `<p class="wrong">❌ 第 ${i+1} 行 错误（期望：${correctRow.join(' ')}）</p>`;
            }
        }

        if (allCorrect && userRows.length === gridSize) {
            html = `<p class="correct">🎉 恭喜！所有行的编码都正确！🎉</p>`;
        } else if (userRows.length === gridSize && !allCorrect) {
            html += `<p class="wrong">✏️ 请修改错误的行，再试一次。</p>`;
        }
        feedbackDiv.innerHTML = html;
    }

    // 显示正确答案（在反馈区域）
    function showAnswer() {
        const correct = getCorrectEncoding();
        let answerStr = '';
        for (let i = 0; i < correct.length; i++) {
            answerStr += correct[i].join(' ') + '\n';
        }
        document.getElementById('feedback').innerHTML = `<p>📖 正确答案（按行，空格分隔）：</p><pre style="font-family: monospace;">${answerStr}</pre>`;
    }

    function copyAnswer() {
        const correct = getCorrectEncoding();
        let answerStr = '';
        for (let i = 0; i < correct.length; i++) {
            answerStr += correct[i].join(' ') + '\n';
        }
        navigator.clipboard.writeText(answerStr).then(() => alert('正确答案已复制')).catch(() => alert('手动复制'));
    }

    // 规则应用（手动刷新规则映射）
    function applyRules() {
        if (currentMode === 'binary') {
            const white = document.getElementById('binaryWhiteCode').value.trim();
            const black = document.getElementById('binaryBlackCode').value.trim();
            if (white !== '') binaryCodeMap['#FFFFFF'] = white;
            if (black !== '') binaryCodeMap['#000000'] = black;
        } else {
            for (let i = 0; i < colorPresets.length; i++) {
                const input = document.getElementById(`colorCode_${i}`);
                if (input) {
                    let val = input.value.trim();
                    if (val === '') val = colorPresets[i].defaultCode;
                    colorCodeMap[normalizeColor(colorPresets[i].color)] = val;
                }
            }
        }
        // 可以给个提示
        document.getElementById('feedback').innerHTML = '<p>✅ 编码规则已更新，记得检查答案哦。</p>';
    }

    // 模式切换
    function setMode(mode) {
        currentMode = mode;
        const binaryModeBtn = document.getElementById('binaryModeBtn');
        const colorModeBtn = document.getElementById('colorModeBtn');
        const binaryPanel = document.getElementById('binaryColorPanel');
        const colorPanel = document.getElementById('colorRulePanel');
        if (mode === 'binary') {
            binaryModeBtn.classList.add('active');
            colorModeBtn.classList.remove('active');
            binaryPanel.style.display = 'grid';
            colorPanel.style.display = 'none';
            currentColor = '#000000';
            rebuildBinaryColorSelect();
        } else {
            colorModeBtn.classList.add('active');
            binaryModeBtn.classList.remove('active');
            binaryPanel.style.display = 'none';
            colorPanel.style.display = 'block';
            rebuildColorRulePanel();
            rebuildColorSelectForColorMode();
            currentColor = colorPresets[0].color;
        }
    }

    // 构建UI组件（颜色选择器等）
    function rebuildBinaryColorSelect() {
        let old = document.getElementById('binaryColorSelect');
        if (old) old.remove();
        const div = document.createElement('div');
        div.id = 'binaryColorSelect';
        div.style.display = 'flex';
        div.style.gap = '15px';
        div.style.marginBottom = '15px';
        div.style.justifyContent = 'center';
        const whiteBtn = document.createElement('button');
        whiteBtn.style.backgroundColor = '#FFFFFF';
        whiteBtn.style.border = '2px solid #ccc';
        whiteBtn.style.width = '50px';
        whiteBtn.style.height = '40px';
        whiteBtn.style.borderRadius = '12px';
        whiteBtn.style.cursor = 'pointer';
        whiteBtn.onclick = () => { currentColor = '#FFFFFF'; };
        const blackBtn = document.createElement('button');
        blackBtn.style.backgroundColor = '#000000';
        blackBtn.style.border = '2px solid #ccc';
        blackBtn.style.width = '50px';
        blackBtn.style.height = '40px';
        blackBtn.style.borderRadius = '12px';
        blackBtn.style.cursor = 'pointer';
        blackBtn.onclick = () => { currentColor = '#000000'; };
        div.appendChild(whiteBtn);
        div.appendChild(blackBtn);
        const container = document.querySelector('.canvas-container');
        container.parentNode.insertBefore(div, container.nextSibling);
    }

    function rebuildColorSelectForColorMode() {
        let old = document.getElementById('colorModeSelect');
        if (old) old.remove();
        const div = document.createElement('div');
        div.id = 'colorModeSelect';
        div.style.display = 'flex';
        div.style.flexWrap = 'wrap';
        div.style.gap = '8px';
        div.style.marginBottom = '15px';
        div.style.justifyContent = 'center';
        colorPresets.forEach(p => {
            const btn = document.createElement('button');
            btn.style.backgroundColor = p.color;
            btn.style.width = '36px';
            btn.style.height = '36px';
            btn.style.borderRadius = '8px';
            btn.style.border = '2px solid transparent';
            btn.style.cursor = 'pointer';
            btn.onclick = () => { currentColor = p.color; };
            div.appendChild(btn);
        });
        const container = document.querySelector('.canvas-container');
        container.parentNode.insertBefore(div, container.nextSibling);
        if (div.firstChild) div.firstChild.style.border = '2px solid var(--accent-orange)';
    }

    function rebuildColorRulePanel() {
        const container = document.getElementById('colorRuleContainer');
        container.innerHTML = '';
        colorPresets.forEach((p, idx) => {
            const cur = colorCodeMap[normalizeColor(p.color)] || p.defaultCode;
            const item = document.createElement('div');
            item.className = 'color-rule-item';
            item.innerHTML = `
                <div class="color-preview" style="background-color: ${p.color};"></div>
                <span>${p.name}</span>
                <input type="text" id="colorCode_${idx}" value="${cur}" maxlength="2" style="width: 50px;">
            `;
            container.appendChild(item);
        });
    }

    // 清空/重置
    function clearCanvas() {
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawGrid();
    }
    function resetCanvas() {
        setGridSize(16);
        clearCanvas();
        if (currentMode === 'binary') {
            document.getElementById('binaryWhiteCode').value = '0';
            document.getElementById('binaryBlackCode').value = '1';
            binaryCodeMap = { '#FFFFFF': '0', '#000000': '1' };
        } else {
            initColorCodeMap();
            rebuildColorRulePanel();
        }
        document.getElementById('userAnswer').value = '';
        document.getElementById('feedback').innerHTML = '<p>✏️ 已重置，请重新绘制并填写答案。</p>';
    }
    function saveArtwork() {
        const link = document.createElement('a');
        link.download = `pixel-art-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
    function setActiveTool(tool) {
        currentTool = tool;
        document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tool + 'Tool').classList.add('active');
    }

    // 事件绑定
    function bindEvents() {
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', moveDraw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseleave', endDraw);

        document.getElementById('size8x8').addEventListener('click', () => setGridSize(8));
        document.getElementById('size16x16').addEventListener('click', () => setGridSize(16));
        document.getElementById('size32x32').addEventListener('click', () => setGridSize(32));
        document.getElementById('applySizeBtn').addEventListener('click', () => {
            let val = parseInt(document.getElementById('customSize').value);
            if (isNaN(val)) val = 16;
            val = Math.min(64, Math.max(4, val));
            setGridSize(val);
            document.getElementById('customSize').value = val;
        });
        document.getElementById('clearBtn').addEventListener('click', clearCanvas);
        document.getElementById('resetBtn').addEventListener('click', resetCanvas);
        document.getElementById('saveBtn').addEventListener('click', saveArtwork);
        document.getElementById('pencilTool').addEventListener('click', () => setActiveTool('pencil'));
        document.getElementById('fillTool').addEventListener('click', () => setActiveTool('fill'));
        document.getElementById('eraserTool').addEventListener('click', () => setActiveTool('eraser'));
        document.getElementById('binaryModeBtn').addEventListener('click', () => setMode('binary'));
        document.getElementById('colorModeBtn').addEventListener('click', () => setMode('color'));
        document.getElementById('applyRuleBtn').addEventListener('click', applyRules);
        document.getElementById('checkBtn').addEventListener('click', checkAnswer);
        document.getElementById('showAnswerBtn').addEventListener('click', showAnswer);
        document.getElementById('copyAnswerBtn').addEventListener('click', copyAnswer);
    }

    // 初始化
    function init() {
        initColorCodeMap();
        setGridSize(16);
        setActiveTool('pencil');
        bindEvents();
        setMode('binary');
        clearCanvas();
    }
    init();
</script>
