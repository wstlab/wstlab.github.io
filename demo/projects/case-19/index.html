<body>
<div class="app-container">
    
    <div id="loginView" class="login-card">
        <h2>学迹 · 登录</h2>
        <div class="login-sub">输入演示称呼即可进入个人笔记空间</div>
        <div class="login-field">
            <label>👤 姓名</label>
            <input type="text" id="loginNameInput" placeholder="例如 张小凡" autocomplete="off">
        </div>
        <button class="login-btn" id="loginBtn">进入笔记平台</button>
        <div id="loginError" class="login-error hidden"></div>
    </div>

    
    <div id="platformView" class="platform-card hidden">
        <div class="platform-header">
            <h1>我的笔记舱</h1>
            <div class="user-badge">
                <span id="displayName"></span>
                <button class="logout-btn" id="logoutBtn">退出登录</button>
            </div>
        </div>

        
        <div id="identityBar" class="greeting">✅ 已登录，只能查看和提交本人笔记</div>

        <div class="main-dash">
            
            <div class="panel">
                <h2>📝 记录新笔记</h2>
                <div class="field">
                    <label>📌 主题</label>
                    <input type="text" id="noteTopic" placeholder="例如 微积分基本定理" maxlength="120">
                </div>
                <div class="field">
                    <label>📄 主要内容</label>
                    <textarea id="noteContent" placeholder="写下你的学习心得……"></textarea>
                </div>
                <div class="button-group">
                    <button class="btn primary" id="submitNoteBtn">📬 提交笔记</button>
                    <button class="btn" id="clearFieldsBtn">🧹 清空</button>
                </div>
                <div id="submitStatus" class="status-badge">✍️ 填写主题和内容后提交</div>
            </div>

            
            <div class="panel">
                <h2>📚 我的笔记列表</h2>
                <div style="display: flex; gap: 0.6rem; align-items: center; margin-bottom: 1rem;">
                    <button class="btn primary" id="refreshMyNotesBtn">🔄 刷新我的笔记</button>
                    <span class="name-hint" id="activeQueryName"></span>
                </div>
                
                <div id="noteListContainer" class="notes-container">
                    <div class="empty-message">登录后自动加载你的笔记</div>
                </div>
                <div id="queryStatus" class="status-badge">⏳ 等待加载笔记</div>
            </div>
        </div>

        <div class="footer-note">
            <code>POST → https://qf.kjxs.site/api/iZxBplKvUQC</code> <code>GET → /all</code>
        </div>
    </div>
</div>

<script>
(function() {
    // ----- 接口地址 -----
    const SUBMIT_URL = 'https://qf.kjxs.site/api/iZxBplKvUQC';
    const QUERY_ALL_URL = 'https://qf.kjxs.site/api/iZxBplKvUQC/all';

    // ----- DOM 元素 (登录视图) -----
    const loginView = document.getElementById('loginView');
    const platformView = document.getElementById('platformView');
    const loginNameInput = document.getElementById('loginNameInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');

    // ----- DOM 元素 (主平台) -----
    const displayNameSpan = document.getElementById('displayName');
    const identityBar = document.getElementById('identityBar');
    const activeQueryNameSpan = document.getElementById('activeQueryName');
    
    // 提交相关
    const noteTopic = document.getElementById('noteTopic');
    const noteContent = document.getElementById('noteContent');
    const submitBtn = document.getElementById('submitNoteBtn');
    const clearBtn = document.getElementById('clearFieldsBtn');
    const submitStatus = document.getElementById('submitStatus');

    // 查询相关
    const refreshBtn = document.getElementById('refreshMyNotesBtn');
    const noteListContainer = document.getElementById('noteListContainer');
    const queryStatus = document.getElementById('queryStatus');
    const logoutBtn = document.getElementById('logoutBtn');

    // ----- 状态变量 (当前登录用户) -----
    let currentUser = '';  // 登录成功后设置

    // ----- 工具函数：转义HTML -----
    function escapeHtml(unsafe) {
        if (!unsafe) return '';
        return unsafe
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // ----- 渲染笔记列表 -----
    function renderNotes(notesArray) {
        if (!notesArray || notesArray.length === 0) {
            noteListContainer.innerHTML = `<div class="empty-message">📭 暂无笔记，写一条吧</div>`;
            return;
        }
        const sorted = [...notesArray].reverse();
        let html = '';
        sorted.forEach(n => {
            const topic = n.topic || '无主题';
            const content = n.content || n.mainContent || '无内容';
            html += `
                <div class="note-item">
                    <div class="note-topic">
                        ${escapeHtml(topic)}
                        <span>📌</span>
                    </div>
                    <div class="note-content">${escapeHtml(content)}</div>
                </div>
            `;
        });
        noteListContainer.innerHTML = html;
    }

    // ----- 设置查询状态 -----
    function setQueryStatus(msg, type = 'info') {
        queryStatus.textContent = msg;
        queryStatus.className = 'status-badge';
        if (type === 'error') queryStatus.classList.add('error');
        else if (type === 'success') queryStatus.classList.add('success');
    }

    // ----- 设置提交状态 -----
    function setSubmitStatus(msg, type = 'info') {
        submitStatus.textContent = msg;
        submitStatus.className = 'status-badge';
        if (type === 'error') submitStatus.classList.add('error');
        else if (type === 'success') submitStatus.classList.add('success');
    }

    // ----- 从服务器获取当前用户的笔记 -----
    async function fetchMyNotes() {
        if (!currentUser) {
            setQueryStatus('⚠️ 未登录', 'error');
            return;
        }
        const name = currentUser;
        setQueryStatus(`⏳ 正在获取 ${escapeHtml(name)} 的笔记...`, 'info');

        try {
            const response = await fetch(QUERY_ALL_URL, {
                method: 'GET',
                headers: { 'Accept': 'application/json' },
                mode: 'cors'
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            const allSubmissions = data.submissions || [];
            // 只保留当前登录用户的笔记
            const personalNotes = allSubmissions.filter(item => item.name === name);

            renderNotes(personalNotes);
            if (personalNotes.length > 0) {
                setQueryStatus(`✅ 找到 ${personalNotes.length} 条笔记`, 'success');
            } else {
                setQueryStatus(`ℹ️ 暂无笔记，可提交第一条`, 'info');
            }
        } catch (error) {
            console.error('查询失败:', error);
            setQueryStatus(`❌ 查询出错: ${error.message}`, 'error');
            noteListContainer.innerHTML = `<div class="empty-message">查询失败，请重试</div>`;
        }
    }

    // ----- 提交笔记 -----
    async function submitNote() {
        if (!currentUser) {
            setSubmitStatus('⚠️ 未登录，无法提交', 'error');
            return;
        }

        const topic = noteTopic.value.trim();
        const content = noteContent.value.trim();

        if (!topic || !content) {
            setSubmitStatus('❌ 主题和内容都不能为空', 'error');
            return;
        }

        const payload = {
            name: currentUser,
            topic: topic,
            content: content,
            timestamp: new Date().toISOString()
        };

        setSubmitStatus('⏳ 正在提交到服务器...', 'info');

        try {
            const response = await fetch(SUBMIT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                mode: 'cors'
            });

            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            setSubmitStatus(`✅ 笔记已提交 (${escapeHtml(currentUser)})`, 'success');
            // 清空输入
            noteTopic.value = '';
            noteContent.value = '';

            // 提交成功后立即刷新笔记列表
            await fetchMyNotes();

        } catch (error) {
            console.error('提交错误:', error);
            setSubmitStatus(`❌ 提交失败: ${error.message}`, 'error');
        }
    }

    // ----- 清空输入 -----
    function clearFields() {
        noteTopic.value = '';
        noteContent.value = '';
        setSubmitStatus('📭 已清空输入', 'info');
    }

    // ----- 登录函数 -----
    function login() {
        const name = loginNameInput.value.trim();
        if (name === '') {
            showLoginError('请输入演示称呼');
            return;
        }

        // 简单过滤，不允许空白名
        if (name.length < 1) {
            showLoginError('姓名至少1个字符');
            return;
        }

        // 登录成功
        currentUser = name;
        
        // 更新UI显示
        displayNameSpan.textContent = escapeHtml(name);
        identityBar.innerHTML = `✅ 当前用户：<strong>${escapeHtml(name)}</strong> （只能查看/提交本人笔记）`;
        activeQueryNameSpan.textContent = `📌 ${escapeHtml(name)}`;
        
        // 隐藏登录视图，显示主平台
        loginView.classList.add('hidden');
        platformView.classList.remove('hidden');
        
        // 清除登录错误
        hideLoginError();
        
        // 清空登录输入框（可选）
        loginNameInput.value = '';
        
        // 立即加载该用户的笔记
        fetchMyNotes();
        
        // 将登录状态保存到sessionStorage (页面刷新后保留登录)
        sessionStorage.setItem('learnNotes_user', name);
    }

    // ----- 退出登录 -----
    function logout() {
        currentUser = '';
        // 清除sessionStorage
        sessionStorage.removeItem('learnNotes_user');
        // 显示登录界面，隐藏主平台
        platformView.classList.add('hidden');
        loginView.classList.remove('hidden');
        // 清空主平台表单和列表
        noteTopic.value = '';
        noteContent.value = '';
        noteListContainer.innerHTML = `<div class="empty-message">登录后自动加载你的笔记</div>`;
        setQueryStatus('⏳ 等待登录', 'info');
        setSubmitStatus('✍️ 登录后可提交', 'info');
        // 聚焦登录输入框
        loginNameInput.focus();
    }

    // ----- 辅助：登录错误提示 -----
    function showLoginError(msg) {
        loginError.textContent = msg;
        loginError.classList.remove('hidden');
    }
    function hideLoginError() {
        loginError.classList.add('hidden');
        loginError.textContent = '';
    }

    // ----- 检查sessionStorage中是否有保存的用户 (自动登录) -----
    function checkAutoLogin() {
        const savedUser = sessionStorage.getItem('learnNotes_user');
        if (savedUser) {
            currentUser = savedUser;
            // 更新UI显示
            displayNameSpan.textContent = escapeHtml(savedUser);
            identityBar.innerHTML = `✅ 当前用户：<strong>${escapeHtml(savedUser)}</strong> （只能查看/提交本人笔记）`;
            activeQueryNameSpan.textContent = `📌 ${escapeHtml(savedUser)}`;
            
            // 切换到主平台
            loginView.classList.add('hidden');
            platformView.classList.remove('hidden');
            
            // 加载笔记
            fetchMyNotes();
        } else {
            // 确保登录视图显示
            loginView.classList.remove('hidden');
            platformView.classList.add('hidden');
        }
    }

    // ----- 事件绑定 -----
    loginBtn.addEventListener('click', login);
    loginNameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            login();
        }
    });

    submitBtn.addEventListener('click', submitNote);
    clearBtn.addEventListener('click', clearFields);
    refreshBtn.addEventListener('click', () => {
        if (currentUser) fetchMyNotes();
        else setQueryStatus('⚠️ 未登录', 'error');
    });
    logoutBtn.addEventListener('click', logout);

    // ----- 初始化：检查自动登录 -----
    checkAutoLogin();

    // 如果未登录，确保登录错误信息隐藏
    hideLoginError();
})();
