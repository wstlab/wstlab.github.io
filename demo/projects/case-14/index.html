    <script>
        // 音效系统
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        window.captureLesson=()=>({mission:currentMissionIndex+1,target:targets[currentMissionIndex]});
function playBeep(freq, duration, type = 'sine') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const container = document.getElementById('radar-container');
        const scanner = document.getElementById('scanner');
        const drawGroup = document.getElementById('draw-group');
        const interactionPanel = document.getElementById('interaction-panel');
        const btnStartScan = document.getElementById('btn-start-scan');
        const btnVerify = document.getElementById('btn-verify');
        const feedbackText = document.getElementById('feedback-text');

        const SCALE = 0.5;
        let centerX, centerY;
        let currentMissionIndex = 0;

        const targets = [
            {
                id: 'target-submarine',
                name: '潜水艇',
                angle: 30, 
                correctBase: '北', 
                correctOffset: '东', 
                correctAngle: 60, 
                correctDistance: 480,
                baseAxis: 'N',
                successAudio: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/MY62AFWGYbMXkJTwKXAgMK.mp3'
            },
            {
                id: 'target-cruiser',
                name: '巡洋舰',
                angle: 165,
                correctBase: '西', 
                correctOffset: '北', 
                correctAngle: 15, 
                correctDistance: 600,
                baseAxis: 'W',
                successAudio: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/kTcHmA5ZJtVjibRTLW6A68.mp3'
            },
            {
                id: 'target-destroyer',
                name: '护卫舰',
                angle: 210,
                correctBase: '西', 
                correctOffset: '南', 
                correctAngle: 30, 
                correctDistance: 630,
                baseAxis: 'W',
                successAudio: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/a24PGkVcpzXvB5kqybaqNE.mp3'
            }
        ];

        function init() {
            centerX = window.innerWidth / 2;
            centerY = window.innerHeight / 2;

            // 绘制背景圆圈
            const maxR = Math.max(centerX, centerY);
            for (let r = 100; r < maxR; r += 100) {
                const circle = document.createElement('div');
                circle.className = 'grid-circle';
                circle.style.width = (r * 2) + 'px';
                circle.style.height = (r * 2) + 'px';
                circle.style.left = (centerX - r) + 'px';
                circle.style.top = (centerY - r) + 'px';
                container.appendChild(circle);
            }

            // 设置目标初始位置
            targets.forEach(t => {
                const el = document.getElementById(t.id);
                const rad = t.angle * Math.PI / 180;
                const distPx = t.correctDistance * SCALE;
                
                // 严格对齐：容器的 left/top 对应图标中心点
                el.style.left = (centerX + Math.cos(rad) * distPx) + 'px';
                el.style.top = (centerY - Math.sin(rad) * distPx) + 'px';
                // 恢复标准的中心对齐 transform
                el.style.transform = 'translate(-50%, -50%)';
            });
        }

        async function startScanning() {
            btnStartScan.style.display = 'none';
            const target = targets[currentMissionIndex];
            
            // 扫描音效
            const scanInterval = setInterval(() => playBeep(800, 0.05), 200);
            
            scanner.style.opacity = '1';
            const startAngle = currentMissionIndex === 0 ? 0 : targets[currentMissionIndex-1].angle;
            const distPx = target.correctDistance * SCALE;
            
            // 动态调整扫描线长度以精准指向目标中心
            scanner.style.width = distPx + 'px';

            await anime({
                targets: scanner,
                rotate: [-startAngle, -target.angle],
                duration: 2000,
                easing: 'easeInOutQuad'
            }).finished;

            clearInterval(scanInterval);
            playBeep(1200, 0.2);

            // 显示目标图标
            anime({
                targets: `#${target.id}`,
                opacity: [0, 1],
                scale: [0.5, 1],
                duration: 800,
                easing: 'easeOutElastic(1, .8)'
            });

            // 1. 扫描完成后立即显示角度和距离信息
            await drawTargetInfo(target);

            // 2. 弹出交互面板
            document.getElementById('target-name-display').textContent = target.name;
            interactionPanel.classList.remove('hidden-panel');
        }

        btnVerify.onclick = async () => {
            const target = targets[currentMissionIndex];
            const base = document.getElementById('input-dir-base').value;
            const offset = document.getElementById('input-dir-offset').value;
            const angle = parseInt(document.getElementById('input-angle').value);
            const distance = parseInt(document.getElementById('input-distance').value);

            if (base === target.correctBase && offset === target.correctOffset && 
                angle === target.correctAngle && distance === target.correctDistance) {
                
                feedbackText.textContent = "✅ 验证成功！定向音箱已激活，正在发射信号...";
                feedbackText.style.color = "#4ade80";
                
                // 播放成功语音
                const audio = new Audio(target.successAudio);
                audio.play();

                // 激活音效
                playBeep(400, 0.1);
                setTimeout(() => playBeep(800, 0.3), 100);

                // 发射信号动画
                launchSignal(target);
                
                // 辅助线已在扫描后绘制，此处不再重复绘制

                setTimeout(() => {
                    interactionPanel.classList.add('hidden-panel');
                    currentMissionIndex++;
                    if (currentMissionIndex < targets.length) {
                        document.getElementById('mission-name').textContent = targets[currentMissionIndex].name;
                        btnStartScan.style.display = 'block';
                        btnStartScan.textContent = `搜寻下一个目标：${targets[currentMissionIndex].name}`;
                        // 重置输入
                        document.getElementById('input-angle').value = '';
                        document.getElementById('input-distance').value = '';
                        feedbackText.textContent = '';
                    } else {
                        document.getElementById('mission-name').textContent = "任务圆满完成！";
                        feedbackText.textContent = "🎉 所有目标已成功定位并建立连接！";
                    }
                }, 2000);

            } else {
                feedbackText.textContent = "❌ 描述有误，请重新核对雷达信息。";
                feedbackText.style.color = "#f87171";
                playBeep(200, 0.5, 'sawtooth');
            }
        };

        function launchSignal(target) {
            const pulse = document.createElement('div');
            pulse.className = 'signal-pulse';
            pulse.style.left = centerX + 'px';
            pulse.style.top = centerY + 'px';
            pulse.style.width = '0px';
            pulse.style.transform = `rotate(${-target.angle}deg)`;
            container.appendChild(pulse);

            const distPx = target.correctDistance * SCALE;
            anime({
                targets: pulse,
                width: distPx,
                opacity: [1, 0],
                duration: 1000,
                easing: 'easeOutExpo',
                complete: () => pulse.remove()
            });
        }

        function drawTargetInfo(target) {
            return new Promise(resolve => {
                const rad = target.angle * Math.PI / 180;
                const distPx = target.correctDistance * SCALE;
                const endX = centerX + Math.cos(rad) * distPx;
                const endY = centerY - Math.sin(rad) * distPx;

                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", centerX);
                line.setAttribute("y1", centerY);
                line.setAttribute("x2", centerX);
                line.setAttribute("y2", centerY);
                line.setAttribute("class", "measure-line");
                drawGroup.appendChild(line);

                const arc = document.createElementNS("http://www.w3.org/2000/svg", "path");
                arc.setAttribute("class", "angle-arc");
                drawGroup.appendChild(arc);

                anime({
                    targets: line,
                    x2: endX,
                    y2: endY,
                    duration: 1000,
                    easing: 'easeOutQuad'
                });

                let baseRad;
                if (target.baseAxis === 'N') baseRad = Math.PI / 2;
                else if (target.baseAxis === 'W') baseRad = Math.PI;
                
                const obj = { t: 0 };
                anime({
                    targets: obj,
                    t: 1,
                    duration: 1000,
                    easing: 'easeOutQuad',
                    update: () => {
                        const currentRad = baseRad + (rad - baseRad) * obj.t;
                        const r = 50;
                        const x1 = centerX + Math.cos(baseRad) * r;
                        const y1 = centerY - Math.sin(baseRad) * r;
                        const x2 = centerX + Math.cos(currentRad) * r;
                        const y2 = centerY - Math.sin(currentRad) * r;
                        const sweep = (rad > baseRad) ? 0 : 1;
                        arc.setAttribute("d", `M ${centerX} ${centerY} L ${x1} ${y1} A ${r} ${r} 0 0 ${sweep} ${x2} ${y2} Z`);
                    },
                    complete: () => {
                        // 标注角度文字
                        const angleText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                        const midRad = baseRad + (rad - baseRad) / 2;
                        const textR = 75;
                        angleText.setAttribute("x", centerX + Math.cos(midRad) * textR);
                        angleText.setAttribute("y", centerY - Math.sin(midRad) * textR);
                        angleText.setAttribute("style", "fill: white; font-weight: bold; font-size: 16px; paint-order: stroke; stroke: black; stroke-width: 2px;");
                        angleText.setAttribute("text-anchor", "middle");
                        angleText.textContent = target.correctAngle + "°";
                        drawGroup.appendChild(angleText);

                        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                        text.setAttribute("x", (centerX + endX) / 2 + 15);
                        text.setAttribute("y", (centerY + endY) / 2 - 15);
                        text.setAttribute("class", "distance-text");
                        text.textContent = target.correctDistance + "km";
                        drawGroup.appendChild(text);
                        resolve();
                    }
                });
            });
        }

        btnStartScan.onclick = startScanning;
        window.onload = init;
        window.onresize = init;
    </script>
