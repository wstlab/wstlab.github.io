<script>
(function() {
    // ----- 常量与配置 -----
    const PLANT_INTERVAL = 5;      // 每5秒安静 种1棵树
    const CUT_INTERVAL = 3;        // 每3秒吵闹 砍1棵树
    const INIT_TREES = 10;
    const RING_BUFFER_SECONDS = 10; // 在内存中保留最近10秒音频 (用于砍树时提取)

    // DOM 元素
    const dbDisplay = document.getElementById('dbDisplay');
    const thresholdTag = document.getElementById('thresholdTag');
    const thresholdSlider = document.getElementById('thresholdSlider');
    const quietTimeDisplay = document.getElementById('quietTimeDisplay');
    const noisyTimeDisplay = document.getElementById('noisyTimeDisplay');
    const treeCountDisplay = document.getElementById('treeCountDisplay');
    const forestHint = document.getElementById('forestHint');
    const statusMsg = document.getElementById('statusMessage');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resetBtn = document.getElementById('resetBtn');

    // ----- 状态变量 -----
    let isListening = false;             // 是否正在监听
    let audioContext = null;
    let analyser = null;
    let mediaStream = null;
    let source = null;
    let animationFrame = null;
    let processor = null;                // ScriptProcessorNode 用于获取原始音频
    let gainNode = null;                 // 用于静音输出

    // 环形缓冲区 (PCM Float32, 单声道)
    let ringBuffer = null;               // Float32Array
    let ringWriteIndex = 0;              // 当前写入位置
    let ringBufferLength = 0;             // 总采样点数 (根据采样率计算)
    let ringSampleRate = 48000;           // 默认, 实际会从 context 获取

    // 时间累计 (秒)
    let quietTime = 0;            // 安静累计
    let noisyTime = 0;            // 吵闹累计

    // 树的数量
    let treeCount = INIT_TREES;

    // 上次更新的时间戳 (用于计算delta)
    let lastUpdateTimestamp = null;

    // 上次触发种树/砍树的整数基点 (基于累计时间)
    let lastQuietTrigger = 0;      // Math.floor(quietTime / PLANT_INTERVAL)
    let lastNoisyTrigger = 0;      // Math.floor(noisyTime / CUT_INTERVAL)

    // 当前阈值 (从滑块读取)
    let currentThreshold = 42;      // 默认

    // 音量映射 (0-100)
    let currentVolume = 0;

    // ----- 辅助函数  mm:ss 显示 -----
    function formatTime(seconds) {
        if (seconds < 0) seconds = 0;
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // 更新所有UI (时间、树木、分贝、阈值标签)
    window.captureLesson=()=>({volume:currentVolume,threshold:currentThreshold,quietTime:Math.round(quietTime),noisyTime:Math.round(noisyTime),trees:treeCount});
function refreshUI() {
        quietTimeDisplay.textContent = formatTime(quietTime);
        noisyTimeDisplay.textContent = formatTime(noisyTime);
        treeCountDisplay.textContent = treeCount;
        dbDisplay.textContent = currentVolume !== undefined && isListening ? Math.round(currentVolume) : '—';
        thresholdTag.textContent = `阈值 ${currentThreshold}%`;
    }

    // 重置统计 (保留麦克风状态)
    function resetStats() {
        quietTime = 0;
        noisyTime = 0;
        treeCount = INIT_TREES;
        lastQuietTrigger = 0;
        lastNoisyTrigger = 0;

        // 重置时间戳避免delta突变
        if (isListening) {
            lastUpdateTimestamp = performance.now() / 1000;  // 秒为单位
        } else {
            lastUpdateTimestamp = null;
        }

        refreshUI();
        forestHint.innerText = '🌲 重置森林 · 重新开始计数';
        setTimeout(() => {
            forestHint.innerText = '达标安静 → 种树 🌲 | 超标吵闹 → 砍树 ';
        }, 1500);
    }

    // ---------- 录音保存相关 ----------
    // 获取当前时间字符串用于文件名: 砍树_2025-03-18_14-25-30.wav
    function getDateTimeString() {
        const d = new Date();
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const hours = String(d.getHours()).padStart(2, '0');
        const minutes = String(d.getMinutes()).padStart(2, '0');
        const seconds = String(d.getSeconds()).padStart(2, '0');
        return `${year}-${month}-${day}_${hours}-${minutes}-${seconds}`;
    }

    // 将 Float32Array (值范围 -1 到 1) 编码为 WAV 格式的 ArrayBuffer (16-bit PCM)
    function encodeWAV(samples, sampleRate) {
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);

        // RIFF chunk descriptor
        writeString(view, 0, 'RIFF');
        view.setUint32(4, 36 + samples.length * 2, true); // file size - 8
        writeString(view, 8, 'WAVE');
        // fmt subchunk
        writeString(view, 12, 'fmt ');
        view.setUint32(16, 16, true); // fmt chunk size
        view.setUint16(20, 1, true); // audio format (1 = PCM)
        view.setUint16(22, 1, true); // numChannels (1)
        view.setUint32(24, sampleRate, true); // sampleRate
        view.setUint32(28, sampleRate * 2, true); // byteRate (sampleRate * numChannels * bytesPerSample)
        view.setUint16(32, 2, true); // blockAlign (numChannels * bytesPerSample)
        view.setUint16(34, 16, true); // bitsPerSample
        // data subchunk
        writeString(view, 36, 'data');
        view.setUint32(40, samples.length * 2, true); // data size

        // Write PCM samples (16-bit little-endian)
        let offset = 44;
        for (let i = 0; i < samples.length; i++) {
            let s = Math.max(-1, Math.min(1, samples[i]));
            s = s < 0 ? s * 0x8000 : s * 0x7FFF; // convert to 16-bit int
            view.setInt16(offset, s, true);
            offset += 2;
        }

        return buffer;
    }

    function writeString(view, offset, str) {
        for (let i = 0; i < str.length; i++) {
            view.setUint8(offset + i, str.charCodeAt(i));
        }
    }

    // 从环形缓冲区提取最近 N 秒音频，保存为 WAV 文件
    function saveRecentAudio(seconds = 3) {
        if (!ringBuffer || ringBufferLength === 0 || !isListening) {
            console.warn('缓冲区未就绪或未在监听');
            return;
        }

        const samplesNeeded = Math.floor(seconds * ringSampleRate);
        const totalSamples = ringBufferLength; // 缓冲区总采样点数 (例如10秒)

        // 实际可读取的采样数 (不能超过缓冲区总大小，也受已写入数据量限制，但环形始终有数据)
        let samplesToRead = Math.min(samplesNeeded, totalSamples);
        if (samplesToRead === 0) return;

        // 准备输出数组
        const outputSamples = new Float32Array(samplesToRead);

        // 计算读取起始索引 (当前写入位置之前的 samplesToRead 个采样，注意环形回绕)
        let startIndex = (ringWriteIndex - samplesToRead + totalSamples) % totalSamples;

        if (startIndex + samplesToRead <= totalSamples) {
            // 连续区间
            outputSamples.set(ringBuffer.subarray(startIndex, startIndex + samplesToRead));
        } else {
            // 回绕，分两段
            const firstPart = totalSamples - startIndex;
            outputSamples.set(ringBuffer.subarray(startIndex, totalSamples), 0);
            outputSamples.set(ringBuffer.subarray(0, samplesToRead - firstPart), firstPart);
        }

        // 编码 WAV
        const wavBuffer = encodeWAV(outputSamples, ringSampleRate);
        const blob = new Blob([wavBuffer], { type: 'audio/wav' });

        // 生成文件名
        const filename = `砍树_${getDateTimeString()}.wav`;

        // 触发下载
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        // 可选: 提示保存成功
        forestHint.innerText = `📼 已保存录音: ${filename}`;
        setTimeout(() => {
            forestHint.innerText = '达标安静 → 种树 🌲 | 超标吵闹 → 砍树 ';
        }, 2000);
    }

    // 更新树木基于安静/吵闹时间的增量 (并通过砍树事件触发录音保存)
    function updateTreeByTime() {
        // 当前安静时间的触发基数
        const currentQuietTrigger = Math.floor(quietTime / PLANT_INTERVAL);
        // 当前吵闹时间的触发基数
        const currentNoisyTrigger = Math.floor(noisyTime / CUT_INTERVAL);

        // 种树：安静时间每增加一个完整间隔
        if (currentQuietTrigger > lastQuietTrigger) {
            const increase = currentQuietTrigger - lastQuietTrigger;
            treeCount += increase;
            forestHint.innerText = `✅ 达标安静 +${increase} 棵树 🌱`;
        }

        // 砍树：吵闹时间每增加一个完整间隔 
        if (currentNoisyTrigger > lastNoisyTrigger) {
            const decrease = currentNoisyTrigger - lastNoisyTrigger;
            treeCount = Math.max(0, treeCount - decrease);
            forestHint.innerText = `⚠️ 超标吵闹 -${decrease} 棵树 🌲❌`;

            // 每砍一棵树，保存一段录音（最近3秒）
            // 如果一次减少了多棵，就保存多次（每个周期都保存）
            for (let i = 0; i < decrease; i++) {
                /* Only relative volume summaries are collected. */   // 每次砍树保存3秒片段
            }
        }

        // 更新记录
        lastQuietTrigger = currentQuietTrigger;
        lastNoisyTrigger = currentNoisyTrigger;

        // 确保树木不显示负数 (但上面已max)
        treeCount = Math.max(0, treeCount);
    }

    // ----- 音量监测 & 时间累计 (requestAnimationFrame 循环) -----
    function updateLoop() {
        if (!isListening || !analyser) {
            return;
        }

        const now = performance.now() / 1000; // 当前时间秒

        // 1. 获取音量级 (0-100)
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(dataArray);  // 频域能量

        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
            sum += dataArray[i];
        }
        let avg = sum / dataArray.length;          // 0 - 255
        let volume = Math.min(100, Math.floor((avg / 255) * 120));
        currentVolume = Math.min(100, Math.max(0, volume));

        // 2. 与阈值比较，决定安静/吵闹
        const isQuiet = currentVolume < currentThreshold;

        // 3. 计算时间差
        if (lastUpdateTimestamp === null) {
            lastUpdateTimestamp = now;
            animationFrame = requestAnimationFrame(updateLoop);
            refreshUI();
            return;
        }

        let delta = now - lastUpdateTimestamp;
        if (delta > 0.3) delta = 0.3;
        lastUpdateTimestamp = now;

        // 4. 根据状态累计安静/吵闹时间
        if (isQuiet) {
            quietTime += delta;
        } else {
            noisyTime += delta;
        }

        // 5. 根据累计时间更新树木 (内部可能触发录音保存)
        updateTreeByTime();

        // 6. 刷新界面
        refreshUI();

        animationFrame = requestAnimationFrame(updateLoop);
    }

    // ----- 停止监听 (释放资源) -----
    async function stopListening() {
        if (animationFrame) {
            cancelAnimationFrame(animationFrame);
            animationFrame = null;
        }
        if (processor) {
            try { processor.disconnect(); } catch (e) {}
            processor = null;
        }
        if (gainNode) {
            try { gainNode.disconnect(); } catch (e) {}
            gainNode = null;
        }
        if (source) {
            try { source.disconnect(); } catch (e) {}
            source = null;
        }
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
        if (audioContext) {
            if (audioContext.state !== 'closed') {
                await audioContext.close();
            }
            audioContext = null;
        }
        analyser = null;
        isListening = false;
        lastUpdateTimestamp = null;

        // 清空环形缓冲区引用
        ringBuffer = null;
        ringWriteIndex = 0;
        ringBufferLength = 0;

        startBtn.disabled = false;
        stopBtn.disabled = true;
        statusMsg.innerText = '⏸️ 已停止，可重新开始监听';
        dbDisplay.textContent = '—';
    }

    // ----- 开始监听 (请求麦克风) -----
    async function startListening() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            mediaStream = stream;

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;

            source = audioContext.createMediaStreamSource(stream);

            // 创建增益节点并设为0，避免听到自己声音 (但保留音频流)
            gainNode = audioContext.createGain();
            gainNode.gain.value = 0;

            // 设置环形缓冲区 (根据实际采样率)
            ringSampleRate = audioContext.sampleRate;
            ringBufferLength = Math.floor(ringSampleRate * RING_BUFFER_SECONDS);
            ringBuffer = new Float32Array(ringBufferLength);
            ringWriteIndex = 0;

            // 创建 ScriptProcessorNode 获取原始 PCM
            processor = audioContext.createScriptProcessor(4096, 1, 1); // 输入单声道, 输出单声道
            processor.onaudioprocess = (event) => {
                const inputBuffer = event.inputBuffer;
                const channelData = inputBuffer.getChannelData(0); // Float32Array, 范围 -1..1
                // 写入环形缓冲区
                for (let i = 0; i < channelData.length; i++) {
                    ringBuffer[ringWriteIndex] = channelData[i];
                    ringWriteIndex = (ringWriteIndex + 1) % ringBufferLength;
                }
            };

            // 连接节点: source -> analyser -> processor -> gain(0) -> destination
            source.connect(analyser);
            analyser.connect(processor);
            processor.connect(gainNode);
            gainNode.connect(audioContext.destination);

            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }

            lastUpdateTimestamp = performance.now() / 1000;
            isListening = true;

            lastQuietTrigger = Math.floor(quietTime / PLANT_INTERVAL);
            lastNoisyTrigger = Math.floor(noisyTime / CUT_INTERVAL);

            startBtn.disabled = true;
            stopBtn.disabled = false;
            statusMsg.innerText = '🎤 监听中 · 砍树自动保存录音';

            if (animationFrame) cancelAnimationFrame(animationFrame);
            animationFrame = requestAnimationFrame(updateLoop);

        } catch (err) {
            console.error('麦克风错误:', err);
            statusMsg.innerText = '❌ 无法访问麦克风，请检查权限';
            startBtn.disabled = false;
            stopBtn.disabled = true;
            isListening = false;
        }
    }

    // ----- 事件绑定 -----
    startBtn.addEventListener('click', startListening);
    stopBtn.addEventListener('click', stopListening);
    resetBtn.addEventListener('click', resetStats);

    thresholdSlider.addEventListener('input', (e) => {
        currentThreshold = parseInt(e.target.value, 10);
        thresholdTag.textContent = `阈值 ${currentThreshold}%`;
    });

    currentThreshold = parseInt(thresholdSlider.value, 10);
    thresholdTag.textContent = `阈值 ${currentThreshold}%`;
    refreshUI();

    window.addEventListener('beforeunload', () => {
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
        }
        if (audioContext && audioContext.state !== 'closed') {
            audioContext.close();
        }
        if (animationFrame) cancelAnimationFrame(animationFrame);
    });

})();
</script>
