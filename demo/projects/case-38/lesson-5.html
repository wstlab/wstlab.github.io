<script>
    (function() {
        const checkBtn = document.getElementById('checkBtn');
        const resetBtn = document.getElementById('resetBtn');
        const feedback = document.getElementById('feedbackMsg');

        const inputs = document.querySelectorAll('input[type="text"]');

        function countFilled() {
            let count = 0;
            inputs.forEach(inp => {
                if (inp.value.trim() !== '') count++;
            });
            return count;
        }

        function getDepthLabel() {
            const radios = document.querySelectorAll('input[name="depth"]');
            for (let r of radios) {
                if (r.checked) return r.parentElement.textContent.trim();
            }
            return '未选择';
        }

        function handleCheck() {
            const filled = countFilled();
            const total = inputs.length;
            const depth = getDepthLabel();

            let msg = `✅ 你填写了 ${filled}/${total} 个空格；自评：${depth}`;

            if (filled === 0) {
                msg += ' 📝 试着填写一下换算结果吧！';
            } else if (filled < total) {
                msg += ' 💪 继续完成剩下的空格！';
            } else {
                msg += ' 👏 全部填完啦！感受一下95%节水率的力量吧！';
            }

            feedback.textContent = msg;
            feedback.style.color = '#1d4a0d';
        }

        function resetAll() {
            inputs.forEach(inp => inp.value = '');
            document.querySelector('input[name="depth"][value="C"]').checked = true;
            feedback.textContent = '🔄 已重置，重新填写吧！';
            feedback.style.color = '#3d6b2a';
        }

        checkBtn.addEventListener('click', handleCheck);
        resetBtn.addEventListener('click', resetAll);

        inputs.forEach(inp => {
            inp.addEventListener('keydown', e => { if (e.key === 'Enter') handleCheck(); });
        });
    })();
</script>
