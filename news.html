<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动态 — QuickForm</title>
<link href="images/fonts.css" rel="stylesheet">
<script src="languages.js"></script>
<style>
/* === RESET & VARIABLES === */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ink: #1a1a2e;
  --ink-light: #3a3a5e;
  --ink-muted: #6e6e8a;
  --cream: #faf8f4;
  --cream-warm: #f5f0e8;
  --accent-teal: #0d9488;
  --accent-teal-light: #14b8a6;
  --accent-blue: #2563eb;
  --accent-blue-light: #3b82f6;
  --accent-amber: #d97706;
  --accent-rose: #e11d48;
  --accent-emerald: #059669;
  --card-bg: rgba(255,255,255,0.72);
  --card-border: rgba(26,26,46,0.08);
  --font-display: 'Outfit', sans-serif;
  --font-serif: 'Noto Serif SC', serif;
  --font-body: 'Noto Sans SC', sans-serif;
  --radius: 16px;
  --radius-sm: 10px;
}

html { scroll-behavior: smooth; font-size: 16px; }

body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--cream);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* === GLOBAL TEXTURE === */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
}

/* === NAVIGATION === */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  padding: 0 clamp(20px, 4vw, 60px);
  height: 72px; display: flex; align-items: center; justify-content: space-between;
  background: rgba(250,248,244,0.85);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border-bottom: 1px solid var(--card-border);
  transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), box-shadow 0.3s;
}
nav.hidden { transform: translateY(-100%); }
nav .logo {
  font-family: var(--font-display);
  font-weight: 800; font-size: 1.35rem; letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--accent-teal), var(--accent-blue));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
nav .logo span { font-weight: 400; opacity: 0.5; -webkit-text-fill-color: var(--ink-muted); margin-left: 8px; font-size: 0.8rem; }
nav .nav-links {
  display: flex; gap: 28px; align-items: center;
}
nav .nav-links a {
  font-size: 0.85rem; font-weight: 500; color: var(--ink-light);
  transition: color 0.2s; position: relative;
}
nav .nav-links a:hover { color: var(--accent-teal); }
nav .nav-actions {
  display: flex; gap: 12px; align-items: center;
  margin-left: 20px;
}
nav .github-link {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--card-bg); color: var(--ink);
  font-size: 0.8rem; font-weight: 600;
  padding: 8px 16px; border-radius: 100px;
  border: 1px solid var(--card-border);
  transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
  font-family: var(--font-body);
}
nav .github-link:hover {
  background: var(--ink); color: var(--cream);
  border-color: var(--ink);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(26,26,46,0.15);
}
nav .github-link svg {
  width: 16px; height: 16px; fill: currentColor;
}
nav .lang-switcher {
  position: relative;
}
nav .lang-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--ink); color: var(--cream); font-size: 0.8rem;
  padding: 8px 14px 8px 16px; border-radius: 100px; font-weight: 600;
  transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
  border: none; cursor: pointer; font-family: var(--font-body);
}
nav .lang-toggle:hover {
  background: var(--accent-teal);
  box-shadow: 0 4px 16px rgba(13,148,136,0.3);
}
nav .lang-toggle .arrow {
  width: 10px; height: 10px;
  transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
  fill: currentColor;
}
nav .lang-switcher.open .lang-toggle .arrow {
  transform: rotate(180deg);
}
nav .lang-menu {
  position: absolute; top: calc(100% + 8px); right: 0;
  min-width: 120px;
  background: var(--card-bg);
  backdrop-filter: blur(16px) saturate(1.4);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-sm);
  padding: 6px;
  box-shadow: 0 12px 40px rgba(26,26,46,0.12);
  opacity: 0; visibility: hidden;
  transform: translateY(-8px);
  transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
  z-index: 1001;
}
nav .lang-switcher.open .lang-menu {
  opacity: 1; visibility: visible;
  transform: translateY(0);
}
nav .lang-option {
  display: block; width: 100%;
  background: transparent; color: var(--ink-light);
  font-size: 0.8rem; font-weight: 500;
  padding: 8px 12px; border-radius: 8px;
  border: none; cursor: pointer; text-align: left;
  font-family: var(--font-body);
  transition: all 0.2s;
}
nav .lang-option:hover {
  background: rgba(13,148,136,0.08); color: var(--accent-teal);
}
nav .lang-option.active {
  background: var(--accent-teal); color: #fff;
}

@media (max-width: 768px) {
  nav .nav-links {
    display: none;
  }
  nav .nav-actions {
    margin-left: 0;
  }
  nav .github-link span {
    display: none;
  }
  nav .github-link {
    padding: 8px;
  }
  nav .lang-toggle {
    font-size: 0.75rem;
    padding: 6px 12px 6px 14px;
  }
}

/* === HERO === */
#hero {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden; padding: 100px 0 60px;
}
#hero::before {
  content: '';
  position: absolute; top: -30%; right: -20%; width: 80vw; height: 80vw;
  background: radial-gradient(circle, rgba(13,148,136,0.08) 0%, rgba(37,99,235,0.04) 50%, transparent 70%);
  border-radius: 50%; pointer-events: none;
}
#hero::after {
  content: '';
  position: absolute; bottom: -20%; left: -15%; width: 60vw; height: 60vw;
  background: radial-gradient(circle, rgba(217,119,6,0.05) 0%, transparent 60%);
  border-radius: 50%; pointer-events: none;
}
.hero-inner {
  text-align: center; position: relative; z-index: 1; max-width: 900px; margin: 0 auto;
  padding: 0 clamp(20px, 4vw, 60px);
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(13,148,136,0.08); border: 1px solid rgba(13,148,136,0.15);
  padding: 6px 18px; border-radius: 100px; font-size: 0.78rem; font-weight: 500;
  color: var(--accent-teal); margin-bottom: 32px;
  animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) both;
}
.hero-badge::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent-teal); animation: pulse 2s infinite;
}
.hero-title {
  font-family: var(--font-display); font-weight: 900;
  font-size: clamp(3.5rem, 8vw, 7rem); line-height: 1;
  letter-spacing: -3px; margin-bottom: 20px;
  background: linear-gradient(135deg, var(--ink) 30%, var(--accent-teal) 70%, var(--accent-blue));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: fadeUp 0.8s 0.1s cubic-bezier(0.16,1,0.3,1) both;
}
.hero-subtitle {
  font-family: var(--font-serif); font-size: clamp(1.15rem, 2.5vw, 1.6rem);
  font-weight: 500; color: var(--ink); line-height: 1.6; margin-bottom: 12px;
  animation: fadeUp 0.8s 0.2s cubic-bezier(0.16,1,0.3,1) both;
}
.hero-slogan {
  font-size: clamp(0.85rem, 1.5vw, 1rem); color: var(--ink-muted);
  font-weight: 400; margin-bottom: 40px;
  animation: fadeUp 0.8s 0.3s cubic-bezier(0.16,1,0.3,1) both;
}
.hero-actions {
  display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
  animation: fadeUp 0.8s 0.4s cubic-bezier(0.16,1,0.3,1) both;
}
.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  background: linear-gradient(135deg, var(--accent-teal), var(--accent-teal-light));
  color: #fff; padding: 14px 32px; border-radius: 100px;
  font-weight: 600; font-size: 0.95rem; font-family: var(--font-body);
  border: none; cursor: pointer;
  transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
  box-shadow: 0 4px 20px rgba(13,148,136,0.25);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(13,148,136,0.35); }
.btn-secondary {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--card-bg); color: var(--ink); padding: 14px 32px;
  border-radius: 100px; font-weight: 600; font-size: 0.95rem;
  border: 1px solid var(--card-border); cursor: pointer; font-family: var(--font-body);
  transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
}
.btn-secondary:hover { transform: translateY(-2px); border-color: var(--accent-teal); color: var(--accent-teal); }
.hero-stats {
  display: flex; justify-content: center; gap: clamp(32px, 5vw, 64px);
  margin-top: 64px; padding-top: 40px; border-top: 1px solid var(--card-border);
  animation: fadeUp 0.8s 0.5s cubic-bezier(0.16,1,0.3,1) both;
}
.stat-item { text-align: center; }
.stat-num {
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(1.8rem, 3vw, 2.5rem); color: var(--accent-teal);
  letter-spacing: -1px;
}
.stat-label { font-size: 0.8rem; color: var(--ink-muted); margin-top: 4px; font-weight: 400; }

/* === PROBLEM === */
#problem { padding: 100px 0; position: relative; }
.section-label {
  font-family: var(--font-display); font-weight: 700; font-size: 0.7rem;
  letter-spacing: 3px; text-transform: uppercase; color: var(--accent-teal);
  margin-bottom: 16px; display: flex; align-items: center; gap: 12px;
}
.section-label::before {
  content: ''; width: 32px; height: 2px; background: var(--accent-teal); border-radius: 2px;
}
.section-heading {
  font-family: var(--font-serif); font-weight: 700;
  font-size: clamp(1.8rem, 3.5vw, 2.8rem); line-height: 1.3;
  margin-bottom: 20px; color: var(--ink); letter-spacing: -0.5px;
}
.section-desc {
  font-size: clamp(0.95rem, 1.3vw, 1.05rem); line-height: 1.9; color: var(--ink-light);
  max-width: 680px;
}
.problem-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
  margin-top: 56px; align-items: start;
}
.problem-visual {
  position: relative; padding: 40px; border-radius: var(--radius);
  background: linear-gradient(145deg, #1a1a2e, #2a2a4e);
  overflow: hidden; min-height: 360px; display: flex; align-items: center; justify-content: center;
}
.problem-visual::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 30px, rgba(255,255,255,0.02) 30px, rgba(255,255,255,0.02) 31px),
              repeating-linear-gradient(90deg, transparent, transparent 30px, rgba(255,255,255,0.02) 30px, rgba(255,255,255,0.02) 31px);
}
.data-islands {
  position: relative; z-index: 1; display: grid;
  grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%;
}
.island {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-sm); padding: 16px; text-align: center;
  transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
}
.island:hover { background: rgba(255,255,255,0.1); transform: translateY(-4px); }
.island-icon { font-size: 1.6rem; margin-bottom: 8px; }
.island-name { font-size: 0.7rem; color: rgba(255,255,255,0.5); font-weight: 500; }
.island-data { font-family: var(--font-display); font-size: 0.85rem; color: rgba(255,255,255,0.8); margin-top: 4px; font-weight: 600; }
.island-status {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 0.6rem; color: var(--accent-rose); margin-top: 8px;
  background: rgba(225,29,72,0.1); padding: 2px 8px; border-radius: 100px;
}
.problem-cards { display: flex; flex-direction: column; gap: 16px; }
.problem-card {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius); padding: 28px;
  backdrop-filter: blur(10px);
  transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
}
.problem-card:hover { transform: translateX(4px); border-color: rgba(225,29,72,0.2); }
.problem-card h4 {
  font-family: var(--font-serif); font-size: 1.05rem; font-weight: 600;
  margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
}
.problem-card p { font-size: 0.88rem; line-height: 1.7; color: var(--ink-muted); }
.p-icon {
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; flex-shrink: 0;
}
.p-icon.red { background: rgba(225,29,72,0.08); }
.p-icon.amber { background: rgba(217,119,6,0.08); }
.p-icon.gray { background: rgba(110,110,138,0.08); }

/* === SOLUTION (4 STEPS) === */
#solution {
  padding: 100px 0;
  background: linear-gradient(180deg, var(--cream) 0%, var(--cream-warm) 50%, var(--cream) 100%);
  position: relative;
}
.steps-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
  margin-top: 56px;
}
.step-card {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius); padding: 32px 24px;
  backdrop-filter: blur(10px); position: relative;
  transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
}
.step-card:hover { transform: translateY(-6px); box-shadow: 0 20px 50px rgba(0,0,0,0.06); }
.step-num {
  font-family: var(--font-display); font-weight: 900; font-size: 3.5rem;
  line-height: 1; letter-spacing: -2px; margin-bottom: 16px;
  opacity: 0.08;
}
.step-card:nth-child(1) .step-num { color: var(--accent-teal); opacity: 0.2; }
.step-card:nth-child(2) .step-num { color: var(--accent-blue); opacity: 0.2; }
.step-card:nth-child(3) .step-num { color: var(--accent-amber); opacity: 0.2; }
.step-card:nth-child(4) .step-num { color: var(--accent-emerald); opacity: 0.2; }
.step-icon {
  width: 48px; height: 48px; border-radius: 12px; display: flex;
  align-items: center; justify-content: center; font-size: 1.3rem;
  margin-bottom: 16px;
}
.step-card:nth-child(1) .step-icon { background: rgba(13,148,136,0.1); }
.step-card:nth-child(2) .step-icon { background: rgba(37,99,235,0.1); }
.step-card:nth-child(3) .step-icon { background: rgba(217,119,6,0.1); }
.step-card:nth-child(4) .step-icon { background: rgba(5,150,105,0.1); }
.step-card h3 {
  font-family: var(--font-serif); font-size: 1.1rem; font-weight: 600;
  margin-bottom: 10px;
}
.step-card p { font-size: 0.85rem; line-height: 1.75; color: var(--ink-muted); }
.step-connector {
  display: none; /* shown on desktop via pseudo-elements within grid */
}
.prompt-hint {
  background: rgba(37,99,235,0.05); border: 1px solid rgba(37,99,235,0.12);
  border-radius: var(--radius-sm); padding: 12px 14px; margin-top: 12px;
  font-family: 'Courier New', monospace; font-size: 0.72rem;
  color: var(--accent-blue); line-height: 1.6;
}

/* === PRINCIPLE === */
#principle { padding: 100px 0; }
.principle-layout {
  display: grid; grid-template-columns: 1fr 1fr; gap: 60px;
  margin-top: 56px; align-items: center;
}
.principle-diagram {
  position: relative; padding: 48px;
  background: linear-gradient(145deg, var(--ink), #252545);
  border-radius: var(--radius); overflow: hidden;
}
.principle-diagram::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 30% 30%, rgba(13,148,136,0.15), transparent 60%);
}
.flow-container { position: relative; z-index: 1; }
.flow-row {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  margin-bottom: 16px;
}
.flow-box {
  padding: 10px 16px; border-radius: 8px; font-size: 0.75rem;
  font-weight: 600; text-align: center; min-width: 90px;
}
.flow-box.webpage { background: rgba(37,99,235,0.2); color: #93c5fd; border: 1px solid rgba(37,99,235,0.3); }
.flow-box.api { background: rgba(13,148,136,0.25); color: #5eead4; border: 1px solid rgba(13,148,136,0.4); font-size: 0.85rem; padding: 14px 20px; }
.flow-box.db { background: rgba(217,119,6,0.2); color: #fcd34d; border: 1px solid rgba(217,119,6,0.3); }
.flow-box.ai { background: rgba(5,150,105,0.2); color: #6ee7b7; border: 1px solid rgba(5,150,105,0.3); }
.flow-arrow { color: rgba(255,255,255,0.3); font-size: 1.2rem; }
.flow-arrow.down { transform: rotate(90deg); }
.principle-text h3 {
  font-family: var(--font-serif); font-size: 1.5rem; font-weight: 700;
  margin-bottom: 16px;
}
.principle-text p { font-size: 0.92rem; line-height: 1.85; color: var(--ink-light); margin-bottom: 16px; }
.principle-quote {
  border-left: 3px solid var(--accent-teal); padding-left: 20px;
  margin: 24px 0; font-family: var(--font-serif); font-style: italic;
  font-size: 1.05rem; color: var(--ink); line-height: 1.7;
}

/* === CAPABILITIES === */
#capabilities {
  padding: 100px 0;
  background: linear-gradient(180deg, var(--cream), var(--cream-warm));
}
.cap-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
  margin-top: 56px;
}
.cap-card {
  position: relative; border-radius: var(--radius); overflow: hidden;
  padding: 36px 28px; min-height: 260px;
  display: flex; flex-direction: column; justify-content: flex-end;
  transition: all 0.4s cubic-bezier(0.16,1,0.3,1); cursor: default;
}
.cap-card::before {
  content: ''; position: absolute; inset: 0; z-index: 0;
  transition: opacity 0.4s;
}
.cap-card:nth-child(1) { background: linear-gradient(145deg, #0d9488, #0f766e); }
.cap-card:nth-child(2) { background: linear-gradient(145deg, #2563eb, #1d4ed8); }
.cap-card:nth-child(3) { background: linear-gradient(145deg, #d97706, #b45309); }
.cap-card:hover { transform: translateY(-6px) scale(1.01); }
.cap-card .cap-icon {
  font-size: 2.5rem; margin-bottom: 20px; position: relative; z-index: 1;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));
}
.cap-card h3 {
  font-family: var(--font-serif); font-size: 1.3rem; font-weight: 700;
  color: #fff; margin-bottom: 10px; position: relative; z-index: 1;
}
.cap-card p {
  font-size: 0.85rem; line-height: 1.7; color: rgba(255,255,255,0.8);
  position: relative; z-index: 1;
}
.cap-card .cap-tag {
  display: inline-flex; gap: 6px; margin-top: 14px; flex-wrap: wrap;
  position: relative; z-index: 1;
}
.cap-card .cap-tag span {
  background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.9);
  padding: 4px 10px; border-radius: 100px; font-size: 0.7rem; font-weight: 500;
}

/* === CASES === */
#cases { padding: 100px 0; }
.cases-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
  margin-top: 56px;
}
.case-card {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius); overflow: hidden;
  transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
}
.case-card:hover { transform: translateY(-6px); box-shadow: 0 20px 50px rgba(0,0,0,0.06); }
.case-header {
  height: 160px; display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.case-card:nth-child(1) .case-header { background: linear-gradient(135deg, #ecfdf5, #d1fae5); }
.case-card:nth-child(2) .case-header { background: linear-gradient(135deg, #eff6ff, #dbeafe); }
.case-card:nth-child(3) .case-header { background: linear-gradient(135deg, #fffbeb, #fef3c7); }
.case-header .case-emoji { font-size: 3.5rem; }
.case-body { padding: 24px; }
.case-body h3 { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; }
.case-body p { font-size: 0.85rem; line-height: 1.7; color: var(--ink-muted); }

<script>
// 语言切换功能
let currentLang = 'zh';

// 获取翻译文本
const getTranslation = (key, lang = currentLang) => {
  const keys = key.split('.');
  let result = languages[lang];
  for (const k of keys) {
    const arrayMatch = k.match(/^(\w+)\[(\d+)\]$/);
    const indexMatch = k.match(/^\[(\d+)\]$/);
    if (arrayMatch) {
      const arrayName = arrayMatch[1];
      const index = parseInt(arrayMatch[2], 10);
      if (result && result[arrayName] && result[arrayName][index] !== undefined) {
        result = result[arrayName][index];
      } else {
        return null;
      }
    } else if (indexMatch) {
      const index = parseInt(indexMatch[1], 10);
      if (result && result[index] !== undefined) {
        result = result[index];
      } else {
        return null;
      }
    } else if (result && result[k] !== undefined) {
      result = result[k];
    } else {
      return null;
    }
  }
  return result;
};

// 应用翻译
const applyTranslation = (lang) => {
  currentLang = lang;
  
  // 更新HTML语言属性
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang === 'zh_tw' ? 'zh-TW' : 'en';
  
  // 翻译所有带data-key的元素
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    const translation = getTranslation(key, lang);
    if (translation !== null) {
      el.innerHTML = translation;
    }
  });
  
  // 翻译导航链接
  const navLinks = document.querySelectorAll('.nav-links a');
  const navLinkData = languages[lang].nav.links;
  navLinks.forEach((link, index) => {
    if (navLinkData[index]) {
      link.textContent = navLinkData[index].text;
    }
  });
  
  // 翻译Logo副标题
  const logoSub = document.querySelector('.logo span');
  if (logoSub) {
    logoSub.textContent = languages[lang].nav.logoSub;
  }
  
  // 更新语言下拉当前显示与选中状态
  const langNames = { zh: '中文', en: 'English', zh_tw: '繁體' };
  const currentLangLabel = document.querySelector('.lang-toggle .current-lang');
  if (currentLangLabel) {
    currentLangLabel.textContent = langNames[lang] || lang;
  }
  document.querySelectorAll('.lang-option').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
  
  // 保存语言偏好
  localStorage.setItem('quickform_lang', lang);
};

// 检测系统语言
const detectSystemLanguage = () => {
  const savedLang = localStorage.getItem('quickform_lang');
  if (savedLang) {
    return savedLang;
  }
  
  const systemLang = navigator.language || navigator.userLanguage;
  if (systemLang.startsWith('zh')) {
    return systemLang.includes('TW') || systemLang.includes('HK') || systemLang.includes('MO') ? 'zh_tw' : 'zh';
  } else if (systemLang.startsWith('en')) {
    return 'en';
  }
  return 'zh';
};

// 加载并显示新闻
const loadNews = async () => {
  try {
    const response = await fetch('/news.json');
    const news = await response.json();
    
    const ticker = document.getElementById('newsTicker');
    const newsList = document.getElementById('newsList');
    
    if (!ticker || !newsList) return;
    
    // 创建滚动新闻内容（复制一份以实现无缝滚动）
    const createTickerItems = (items) => {
      return items.map(item => `
        <div class="news-ticker-item">
          <span class="news-date">${item.date}</span>
          <span class="news-title">${item.title}</span>
          <span class="news-content">${item.content}</span>
        </div>
      `).join('');
    };
    
    const tickerHTML = createTickerItems(news);
    ticker.innerHTML = tickerHTML + tickerHTML; // 复制一份实现无缝滚动
    
    // 创建新闻卡片列表（显示全部）
    const displayNews = news;
    newsList.innerHTML = displayNews.map(item => `
      <div class="news-card">
        <div class="news-card-date">${item.date}</div>
        <div class="news-card-title">${item.title}</div>
        <div class="news-card-content">${item.content}</div>
      </div>
    `).join('');
    
  } catch (error) {
    console.error('Failed to load news:', error);
  }
};

// 初始化语言
const initLanguage = () => {
  const detectedLang = detectSystemLanguage();
  applyTranslation(detectedLang);
};

// 语言下拉切换事件
const initLanguageSwitcher = () => {
  const switcher = document.querySelector('.lang-switcher');
  const toggle = document.querySelector('.lang-toggle');
  const menu = document.querySelector('.lang-menu');
  if (!switcher || !toggle || !menu) return;

  const setOpen = (open) => {
    switcher.classList.toggle('open', open);
    toggle.setAttribute('aria-expanded', String(open));
  };

  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    setOpen(!switcher.classList.contains('open'));
  });

  menu.querySelectorAll('.lang-option').forEach(btn => {
    btn.addEventListener('click', () => {
      const lang = btn.dataset.lang;
      applyTranslation(lang);
      setOpen(false);
    });
  });

  // 点击外部关闭下拉
  document.addEventListener('click', (e) => {
    if (!switcher.contains(e.target)) {
      setOpen(false);
    }
  });

  // ESC 关闭下拉
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && switcher.classList.contains('open')) {
      setOpen(false);
    }
  });
};

// Scroll reveal
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }
  });
}, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

// Nav hide/show on scroll
let lastScroll = 0;
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => {
  const curr = window.scrollY;
  if (curr > 100 && curr > lastScroll) {
    nav.classList.add('hidden');
  } else {
    nav.classList.remove('hidden');
  }
  lastScroll = curr;
}, { passive: true });

// Smooth anchor scroll
document.querySelectorAll('nav a[href^="#"]').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    const target = document.querySelector(a.getAttribute('href'));
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
});



// 页面加载时初始化
window.addEventListener('DOMContentLoaded', () => {
  initLanguage();
  initLanguageSwitcher();
  loadNews();
});

</script>
</body>
</html>
